[package]
name = "heddle-tools"
description = "Heddle in Rust: the tool registry, the built-in tools, outside tools as processes, and background jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
heddle-llm.workspace = true
heddle-sandbox.workspace = true
heddle-session.workspace = true
futures.workspace = true
serde.workspace = true
# `preserve_order`: argument violations name present properties in the order the schema declares them, as
# DSH's validator does, whatever else the build pulls in.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# The cancellation token every crate passes for a Stop (`AbortSignal` in the TypeScript build). Named here
# until it is a `[workspace.dependencies]` entry, which is the workspace owner's file.
tokio-util = "0.7"

[dev-dependencies]
heddle-config.workspace = true
