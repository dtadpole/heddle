[package]
name = "heddle-events"
description = "Heddle in Rust: the event bus and the named hook points, with the emit, parallel, serial, bail and waterfall modes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures.workspace = true
# The hook ports `ports::BusHooks` implements over the bus. The direction is fixed: these crates keep their
# ports precisely so they never depend on this one.
heddle-agent.workspace = true
heddle-llm.workspace = true
heddle-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The stdio transport of an outside listener: a child process spoken to as line-delimited JSON.
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# A real outside component in the ports tests needs a sandbox gate over the real service.
heddle-sandbox.workspace = true
