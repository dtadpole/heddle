[package]
name = "heddle"
description = "The Rust port of the Heddle harness: one binary judged by the same verifiers as the TypeScript build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library and a thin binary: the library holds the command line, the boot and every command, so each is
# unit-tested in-process; `main.rs` only hands it the process's arguments, environment and streams.
[lib]
name = "heddle"
path = "src/lib.rs"

[[bin]]
name = "heddle"
path = "src/main.rs"

[dependencies]
axum.workspace = true
futures.workspace = true
heddle-agent.workspace = true
heddle-commands = { path = "../heddle-commands" }
heddle-config.workspace = true
heddle-context.workspace = true
heddle-events.workspace = true
heddle-llm.workspace = true
heddle-plan = { path = "../heddle-plan" }
heddle-goal.workspace = true
# The jobs row (`src/plugins/jobs.ts`): background jobs, their tools, background bash and the page's routes.
heddle-jobs.workspace = true

heddle-questions.workspace = true
heddle-sandbox.workspace = true
heddle-schedule.workspace = true
heddle-server.workspace = true
heddle-session.workspace = true
heddle-team = { workspace = true, features = ["compose"] }
heddle-todo.workspace = true
heddle-tools.workspace = true
heddle-web-composer.workspace = true
heddle-web-files.workspace = true
heddle-web-trajectory.workspace = true
heddle-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[lints]
workspace = true
