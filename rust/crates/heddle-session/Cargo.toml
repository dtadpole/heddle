[package]
name = "heddle-session"
description = "Heddle in Rust: the append-only session log, its store layouts, transcripts, definitions and the session tree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
heddle-config.workspace = true
# The message shapes the log records belong to `heddle-llm` (`src/llm/types.ts`), so this crate
# re-exports them instead of keeping a copy that could drift from the wire vocabulary.
heddle-llm.workspace = true
# `preserve_order` keeps a JSON object's keys in insertion order, which is what makes an event, a
# meta record and a definition byte-identical to what the TypeScript store writes with
# `JSON.stringify`. Cargo unifies features, so every crate in the build sees an ordered `Map`.
serde.workspace = true
# `float_roundtrip`: serde_json's default float parser is not correctly rounded (0.9999551342447491
# re-serializes as …492), and `JSON.parse` is, so without it a line the TypeScript build wrote would not
# print back byte for byte. Pinned by `event::tests::a_float_the_typescript_build_wrote_prints_back_unchanged`.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror.workspace = true
zstd.workspace = true
# Not yet in `[workspace.dependencies]`; the integrator is asked to hoist them.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
