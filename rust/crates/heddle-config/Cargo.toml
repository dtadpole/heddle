[package]
name = "heddle-config"
description = "Heddle in Rust: the configuration tree — profiles, patch layers, includes, environment references, validation and provenance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
# `preserve_order`: a row's unknown keys and `config --json` keep the order the layer wrote them in, as the
# TypeScript objects did; without it this crate alone would print sorted keys.
serde_json = { workspace = true, features = ["preserve_order"] }
saphyr.workspace = true
