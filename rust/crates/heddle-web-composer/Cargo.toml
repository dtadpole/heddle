[package]
name = "heddle-web-composer"
description = "Heddle in Rust: the composer routes — runtime context, the context view, the model switcher and the tool catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
futures.workspace = true
serde.workspace = true
# `preserve_order`: a session event is re-serialised in the order it was written, as `JSON.stringify` does.
# Cargo unifies features, so this applies to every crate of the binary — which the byte-compatible log wants.
serde_json = { workspace = true, features = ["preserve_order"] }
