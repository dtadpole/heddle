[package]
name = "heddle-todo"
description = "Heddle in Rust: the todo list and its tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
# `preserve_order`: an event body and a tool answer are written with the TypeScript build's key order, so the
# session log stays byte-compatible. Proposed for the workspace entry; enabled here meanwhile.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
