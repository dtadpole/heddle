[package]
name = "heddle-goal"
description = "Heddle in Rust: session goals, their driver and their tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The driver's chains: one spawned task per session lane, joined through a shared future.
futures.workspace = true
serde.workspace = true
# `preserve_order`: a `goal/change` body and a tool answer are written with the TypeScript build's key order,
# so the session log stays byte-compatible. Proposed for the workspace entry; enabled here meanwhile.
serde_json = { workspace = true, features = ["preserve_order"] }
# The session log every write event-sources from: `SessionLog` is implemented for its store.
heddle-session.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# A real session store in the tests needs its environment type.
heddle-config.workspace = true
