[package]
name = "heddle-web-trajectory"
description = "Heddle in Rust: the trajectory view routes, the ledger and log download"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
# The tool catalog and the shared answer shapes (`http`) are the composer crate's.
heddle-web-composer.workspace = true
serde.workspace = true
# `preserve_order`: the log download and the ledger's fallback rows re-serialise events in their written order.
# `float_roundtrip`: without it serde_json's float parser is not correctly rounded, so a logged
# `0.9999551342447491` reads back one ulp off and the download writes `…492` — measured. Cargo unifies features,
# so this makes every crate of the binary read a float exactly as `JSON.parse` does.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }

