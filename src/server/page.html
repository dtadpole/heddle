<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="heddle-page" content="rail-sections/instant-swell" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heddle</title>
<!--
  The tab's icon, in DSH's own shape: an SVG, declared as one. DSH ships a **pair** of these, chosen by
  `prefers-color-scheme`, and this project has the files for only one of them — `heddle.svg` is the grey-and-orange
  mark, which reads on a light or a dark tab bar, while `heddle-bw.svg` is all black and would vanish on a dark
  one. A link to an invisible icon is worse than no link, so the pair waits for a light-on-dark variant.
-->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /**
   * The palette, read from this machine's reference tab rather than chosen here.
   *
   * Measured on 2026-10-17 with `getComputedStyle` in the same browser: the canvas is #171717, raised surfaces
   * #222222, the border #353535, ink #ededed with #b3b3b3 for supporting text, and one accent blue. The type is
   * its own stack — `-apple-system` and `BlinkMacSystemFont` before the generic sans — and the figure face
   * names "Optimistic Mono" first, falling back through the platform monospace stack. The page is dark by
   * decision: the reference does not offer a light appearance, so following the system here would be a different
   * product rather than a similar one.
   */
  :root {
    color-scheme: dark;
    --bg: #151517;
    --surface: #232324;
    --surface-2: #242424;
    --sidebar: #1c1c1e;
    /** The composer card's surface, read from DSH's own card (#2c2c2e). */
    --composer: #2c2c2e;
    --hover: #2c2c2c;
    --border: #353535;
    --border-strong: #4a4a4a;
    --text: #f9fafb;
    --text-2: #cfd3d6;
    --text-3: #adb2b8;
    --accent: #2694fe;
    --on-accent: #171717;
    --radius: 8px;
    /**
     * DSH's radii, read from its own tokens: `xs` 4, `sm` 8, `md` 12, `lg` 16, `xl` 20, `panel` 28. Naming them the
     * way DSH does is what makes a list row and a panel round by the same rule rather than by two guesses.
     */
    --radius-md: 12px;
    --radius-pill: 999px;
    --shadow-low: 0 1px 1px -1px #0003;
    --shadow-menu: 0 2px 8px -2px #0003;
    /** DSH's own stack (`-apple-system` first, with PingFang SC for Chinese), read from its body. */
    --font: -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", "Optimistic Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --code-bg: #232127;
    --line: var(--border);
  }
  * { box-sizing: border-box; }
  /**
   * **Everything a person can click is a hand.** Measured on 2026-10-17: a tree row had `cursor: pointer`, but every
   * control inside it — the `…`, pin, archive, both header menus' triggers, Send — computed `cursor: default`, because a
   * `<button>`'s initial cursor is the platform's arrow and no rule said otherwise. DSH's own rows and every control in
   * them are `pointer`, which is the difference the owner felt with a mouse. A disabled control keeps the arrow, because
   * a hand there would promise something the control refuses.
   */
  button:not(:disabled):not([aria-disabled='true']),
  summary,
  a[href],
  [role='tab'],
  .untwisty,
  .menu-wrap > button,
  .row,
  [role='treeitem'] {
    cursor: pointer;
  }
  /**
   * A resize grip is the exception, and it needs to be stated **after** the rule above because that rule is more
   * specific than the grips' own: `button:not(:disabled):not([aria-disabled])` counts two pseudo-classes and beats a
   * plain class, so a grip measured `pointer` and promised a click where it offers a drag. Measured on the column grip:
   * expected `col-resize`, computed `pointer`.
   */
  button.column-grip[role='separator'],
  #gutter-left[role='separator'] {
    cursor: col-resize;
  }
  button:disabled,
  [aria-disabled='true'] {
    cursor: default;
  }
  /**
   * The page paints its own surface and its own ink, in both appearances.
   *
   * Measured: the body had no background and no colour, so both came from the platform's default — and in a dark
   * system that is white text on black, which happened to match the palette and hid the problem. The palette is
   * written for a dark surface; on a light system the same rules would have put pale text on white. Naming the two
   * values makes the page's appearance the page's own decision, whichever appearance the reader prefers.
   */
  /**
   * The panes **fill the window**: no outer frame, no gap between them.
   *
   * Measured before this: the body carried a 12px padding and a 12px gap, so the navigation pane started
   * 12px in from every edge and stopped 12px short of the bottom — a floating card look on a layout that is
   * not a card. The divider is an overlay now (zero layout width, 3px of overlap on each side), so the
   * panes can meet without the split bar pushing them apart.
   */
  body {
    margin: 0;
    padding: 0;
    font: 14px/1.5 var(--font);
    display: flex;
    gap: 0;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  /**
   * The sidebar's width is one custom property, read by the panel and by nothing else.
   *
   * The default lives here, so a reader without stored preferences gets 22rem, and the script only ever
   * overwrites the property — measurement and layout can therefore never disagree about which width is in
   * force, which is what happens when a script sets `style.width` on the panel and a stylesheet disagrees.
   */
  :root {
    --sidebar-width: 22rem;
    /**
     * The code face, which is DSH's own stack and the reason it matters: a bare `monospace` resolves to whatever the
     * platform picks, and on this machine that is a face with no CJK coverage — so a Chinese comment in a source file
     * fell back per-glyph to a proportional font and the line lost its column. The CJK faces at the end are what keep
     * a mixed line monospaced.
     *
     * Measured here: Menlo and PingFang SC are installed; SF Mono, JetBrains Mono and Fira Code are not, so they are
     * named for the machines that have them and the rest of the stack carries this one.
     */
    --code-font: "Optimistic Mono", "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, "Liberation Mono", Courier, ui-monospace, "PingFang SC", "Microsoft YaHei", monospace;
    /**
     * The size of a code line, from DSH's theme as well: 12px text on a 19px line.
     *
     * Measured before: 12.48px on 18.1px, which is nearly the same size and a **tighter** line — and the owner's
     * report was that the panel felt intrusive to read. The difference between code that welcomes a reader and code
     * that crowds one is mostly the leading and the gutter, not the point size.
     */
    --code-size: 12px;
    --code-leading: 19px;
  }
  /**
   * The search results, as DSH draws them: a flat list, each row a **session name and the workspace it is in**,
   * because a hit somebody cannot place is a hit they have to open to understand. The tree is replaced while the
   * query stands, rather than filtered, so the answer is about names rather than about where they happen to live.
   */
  #search-results { display: flex; flex-direction: column; gap: .12rem; }
  #search-results .hit { display: flex; align-items: baseline; gap: .4rem; width: 100%; text-align: left; padding: .3rem .4rem; font: inherit; color: inherit; background: none; border: 0; border-radius: .3rem; cursor: pointer; }
  #search-results .hit:hover, #search-results .hit:focus-visible { background: color-mix(in oklab, currentColor 10%, transparent); outline: none; }
  #search-results .hit-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #search-results .hit-workspace { flex: none; font-size: .78rem; opacity: .55; }
  #session-search { width: 100%; margin: 0 0 .5rem; padding: .3rem .45rem; font: inherit; font-size: .8rem; color: inherit; background: color-mix(in oklab, currentColor 6%, transparent); border: 1px solid var(--line); border-radius: .3rem; }
  #session-search::placeholder { opacity: .6; }
  /**
   * The panes are **square by default**.
   *
   * The left navigation and the main area are layout, not surfaces: rounding them was inherited from the
   * composer's redesign (`--radius-panel` was applied here as a default) and it rounded every pane, the
   * trajectory details included. A rounded surface is declared on the element that *is* rounded — see
   * `#composer-card`, which owns its 28px — so adding one later cannot leak into the layout.
   */
  aside { width: var(--sidebar-width); flex: none; overflow-y: auto; padding: .75rem; color: var(--text-2); background: var(--sidebar); }
  /**
   * The conversation column, shared by the transcript and the composer.
   *
   * DSH's own relation, measured at 127.0.0.1:8080 on 2026-10-17: the text column is 680px, the composer card
   * 712px — **the card is 32px wider, 16px on each side** — and both live inside one column whose width a
   * 10px `col-resize` handle changes. The page writes the resolved pixel width here; the fallback keeps the
   * layout sane before the script runs.
   */
  /** The conversation column, DSH's measured `max-width: 680px`. */
  main { --chat-column: 680px; position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); overflow: hidden; }
  /**
   * The divider, in the reference's feel: a **6px hit band** that is invisible until you are near it, then a
   * 10% vertical band with a 2.5px rounded grip in the border colour at its middle. The grip brightens to
   * 55% of the text colour on hover, focus-visible and while dragging, and both fade with the same short
   * transition the rest of the UI uses.
   *
   * Measured from the reference's own splitter: a 6px absolutely-positioned hit element with
   * `cursor: col-resize`; a `::before` band at 10% text opacity and a `::after` grip of
   * `--panel-resize-grip-width: 2.5px`, both `pointer-events: none`, opacity 0 until hovered.
   */
  #gutter-left {
    position: relative;
    z-index: 5;
    flex: none;
    width: 6px;
    /* Zero layout width: 6px minus 3px on each side, so the panes meet and the bar still has a 6px target. */
    margin: 0 -3px;
    cursor: col-resize;
    background: transparent;
    border: none;
    padding: 0;
    touch-action: none;
    outline: none;
  }
  #gutter-left::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: color-mix(in oklab, currentColor 10%, transparent);
    opacity: 0;
    transition: opacity .12s var(--ds-ease-in-out, ease);
  }
  #gutter-left::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2.5px;
    height: 40px;
    border-radius: 9999px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    background: var(--border);
    opacity: 0;
    transition: opacity .12s var(--ds-ease-in-out, ease), background-color .12s var(--ds-ease-in-out, ease);
  }
  #gutter-left:hover::before,
  #gutter-left:focus-visible::before,
  #gutter-left[data-dragging='true']::before {
    opacity: 1;
  }
  #gutter-left:hover::after,
  #gutter-left:focus-visible::after,
  #gutter-left[data-dragging='true']::after {
    opacity: 1;
    background: color-mix(in oklab, var(--text) 55%, transparent);
  }
  h1 { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: .25rem 0 .5rem; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: .4rem .5rem; border-radius: var(--radius); cursor: pointer; }
  li:hover { background: var(--surface); }
  li[aria-current] { background: var(--surface); color: var(--text); }
  .meta { opacity: .6; font-size: .78rem; }
  /**
   * The chat rows, laid out and dressed the way DSH's are.
   *
   * DSH's chat is a centred column of rows with a **flow gap of 6px**, widened to 12px after a response and to
   * 16px after a run of process rows — so a turn's reasoning and tool calls stay tight together while the
   * answer they produced has room. Its user message is a right-aligned rounded bubble; its assistant answer is
   * full width and carries no chrome at all; its reasoning and tool rows are compact one-line disclosures that
   * open into their bodies. Those are the four shapes this block is.
   */
  /**
   * The conversation, in DSH's own numbers: a 680px column, a 6px gap between rows, and 14px on a 24px
   * line. The four ink tokens are DSH's dark aliases (`#f9fafb` primary, `#b3b3b3` tertiary is off on
   * purpose — DSH uses `#adb2b8`, `#81858c` caption), named here so the chat's palette can be read in
   * one place instead of inferred from a dozen rules.
   */
  #log {
    /**
     * DSH's reading size: **14px on a 24px line**, which is what its `--dsh-content-font-size` resolves to and what
     * its assistant paragraphs measure — re-measured on two of its live session pages while this was being written
     * (a paragraph came back 14px/24px on both). 13px/20px is DSH's *reasoning* body, not the answer's. The
     * variables stay, because the markdown block and the composer's own text read from them.
     */
    --chat-size: 14px;
    /**
     * the reference's leading, measured on its live page: its answer paragraphs compute to **14px / 22.75px** (a
     * 1.625 ratio) while its lists are 14/21 and its table cells 14/20. DSH's 24px was the previous reference, and
     * the owner asked for the reference's denser reading instead — the size is the same, the text simply sits tighter.
     */
    --chat-leading: 22.75px;
    --chat-text: #f9fafb;
    --chat-secondary: #cfd3d6;
    --chat-muted: #adb2b8;
    --chat-caption: #81858c;
    --chat-bubble: #2c2c2e;
    --chat-code: #1e1e21;
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
    padding: 16px max(24px, calc((100% - var(--chat-column)) / 2));
    font-size: var(--chat-size); line-height: var(--chat-leading);
  }
  #log > * { min-width: 0; }
  /**
   * The conversation minimap — the reference's measured shape, not an approximation of it.
   *
   * A 30px rail 4px from the chat's right edge, vertically centred, with one 12px row per message. The rail fades in
   * (that is the entrance animation) and its bars carry the hover scale, so the rail itself stays still while the
   * bars move — the effect in the reference is the neighbourhood swelling, not the panel moving.
   */
  #minimap {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    z-index: 6; width: 30px; pointer-events: auto;
    opacity: 0; transition: opacity .24s ease;
  }
  #minimap[hidden] { display: none; }
  #minimap[data-visible='true'] { opacity: 1; }
  #minimap-rows {
    display: flex; flex-direction: column; overflow: hidden;
    padding: 4px 6px 4px 0; margin-right: -6px; will-change: transform;
  }
  #minimap .mm-row { display: flex; align-items: center; justify-content: flex-end; flex: 0 0 auto; height: 12px; padding-right: 4px; }
  /**
   * The reference's bar carries **no transition at all** — `transition: all` with a zero duration, measured on
   * the reference — so both the hover swell and the scroll window's opacity change in the frame they are applied.
   * Ours eased opacity over .18s while the transform was already instant; that remaining ease was a deviation.
   */
  #minimap .mm-bar {
    width: 12px; border-radius: 1px; transform-origin: right center;
    transition: none;
  }
  /** The two inks of the reference: the person in the read ink, the answer in the secondary one. */
  #minimap .mm-bar[data-role='user'] { background: var(--text); }
  #minimap .mm-bar[data-role='assistant'] { background: color-mix(in oklab, var(--text-2) 70%, transparent); }
  #minimap .mm-bar[data-role='tool'], #minimap .mm-bar[data-role='reasoning'] { background: color-mix(in oklab, var(--text-3) 80%, transparent); }
  #minimap-hit {
    position: absolute; inset: 0; padding: 0; background: none; border: 0; border-radius: 6px; cursor: pointer;
  }
  #minimap-hit:focus-visible { outline: 1px solid color-mix(in oklab, var(--text) 45%, transparent); outline-offset: 2px; }
  /** The preview card: the reference measures 300×81 at `#242424`, radius 8, sitting left of the rail. */
  #minimap-preview {
    position: absolute; right: 34px; width: 300px; max-height: 120px; overflow: hidden;
    padding: 10px 12px; border-radius: 8px; background: #242424; color: var(--text);
    font-size: 13px; line-height: 20px; pointer-events: none;
    box-shadow: 0 2px 10px -2px #0006;
    opacity: 0; transition: opacity .16s ease;
  }
  #minimap-preview[hidden] { display: none; }
  #minimap-preview[data-visible='true'] { opacity: 1; }
  @media (max-width: 1180px) { #minimap { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    #minimap, #minimap .mm-bar, #minimap-preview { transition: none; }
  }
  .turn { white-space: pre-wrap; overflow-wrap: anywhere; }
  /**
   * The goal bar. The phase is a colour and a word; the objective takes the room. The buttons are the
   * person's verbs, and they are only the ones the transition table allows right now.
   */
  #goal-bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; padding: .4rem .75rem; border-bottom: 1px solid var(--line); font-size: 13px; }
  #goal-bar[hidden] { display: none; }
  #goal-phase { font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  #goal-bar[data-phase='active'] #goal-phase { color: #2fa36b; }
  #goal-bar[data-phase='paused'] #goal-phase { color: #b7791f; }
  #goal-bar[data-phase='blocked'] #goal-phase { color: #d14343; }
  #goal-bar[data-phase='complete'] #goal-phase { color: color-mix(in oklab, currentColor 55%, transparent); }
  #goal-objective { flex: 1; min-width: 8rem; }
  #goal-rounds { opacity: .7; }
  #goal-actions { display: flex; gap: .25rem; }
  #goal-actions button { font: inherit; font-size: 12px; padding: .1rem .45rem; }
  /**
   * The person's own message: **a right-aligned bubble**, DSH's `Sixlwa_bubble`.
   *
   * Meaured on two of DSH's live session pages (this is the one its DOM is unambiguous about): the bubble is
   * `border-radius: 20px`, `padding: 10px 16px`, on `#2c2c2e` (`--dsw-specific-bubble`), and its `userStack`
   * parent is `align-items: flex-end` — so it sits against the right edge of the 680px column, content-width up
   * to the column, never a full-width block. An earlier reading in this file claimed a left-aligned block with a
   * small radius; that was wrong, and the measurement is written here so it is not "fixed" back.
   */
  /**
   * **Right-aligned and content-width**, which is what DSH's own chat shows and what the owner confirmed against it:
   * `align-self: flex-end` inside the flex column puts the bubble against the right edge of the reading column, and
   * with `width: auto` it hugs its text instead of stretching. The full-width 12px-radius reading that briefly
   * replaced this rule was wrong for DSH — its bubble is 20px on `#2c2c2e` with 10px/16px padding, and its
   * `userStack` is `align-items: flex-end`. A stretched block can have the same right edge as a right-aligned
   * bubble, which is why the check measures the bubble's **own width** as well as its edge.
   */
  .turn.user {
    align-self: flex-end; max-width: 100%; width: fit-content; padding: 10px 16px;
    border: 0; border-radius: 20px;
    background: var(--chat-bubble); color: var(--chat-text);
    font-size: 14px; line-height: 22px; white-space: pre-wrap;
  }
  /** The answer: no border, no bubble, roomier leading — DSH's `AssistantMarkdown` root (14px on 24px). */
  /** The answer follows the chat's leading variable (the reference's 22.75), not a local 24. */
  .turn.assistant { margin-top: 6px; font-size: 14px; line-height: var(--chat-leading); color: var(--chat-text); }
  /**
   * The document's own rhythm and its code blocks, from DSH's markdown renderer: a paragraph is
   * `margin: 16px 0`, and a block of code is its own surface rather than a quoted aside.
   */
  /**
   * the reference's own rhythm, measured: a paragraph's margin is `0 0 12px` (no top margin), a list item leads at
   * 1.5 (21px) and carries `margin-top: 4px`, and a table cell leads at 20px. DSH's 16px paragraph spacing was the
   * previous reference; 12px is what makes the answer read at the density the owner asked to match.
   */
  .turn.assistant.markdown p { margin: 0 0 12px; }
  .turn.assistant.markdown ul, .turn.assistant.markdown ol { margin: 0 0 12px; padding-left: 1.4em; line-height: 1.5; }
  .turn.assistant.markdown li { margin-top: 4px; }
  .turn.assistant.markdown li:first-child { margin-top: 0; }
  .turn.assistant.markdown td, .turn.assistant.markdown th { font-size: 14px; line-height: 20px; }
  .turn.assistant.markdown pre { margin: 16px 0; padding: 10px 12px; background: var(--chat-code); border-radius: 8px; overflow-x: auto; }
  .turn.assistant.markdown pre code { font-family: var(--code-font); font-size: 12.5px; line-height: 19px; background: none; padding: 0; }
  .turn.assistant[data-state='running']::after { content: '▍'; margin-left: .1rem; opacity: .45; }
  /**
   * **The live state**, read from DSH's own stylesheets: a row that is still arriving carries a slow masked sweep — its
   * `.sweep` is `mask-image: linear-gradient(105deg, transparent 0, black 40%, black 60%, transparent 100%)` driven by a
   * `shimmer-sweep` keyframe — rather than only a static caret. This adds that sweep on top of the caret, at the same
   * 105° angle, and lets a reader who asked for reduced motion keep the caret alone.
   */
  .turn.assistant[data-state='running'] { position: relative; }
  .turn.assistant[data-state='running']::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 0%, color-mix(in oklab, var(--chat-text) 10%, transparent) 50%, transparent 100%);
    -webkit-mask-image: linear-gradient(105deg, transparent 0%, #000 40%, #000 60%, transparent 100%);
    mask-image: linear-gradient(105deg, transparent 0%, #000 40%, #000 60%, transparent 100%);
    animation: heddle-shimmer-sweep 1.6s linear infinite;
  }
  @keyframes heddle-shimmer-sweep {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .turn.assistant[data-state='running']::before { animation: none; }
  }
  /**
   * A drawn answer is a document, so it follows the document's whitespace rather than the row's `pre-wrap`
   * (which would double every newline the markup already carries), and its first and last blocks sit flush.
   */
  .turn.assistant.markdown { white-space: normal; }
  /**
   * The row's own actions, under the answer — DSH's `AssistantMarkdown` action row (`margin-top: 16px`,
   * pulled left so the glyph lines up with the text rather than centring under it). They are quiet until the
   * row is hovered or the button is focused, because an answer is read far more often than it is copied.
   */
  .turn .actions { display: flex; gap: .15rem; margin-top: .3rem; margin-left: -.3rem; }
  .turn .action {
    width: 1.5rem; height: 1.5rem; display: grid; place-items: center; padding: 0;
    font: inherit; font-size: .78rem; color: inherit; background: none; border: none;
    border-radius: .3rem; opacity: 0; cursor: pointer; transition: opacity .12s;
  }
  .turn:hover .action, .turn .action:focus-visible, .turn .action[data-copied='true'] { opacity: .6; }
  .turn .action:hover { opacity: 1; background: color-mix(in oklab, currentColor 10%, transparent); }
  .turn .action[data-copied='true'] { opacity: 1; }
  .turn.assistant.markdown > :first-child { margin-top: 0; }
  .turn.assistant.markdown > :last-child { margin-bottom: 0; }
  /** A refusal or a failure is a sentence, not a bordered quote. */
  .turn.denied { color: #d14343; }
  /**
   * Process rows — reasoning and tool calls — are DSH's **one-line disclosures**.
   *
   * DSH's row is exactly 24px tall while closed (`lcKema_root:not([data-expanded]){height:calc(24px + …)}`),
   * with a kind icon at rest and a **chevron that only appears on hover or focus** —
   * `O_Ebla_title:is(:hover,:focus-visible) .O_Ebla_chevron{opacity:1}` — and once open the summary row
   * stays **sticky** at the top of its own body (`position:sticky;top:0;background:base`). Those three
   * behaviours are the interaction the owner asked to copy, so they are one rule-group here.
   */
  details.turn { font-size: 13px; }
  details.turn.tool { font-size: 14px; }
  details.turn > summary {
    display: flex; align-items: center; gap: 6px; min-height: 24px; min-width: 0;
    cursor: pointer; list-style: none; padding: 0; color: var(--chat-muted);
  }
  details.turn > summary:hover, details.turn > summary:focus-visible { color: var(--chat-secondary); }
  details.turn > summary:focus-visible { outline: 1px solid color-mix(in oklab, currentColor 45%, transparent); outline-offset: 2px; border-radius: 4px; }
  details.turn > summary::-webkit-details-marker { display: none; }
  /** Both glyphs share one 14px box, so the row never shifts when one replaces the other. */
  details.turn > summary .glyph { position: relative; flex: none; width: 14px; height: 14px; display: grid; place-items: center; }
  details.turn > summary .glyph > svg { grid-area: 1 / 1; transition: opacity .1s; }
  details.turn > summary .glyph > .kind { opacity: 1; }
  details.turn > summary .glyph > .chevron { opacity: 0; }
  details.turn > summary:hover .glyph > .kind,
  details.turn > summary:focus-visible .glyph > .kind,
  details.turn[open] > summary .glyph > .kind { opacity: 0; }
  details.turn > summary:hover .glyph > .chevron,
  details.turn > summary:focus-visible .glyph > .chevron,
  details.turn[open] > summary .glyph > .chevron { opacity: 1; }
  /** The title, DSH's `Think`; then its dot separator (`lcKema_separator`, 2px, margin 0 8px). */
  details.turn > summary .title { flex: none; white-space: nowrap; }
  details.turn.tool > summary .title { color: var(--chat-muted); }
  details.turn > summary .sep { flex: none; width: 2px; height: 2px; border-radius: 1px; margin: 0 8px; background: var(--chat-caption); }
  /** The one-line hint beside the title: DSH's summary, 13px on 20px, ellipsized rather than wrapped. */
  details.turn > summary .hint { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; line-height: 20px; color: var(--chat-caption); }
  /**
   * The summary line DSH shows while a row is still arriving: its `data-streaming` summary fades out at the
   * end rather than being clipped, because a truncated live line and a finished one look identical otherwise.
   */
  details.turn[data-state='running'] > summary .hint { mask-image: linear-gradient(90deg, #000 calc(100% - 3rem), transparent); }
  details.turn[data-state='error'] > summary { color: #d14343; opacity: .95; }
  /**
   * While open, the summary is a **sticky** header of its own body (DSH's
   * `lcKema_root[data-expanded] [data-open] [data-disclosure-row]{position:sticky;top:0;background:base}`),
   * so scrolling a long tool output never hides which call it came from. DSH also adds 8px below it.
   */
  details.turn[open] > summary {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    padding-bottom: 8px;
  }
  /**
   * The body is **text**, not a quoted code aside: DSH renders a reasoning body as an ordinary markdown
   * block at 13px on 20px in the tertiary ink, with no rule down its left edge and no italics.
   */
  details.turn > [data-body] {
    margin: 0 0 .35rem; padding: 0; border: 0;
    white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 20px; color: var(--chat-muted);
  }
  details.turn.reasoning > [data-body] { white-space: pre-wrap; }
  details.turn.tool > [data-body] { white-space: normal; }
  /** A tool's two halves are blocks of their own, on the same code surface the answers use. */
  details.turn.tool pre {
    margin: 6px 0; padding: 8px 10px; background: var(--chat-code); border-radius: 8px;
    overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: var(--code-font); font-size: 12.5px; line-height: 19px; color: var(--chat-secondary);
  }
  details.turn.tool [data-result] { color: var(--chat-secondary); }
  details.turn.tool[data-state='running'] > summary { opacity: .6; }
  /**
   * DSH's view ring, measured on its own tablist on 2026-10-17: the tablist is transparent with 8px of left padding; each
   * tab is **plain text** — no background, no border, no radius — 13px at weight 500, with 9px of padding below, and the
   * selected tab is told apart by **colour alone** (`rgb(122,170,255)`) against the muted `rgb(173,178,184)` of the other.
   * This UI drew a bordered, tinted, rounded box, which is the shape of a segmented control rather than DSH's ring.
   */
  /**
   * Measured from DSH's own tablist, property by property: a **36px gap** between tabs, tabs at 13px/500 with
   * `padding: 0 0 9px`, and the selected tab marked two ways — the accent colour (`rgb(122,170,255)`) **and** a 2px
   * `::after` underline sitting 1px below the padding box. The underline is a pseudo-element, which a first pass missed
   * because it read only the element's own background and border.
   */
  nav#views { display: flex; gap: 36px; padding: .5rem .75rem 0; border-bottom: 1px solid var(--line); }
  nav#views button {
    position: relative;
    font: inherit; font-size: 13px; font-weight: 500; padding: 0 0 9px;
    background: none; border: 0; border-radius: 0; color: var(--text-3); cursor: pointer;
  }
  nav#views button:hover { color: var(--text); }
  nav#views button[aria-selected='true'] { color: #7aaaff; }
  nav#views button[aria-selected='true']::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; border-radius: 2px 2px 0 0; background: #7aaaff;
  }
  /**
   * `hidden` has to win over this file's own display rules.
   *
   * Measured: the Chat rows were still drawn above the ledger in the Trajectory view. `#log` sets
   * `display: flex` with an **id** selector, and the browser's `[hidden] { display: none }` is a type-level
   * default — so the id won, `hidden` did nothing, and both views were on screen at once. A view ring that
   * leaves the previous view visible is worse than no ring: it looks like the ledger has chat in it.
   *
   * `!important` is the honest tool here rather than a specificity race, because the rule's meaning is
   * "hidden means hidden" and every future display rule must lose to it.
   */
  [hidden] { display: none !important; }
  #ledger { flex: 1; overflow-y: auto; padding: .65rem .85rem .85rem; font-size: .79rem; line-height: 1.45; }
  #ledger .summary { font-size: .8rem; opacity: .7; margin-bottom: .6rem; }
  #ledger .turn { border-left: 3px solid var(--line); margin: 0 0 .6rem; padding-left: .6rem; }
  /**
   * The turn header stays at the top of the pane while its records scroll under it.
   *
   * A ledger is long, and after a page of rows the reader no longer knows which turn they are in — which is
   * the same reason the timeline exists above it.
   */
  #ledger .turn > header { font-weight: 600; font-size: .8rem; position: sticky; top: -.75rem; background: canvas; padding: .2rem 0; z-index: 1; }
  #ledger .step { margin: .2rem 0 .3rem .6rem; padding-left: .6rem; border-left: 1px dashed var(--line); }
  #ledger .step > header { font-size: .78rem; opacity: .7; }
  #ledger details.record { margin: .1rem 0; }
  /**
   * A record's row is exactly one line, truncated with an ellipsis, and opens on click.
   *
   * DSH's trajectory rows do this — `text-overflow: ellipsis` with `white-space: nowrap` on the row, and
   * `min-width: 0` on the flexible child — and the last part is the one that is easy to miss: without it a
   * flex item refuses to shrink below its content, so instead of being clipped the row pushes its siblings
   * out of the pane. A ledger of long tool arguments is otherwise unreadable and unnavigable.
   */
  #ledger details.record > summary {
    cursor: pointer;
    font-size: .8rem;
    display: flex;
    gap: .5rem;
    align-items: baseline;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.35;
  }
  /**
   * The row's layout, and the three declarations that had to be right together.
   *
   * Measured in a browser, three times, each failure looking like success:
   *
   * 1. written as a descendant selector the label computed `text-overflow: clip`, so a long label was cut
   *    mid-letter with nothing saying it continued;
   * 2. as a class it computed `ellipsis` but `flex-shrink: 0`, because a sibling rule set `flex: none` on
   *    every child — and an item that may not shrink grows past the row instead of truncating, so the
   *    ellipsis was never needed and never drawn (`label.clientWidth` was 4028px in a 1016px row);
   * 3. with `flex: 1 1 auto` on the label and no `flex` rule on its siblings, the row holds one line and
   *    the label truncates with a visible ellipsis.
   *
   * The three parts are load-bearing together: the label is the only flexible child, it may shrink, and
   * what does not fit ends in an ellipsis.
   */
  #ledger details.record > summary > .label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #ledger details.record[data-inflight='true'] > summary::after { content: ' · running'; color: #b7791f; }
  /**
   * The kind annotation, as DSH's rows carry one: a small, coloured, fixed-width badge so a reader can
   * scan a ledger for "which of these was the tool" without reading the labels.
   */
  #ledger .kind {
    font-family: var(--code-font);
    font-size: .72rem;
    min-width: 5.5rem;
    padding: .05rem .3rem;
    border-radius: .2rem;
    text-align: center;
    background: color-mix(in oklab, currentColor 10%, transparent);
    opacity: .9;
  }
  #ledger details.record[data-kind='user'] > summary > .kind { background: color-mix(in oklab, #4b8bf5 28%, transparent); }
  #ledger details.record[data-kind='assistant'] > summary > .kind { background: color-mix(in oklab, #2fa36b 28%, transparent); }
  #ledger details.record[data-kind='reasoning'] > summary > .kind { background: color-mix(in oklab, #b7791f 28%, transparent); }
  #ledger details.record[data-kind='tool'] > summary > .kind { background: color-mix(in oklab, #8b5cf6 28%, transparent); }
  #ledger details.record[data-kind='compaction'] > summary > .kind { background: color-mix(in oklab, #d14343 24%, transparent); }
  /**
   * The timeline: a proportional band of the session's recorded span, one pickable segment per turn.
   *
   * It is the same idea as the overview above DSH's ledger — real timing projected left to right, and
   * picking an interval takes the reader to it — reduced to what heddle's events support: turns as segments,
   * positioned by their own start and duration, coloured by what they did. A pick scrolls the ledger to that
   * turn, which is the whole point: a long ledger is otherwise navigated by scrolling and hoping.
   */
  /**
   * Rendering a document is **one** thing, so its styles hang off the class the renderer writes.
   *
   * Measured, and it is what the owner saw: clicking a markdown file in the left panel rendered the
   * document through a second path — tables, frontmatter and all — but every one of these rules named
   * `#doc`, the Docs pane's own element, so the file pane received the markup and none of the styling.
   * A table arrived as borderless rows of text and an inline code span showed its backticks. The class
   * is `markdown`, because that is what the server writes in **both** places, and one selector for both is
   * what stops them drifting apart again.
   */
  .markdown { min-width: 0; font-size: .9rem; line-height: 1.5; }
  .markdown h1, .markdown h2, .markdown h3, .markdown h4 { line-height: 1.3; margin: 1.2em 0 .4em; }
  .markdown h1 { font-size: 1.35rem; } .markdown h2 { font-size: 1.15rem; } .markdown h3 { font-size: 1rem; }
  .markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown pre { margin: .6em 0; }
  .markdown ul, .markdown ol { padding-left: 1.3rem; }
  .markdown code { font-family: var(--code-font); font-size: .88em; background: var(--code-bg); padding: .08rem .28rem; border-radius: 4px; }
  .markdown pre { background: var(--code-bg); border: 1px solid var(--border); padding: .7rem .8rem; border-radius: var(--radius); overflow-x: auto; }
  .markdown pre code { background: none; padding: 0; }
  /**
   * The highlighter's own class names, coloured here rather than by shipping its theme file.
   *
   * `highlight.js` styles are a few kilobytes of rules for every class it can emit; a document view shows code in
   * a handful of languages and needs the same dozen meanings coloured — a keyword, a string, a comment, a number,
   * a function name. The class names are the library's, so a theme can replace this wholesale later without
   * touching the renderer.
   */
  /**
   * The highlighter's classes, coloured **wherever the highlighter wrote them**.
   *
   * These rules named `.markdown ...` at first, which coloured a fenced block inside a document and left a source
   * file monochrome — measured: `src/cli.ts` rendered 2702 spans and **every one of them white**, because the file
   * pane is not a markdown pane. A theme belongs to the class the library emits, not to the element it was first
   * used in, so these selectors match a token in a file and in a document alike.
   *
   * The class names are the library's own, so a real theme file can replace this wholesale later.
   */
  /**
   * A palette per colour scheme, because the page follows the system (`color-scheme: light dark`).
   *
   * Measured: the first version was one set of dark-mode pastels, so on a light background a JSON string and a JSON
   * key were two washed-out tints of each other and neither could be read. A highlighter that only works in the theme
   * it was written in is half a highlighter, and the owner's report — that the panel was not welcoming — was partly
   * this.
   *
   * The semantic tokens are named for what a token **is**, so the same markup is themed twice and no rule below has
   * to know which scheme is in force. The tones are muted on purpose: a source file is something a person reads for
   * a while, and saturated colour is what makes code look like a warning.
   */
  :root {
    --tok-keyword: #c9a6f5;
    --tok-string: #8fd3ab;
    --tok-number: #f0a878;
    --tok-comment: #8b96a5;
    --tok-title: #86b4ff;
    --tok-attr: #e6c07b;
    --tok-type: #d7b3f5;
    --tok-meta: #f08a8a;
  }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag { color: var(--tok-keyword); }
  .hljs-string, .hljs-regexp, .hljs-addition { color: var(--tok-string); }
  .hljs-number, .hljs-symbol, .hljs-bullet { color: var(--tok-number); }
  .hljs-comment, .hljs-quote { color: var(--tok-comment); font-style: italic; }
  .hljs-title, .hljs-section, .hljs-name { color: var(--tok-title); }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property { color: var(--tok-attr); }
  .hljs-type, .hljs-built_in, .hljs-class, .hljs-params { color: var(--tok-type); }
  .hljs-meta, .hljs-deletion, .hljs-tag { color: var(--tok-meta); }
  .hljs-punctuation, .hljs-operator { color: inherit; opacity: .7; }
  .markdown blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: .8rem; opacity: .85; }
  .markdown hr { border: none; border-top: 1px solid var(--line); margin: 1.2rem 0; }
  .markdown a { color: #6aa6ff; }
  /**
   * An embedded image fits the pane, and is not drawn larger than its own file.
   *
   * `max-width: 100%` keeps a wide image inside the column; `max-height` keeps a tall one from pushing the rest of
   * the document a screen down — measured on this repository's own icon, which is 560x560 and filled the pane.
   * `height: auto` lets it scale by its own proportions rather than being stretched to a box.
   */
  .markdown img { max-width: 100%; max-height: 340px; height: auto; }
  /**
   * A table is a table: bordered cells, a header rule, and its own horizontal scroll when it is wider than the
   * pane. Measured before this — the markup was right and the cells ran together with no borders, which reads as
   * a paragraph of pipes rather than a table.
   */
  .markdown table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; max-width: 100%; }
  .markdown th, .markdown td { border: 1px solid var(--line); padding: .3rem .55rem; text-align: left; vertical-align: top; }
  .markdown thead th { background: color-mix(in oklab, currentColor 7%, transparent); font-weight: 600; }
  .markdown .frontmatter { border: 1px solid var(--line); border-radius: .35rem; padding: .2rem .7rem .7rem; opacity: .85; margin-bottom: 1rem; }
  .markdown .frontmatter h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
  #timeline { position: relative; height: 1.6rem; margin: .1rem 0 .7rem; border-radius: .25rem; background: color-mix(in oklab, currentColor 7%, transparent); overflow: hidden; }
  #timeline:empty { display: none; }
  #timeline button { position: absolute; top: 0; bottom: 0; padding: 0; border: none; border-right: 1px solid var(--line); background: color-mix(in oklab, #4b8bf5 45%, transparent); cursor: pointer; }
  #timeline button[data-leading='assistant'] { background: color-mix(in oklab, #2fa36b 45%, transparent); }
  #timeline button[data-leading='reasoning'] { background: color-mix(in oklab, #b7791f 45%, transparent); }
  #timeline button[data-leading='tool'] { background: color-mix(in oklab, #8b5cf6 45%, transparent); }
  /**
   * The column's resize grips — DSH's own pair (`wSkVaW_widthHandle`).
   *
   * Each sits **24px outside** its edge of the text column (`calc(50% ± content/2 + 24px)`), is 10px wide and
   * full height, and shows a **2px line** only on hover, focus or drag. That line is not a block: DSH paints it
   * with a gradient around the **pointer's Y** (`--dsh-width-handle-pointer-y`), so the grip appears under the
   * hand rather than as a highlighted strip — which is why the variable is mirrored here as `--grip-y`.
   */
  .column-grip {
    position: absolute; top: 0; bottom: 0; z-index: 4;
    width: max(4px, min(10px, calc((100% - var(--chat-column)) / 2 - 48px)));
    cursor: col-resize; background: transparent; border: none; padding: 0; touch-action: none;
  }
  .column-grip[data-side='right'] { left: calc(50% + var(--chat-column) / 2 + 24px); }
  .column-grip[data-side='left'] { right: calc(50% + var(--chat-column) / 2 + 24px); }
  .column-grip::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 2px; border-radius: 2px; opacity: 0;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      transparent calc(var(--grip-y, 50%) - 36px),
      var(--border-strong) calc(var(--grip-y, 50%) - 8px),
      var(--border-strong) calc(var(--grip-y, 50%) + 8px),
      transparent calc(var(--grip-y, 50%) + 36px)
    );
  }
  .column-grip[data-side='right']::after { left: 4px; }
  .column-grip[data-side='left']::after { right: 4px; }
  .column-grip:hover::after, .column-grip:focus-visible::after, .column-grip[data-dragging='true']::after { opacity: 1; }
  .column-grip:focus-visible { outline: 1px solid color-mix(in oklab, currentColor 40%, transparent); outline-offset: 2px; border-radius: 4px; }
  .column-grip[data-dragging='true'] { z-index: 8; }
  #timeline button[data-running='true'] { background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, color-mix(in oklab, currentColor 25%, transparent) 4px, color-mix(in oklab, currentColor 25%, transparent) 8px); }
  #timeline button[aria-current='true'] { outline: 2px solid currentColor; outline-offset: -2px; }
  #timeline-legend { display: flex; gap: .75rem; font-size: .72rem; opacity: .6; margin: -.4rem 0 .7rem; }
  /**
   * The session header: DSH's shape — the name at the reading column's left edge, above the tabs, with the branch
   * it belongs to beside it in the muted small type.
   */
  #session-head { display: flex; align-items: baseline; gap: .6rem; padding: 14px 16px 0; min-width: 0; }
  #session-title { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /**
   * The empty state: a centred hero, DSH's shape for a panel with no conversation in it.
   *
   * It takes the column's height and centres its content, so the composer stays where it always is — a reader who has
   * just arrived sees an invitation and the same input box, not a blank page under a header that says "No session".
   */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .55rem;
    text-align: center;
    padding: 2rem 1.5rem;
    min-height: 0;
  }
  #empty-state img { width: 28px; height: 28px; opacity: .9; }
  #empty-state h3 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: .01em; }
  #empty-state p { margin: 0; max-width: 32rem; color: var(--text-3); font-size: .875rem; line-height: 1.55; }
  #empty-state kbd {
    font-family: var(--font-code, ui-monospace, monospace);
    font-size: .8em;
    padding: .1rem .3rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
  }
  #session-branch { font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ledger .when, #ledger .usage { opacity: .55; font-size: .76rem; }
  #ledger .usage.provider { color: #2fa36b; opacity: .9; }
  #ledger pre { white-space: pre-wrap; word-break: break-word; background: color-mix(in oklab, currentColor 6%, transparent); padding: .5rem .6rem; border-radius: .3rem; font-size: .8rem; margin: .3rem 0 0; }
  #ledger .loose { margin-top: .8rem; }
  /**
   * The file view: a header that says what was opened and how big it is, then the text.
   *
   * `white-space: pre` with wrapping, because the one thing a viewer must not do is reflow source into
   * unreadable lines; and `tab-size` so an indented file does not walk off the panel.
   */
  /**
   * The file pane is a **column**, so that the frame for an HTML document can fill the space left under the header.
   *
   * Measured: the frame was 300x150 — the size a browser gives an `iframe` with no dimensions — because this was not
   * a flex container, so the frame's own `flex: 1` had nothing to resolve against. The text panes are unaffected:
   * they scroll, and a scroll container as a flex child behaves as it did.
   */
  #file { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0; min-width: 0; }
  #file-body { flex: 1; overflow: auto; min-height: 0; }
  /**
   * The frame for a page fills what the header leaves, and the frame inside it fills that.
   *
   * Measured, and this is the second time the same cascade bit: a container with no height leaves an `iframe` at the
   * 300x150 a browser gives one by default, whatever the frame's own rules say. So the whole chain is stated —
   * container flexes and is a column, frame flexes and stretches.
   */
  #file-html { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #file-html iframe { flex: 1; width: 100%; min-height: 0; border: none; background: #ffffff; }
  #file-head {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: .4rem .8rem;
    font-size: .72rem;
    opacity: .7;
    font-family: var(--code-font);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #file-body {
    margin: 0;
    padding: .9rem 1rem 2rem;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--code-font);
    font-size: var(--code-size);
    line-height: var(--code-leading);
    tab-size: 2;
    /** Nothing in a file is emphasised, so nothing is bolder or larger than the code itself. */
    font-weight: 400;
  }
  /**
   * The left column is the **folder tree**, and the row's layout is what makes it readable: a boxed
   * `+` / `−` disclosure, the kind's icon, the type's badge, the folder's name as the label, and a
   * session marker only where a session actually is.
   *
   * Every list inside it is a layout container, never a list. Measured in a browser, and the owner saw

   * These rules used to name this project's own token classes (`tok-*`), from the hand-written scanner the panel
   * used before it was replaced by the library. The library's names are shared with a fenced block inside a
   * document, so a keyword is coloured the same whether it is in a file or in a document — and the rules for the
   * shared names live with the markdown rules above, on the `.markdown` class both panes carry.
   */
  /**
   * The brand, and the one place in this page that chooses a face rather than inheriting the UI's.
   *
   * A serif, because the name is a word rather than a control and the page's own font is the UI's; a stack rather
   * than a download, because this server answers on loopback and a webfont would either be a new asset to ship or
   * a request to the network. Every family named is one a reader already has: Palatino and Iowan on macOS, Georgia
   * everywhere else.
   */
  #brand { display: flex; align-items: center; gap: .55rem; height: 60px; padding: 0 .75rem; border-bottom: 1px solid var(--line); margin-bottom: .4rem; }
  #brand-mark { width: 24px; height: 24px; display: block; }
  /**
   * The brand row carries the collapse control at its right edge, as DSH's does.
   *
   * It is icon-only at every width: the label changes with the state, and a word beside it would change the row's
   * width as it changed the state, which is the one thing a control that narrows a panel must not do.
   */
  #sidebar-toggle {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: none;
    border-radius: var(--radius-sm, 8px);
    background: none;
    color: inherit;
    opacity: .6;
    cursor: pointer;
  }
  #sidebar-toggle:hover, #sidebar-toggle:focus-visible { opacity: 1; background: color-mix(in oklab, currentColor 10%, transparent); }
  /** The icon is the collapsed rail's top control, so it is hidden while the panel is wide. */
  #sidebar-toggle-mark { display: none; width: 24px; height: 24px; }
  #sidebar-search {
    display: none;
    align-items: center;
    justify-content: center;
    /** DSH's `._iconButton` is 28×28; this rule sets the size, so it is the one that moves. */
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    background: none;
    color: inherit;
    opacity: .7;
    cursor: pointer;
  }
  #sidebar-search:hover, #sidebar-search:focus-visible { opacity: 1; }
  /**
   * The primary action, DSH's measurements in this palette.
   *
   * Its own colour pair rather than a transparent row: a filled control is what makes it read as the panel's first act
   * rather than another item in a list. The 12-pixel radius is DSH's `md`, the same one the rail's controls use, so the
   * panel rounds by one rule.
   */
  #new-session {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    width: 100%;
    margin: 0 0 .55rem;
    padding: 8px 12px;
    border: 1px solid color-mix(in oklab, var(--text) 16%, transparent);
    border-radius: var(--radius-md);
    background: color-mix(in oklab, var(--text) 12%, transparent);
    color: inherit;
    font: inherit;
    font-size: .875rem;
    font-weight: 500;
    cursor: pointer;
  }
  #new-session:hover, #new-session:focus-visible {
    background: color-mix(in oklab, var(--text) 18%, transparent);
  }
  #new-session svg { width: 16px; height: 16px; flex: none; }
  #workspaces-row { display: flex; align-items: center; gap: .2rem; }
  /**
   * The row's controls are **icon buttons with no chrome**, which is what DSH's are.
   *
   * Measured: the `+` was an unstyled `<button>`, so the platform painted it as a raised chip — a grey fill and a
   * 2-pixel border — beside a `…` that painted nothing. Two controls in one row looked like two different kinds of
   * thing, and in the collapsed rail (where the row is the whole panel) the chip was the loudest element on screen.
   * A control that is an icon is an icon; the pointer and the focus ring are what say it is pressable.
   */
  #workspaces-row > button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    /**
     * **28×28**, DSH's `._iconButton` size. This rule has the highest specificity in the header (`id + element`), so it is
     * the one that decides the size of the panel's icon buttons — an earlier 24px here silently overrode the class rule
     * above, which is why the buttons measured a size smaller than the reference long after the rule was "fixed".
     */
    width: 28px;
    height: 28px;
    flex: none;
    padding: 0;
    border: none;
    border-radius: var(--radius);
    background: none;
    color: inherit;
    font: inherit;
    font-size: .9rem;
    line-height: 1;
    opacity: .6;
    cursor: pointer;
  }
  #workspaces-row > button:hover,
  #workspaces-row > button:focus-visible {
    opacity: 1;
    background: color-mix(in oklab, currentColor 10%, transparent);
  }
  /** The `…` is a glyph in a box; the box centres it rather than letting the text sit at the block's start edge. */
  #view-options .untwisty { display: inline-flex; align-items: center; justify-content: center; }
  /**
   * Collapsed: the sidebar is a **rail**, 56 pixels wide, which is DSH's measured width.
   *
   * What stays is what a reader reaches for without reading: the mark, the collapse control, and the three icon
   * controls for search, a new workspace, and the view options. What goes is everything that needs a sentence — the
   * name, the section heading, the field, and the tree — because a 56-pixel column cannot hold a title, and an icon
   * invented for a session would be a symbol for a thing that has no icon.
   *
   * The divider goes with it: a rail is a fixed width, so there is nothing to drag.
   */
  body[data-sidebar='collapsed'] #workspace-sidebar { width: 56px; padding: .75rem .3rem; overflow: hidden; }
  body[data-sidebar='collapsed'] #brand { justify-content: center; padding: 0 .15rem; gap: 0; }
  body[data-sidebar='collapsed'] #brand-mark { display: none; }
  body[data-sidebar='collapsed'] #brand-name { display: none; }
  body[data-sidebar='collapsed'] #workspaces-row { flex-direction: column; gap: .45rem; }
  body[data-sidebar='collapsed'] #workspaces-label,
  body[data-sidebar='collapsed'] #session-search,
  body[data-sidebar='collapsed'] #search-note,
  body[data-sidebar='collapsed'] #tree,
  body[data-sidebar='collapsed'] #search-results,
  body[data-sidebar='collapsed'] #tree-note,
  body[data-sidebar='collapsed'] #history { display: none; }
  body[data-sidebar='collapsed'] #sidebar-search { display: inline-flex; }
  /**
   * In the rail the primary action is DSH's **second icon**, immediately after the control that opens the panel: its
   * collapsed sidebar measures `Open sidebar` at y=18 and `New session` at y=66, which is the same 48-pixel pitch. The
   * label is put away with the rest of the words, and the border and fill go with it — a filled 36-pixel square would
   * be the loudest thing left on screen.
   */
  body[data-sidebar='collapsed'] #new-session {
    width: 36px;
    height: 36px;
    margin: 0 0 12px;
    padding: 0;
    justify-content: center;
    border: none;
    background: none;
  }
  body[data-sidebar='collapsed'] #new-session-label { display: none; }
  body[data-sidebar='collapsed'] #gutter-left { display: none; }
  /**
   * The rail is arranged the way DSH arranges its own.
   *
   * Read from DSH's collapsed sidebar on 2026-10-17 with `getComputedStyle`, rather than eyeballed: a 56-pixel column
   * whose children are **36×36 buttons**, centred at x=10, on a **48-pixel pitch** (36 + a 12-pixel gap), inside
   * `padding: 18px 10px 6px`, with 18-pixel icons and a 12-pixel radius. The first item — the control that reopens the
   * panel — sits at y=18.
   *
   * Heddle's first attempt was none of those numbers: the toggle stayed 26 pixels and was pushed to x=23 by the
   * `margin-left: auto` that centres it in the wide brand row, the other three controls were 32 pixels on a 7-to-8
   * pixel pitch, and the gaps read as a cramped column rather than a rail. Measured after this change: 36×36 at x=10,
   * 12-pixel gaps, the first item at y=18 — the same numbers DSH reports.
   */
  body[data-sidebar='collapsed'] #workspace-sidebar { padding: 18px 10px 6px; }
  body[data-sidebar='collapsed'] #brand {
    height: auto;
    padding: 0;
    margin: 0 0 12px;
    border: none;
    justify-content: center;
    gap: 0;
  }
  body[data-sidebar='collapsed'] #sidebar-toggle {
    margin: 0;
    width: 36px;
    height: 36px;
    border-radius: 12px;
  }
  body[data-sidebar='collapsed'] #workspaces-row {
    margin: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  body[data-sidebar='collapsed'] #workspaces-row > button,
  body[data-sidebar='collapsed'] #workspaces-row .untwisty {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    font-size: 1.15rem;
    justify-content: center;
  }
  body[data-sidebar='collapsed'] #workspaces-row .menu-wrap { display: inline-flex; }
  /** The icons are 18 pixels, which is what DSH draws, so the four controls read as one family. */
  body[data-sidebar='collapsed'] #sidebar-search svg { width: 18px; height: 18px; }
  /**
   * Collapsed, the toggle **is** the Heddle icon — the same arrangement DSH uses, where the top control of the rail is
   * the brand mark and its accessible name is "Open sidebar".
   */
  body[data-sidebar='collapsed'] #sidebar-toggle-mark { display: block; width: 24px; height: 24px; }
  body[data-sidebar='collapsed'] #sidebar-toggle-glyph { display: none; }
  body[data-sidebar='collapsed'] #sidebar-search { width: 36px; height: 36px; border-radius: 12px; }
  #brand-name { font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 1.06rem; font-weight: 600; letter-spacing: .01em; }
  /**
   * The `…` that opens a row's menu: **no chrome of its own**.
   *
   * Measured, and the owner's report: a `<button>` carries the platform's background and border unless a rule
   * takes them away, so the control read as a raised chip beside rows that are otherwise plain text. It is a
   * quiet affordance — the row is what a person is looking at — so it paints nothing, and only its opacity
   * answers the pointer.
   */
  #tree .pin { display: inline-flex; align-items: center; opacity: .55; }
  #tree .pin svg { width: 11px; height: 11px; }
  /** An archived row is drawn only when asked for, and then quietly: it is not part of the live list. */
  #tree li[data-archived='true'] { opacity: .55; }
  /**
   * The row's quick controls: present for a reader, invisible to the eye until the row is hovered or focused —
   * DSH's own behaviour, and the reason the row reads as a name rather than as a strip of buttons. A touch device
   * has no hover, so there they are simply shown.
   */
  #tree .session-actions { display: inline-flex; align-items: center; gap: .1rem; }
  .untwisty { font: inherit; padding: 0 .3rem; opacity: .55; background: none; border: 0; color: inherit; line-height: 1; }
  .untwisty:hover { opacity: 1; }

  /**
   * The Trajectory area, following DSH's table measured in a browser (see
   * `_context_/dsh-mechanisms/dsh-trajectory-ui.md`): a dense single-line table with a 122px event
   * column and 30px rows at a 12px font, a turn rail and turn labels in the gutter, kind tags coloured
   * per kind, one row per tool call with its arguments and result on that row, and a right details pane
   * with tabs. The toolbar carries the duration mode, the two collapse switches and the search box.
   */
  #tr-toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 28px;
    padding: 0 .4rem;
    border-bottom: .5px solid var(--line);
    background: var(--surface);
    flex: none;
    font: 400 12px var(--font);
  }
  #tr-toolbar button {
    height: 20px;
    padding: 0 7px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: #adb2b8;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  #tr-toolbar button:hover, #tr-toolbar button[aria-pressed='true'] { color: var(--text); background: var(--hover); }
  #tr-status { margin-left: 8px; color: var(--text-3); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tr-search {
    margin-left: auto;
    flex: 0 174px;
    display: flex;
    align-items: center;
    gap: 4px;
    height: 18px;
    padding: 0 6px;
    border: .5px solid var(--border-strong);
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--text-3);
  }
  #tr-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: 400 12px var(--font); }
  #tr-search input::placeholder { color: var(--text-3); }

  /* The lane timeline: Input / Model / Tools, as DSH's overview strip. */
  #timeline {
    position: relative;
    flex: none;
    height: auto;
    margin: 0;
    border-radius: 0;
    border-bottom: .5px solid var(--line);
    background: var(--surface);
    overflow: hidden;
    padding: 2px 0 4px;
    cursor: crosshair;
  }
  #timeline:empty { display: none; }
  .tr-lanes { position: relative; }
  .tr-lane { position: relative; height: 15px; }
  .tr-lane-label {
    position: absolute;
    left: 6px;
    top: 1px;
    z-index: 2;
    padding: 1px 4px;
    border-radius: 2px;
    color: #81858c;
    background: var(--surface);
    font: 400 10px/12px var(--font);
    text-transform: none;
    letter-spacing: normal;
    pointer-events: none;
  }
  .tr-lane-track { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  #timeline-legend { display: none; }
  .tr-tick { position: absolute; top: 3px; height: 3px; min-width: 2px; border-radius: 1px; border: 0; padding: 0; cursor: pointer; }
  .tr-tick[data-lane='input'] { background: color-mix(in oklab, #4b8bf5 55%, transparent); }
  .tr-tick[data-lane='model'] { background: color-mix(in oklab, #8b5cf6 55%, transparent); }
  .tr-tick[data-lane='tools'] { background: color-mix(in oklab, #b7791f 65%, transparent); }
  .tr-tick[data-running='true'] { opacity: .55; }
  .tr-tick:hover, .tr-tick[aria-current='true'] { outline: 1px solid var(--text-3); }
  .tr-focus {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 1;
    display: none;
    background: color-mix(in oklab, #4b8bf5 14%, transparent);
    border-left: 1px solid color-mix(in oklab, #4b8bf5 55%, transparent);
    border-right: 1px solid color-mix(in oklab, #4b8bf5 55%, transparent);
    pointer-events: none;
  }

  /* The table, the details pane, and the split between them. */
  #ledger { display: flex; flex: 1; min-height: 0; padding: 0; overflow: hidden; font-size: 12px; }
  .tr-split { display: flex; flex: 1; min-width: 0; min-height: 0; }
  .tr-pane { flex: 1; min-width: 0; overflow: auto; container-type: inline-size; }
  #tr-table { width: 100%; border-collapse: collapse; table-layout: fixed; color: var(--text); font: 400 12px/16px var(--font); }
  #tr-table th {
    position: sticky;
    top: 0;
    z-index: 3;
    height: 30px;
    padding: 0 8px;
    border-bottom: .5px solid var(--line);
    color: var(--text-3);
    background: var(--sidebar);
    font: 500 11px var(--font);
    text-align: left;
  }
  #tr-table th.tr-th-event { width: 122px; }
  #tr-table td { height: 30px; padding: 0 8px; border-bottom: .5px solid var(--line); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #tr-table tbody tr { cursor: default; outline: none; transition: background-color .12s ease, opacity .12s ease; }
  /* DSH paints no row hover: measured with a trusted pointer, its hovered row stays transparent. */
  #tr-table tbody tr[data-selected='true'] { background: rgba(255, 255, 255, .14); }
  #tr-table tbody tr:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  #tr-table tbody tr[data-turn-start='true'] > td { border-top: 2px solid var(--border-strong); }
  #tr-table tbody tr[data-focus='outside'] { opacity: .24; }
  .tr-event { position: relative; }
  .tr-event > .tr-rail { position: absolute; left: 12px; top: -1px; bottom: -1px; width: 2px; background: color-mix(in oklab, #4b8bf5 22%, transparent); }
  .tr-event > .tr-kind { margin-left: 30px; }
  .tr-turn-label {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    padding: 1px 5px;
    border-radius: 0 0 2px;
    color: var(--text-3);
    background: var(--surface);
    font: 8px/10px var(--mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tr-kind {
    display: inline-flex;
    align-items: center;
    height: 19px;
    padding: 0 5px;
    border: 1px solid transparent;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .035em;
    line-height: 16px;
  }
  .tr-kind[data-kind='user'] { color: #7aaaff; background: #34415b; }
  .tr-kind[data-kind='assistant'] { color: #9474bc; background: #352f3a; }
  .tr-kind[data-kind='reasoning'] { color: #9474bc; background: #2f2c34; }
  .tr-kind[data-kind='tool'] { color: #dd8629; background: #27241f; }
  .tr-kind[data-kind='context'] { color: #59c984; background: #233c2c; }
  .tr-kind[data-kind='system'], .tr-kind[data-kind='compaction'] { color: var(--text-2); background: var(--surface-2); }
  #tr-table tbody tr[data-error='true'] .tr-kind { color: #d14343; }
  .tr-when { margin-left: 6px; color: var(--text-3); font: 10px var(--mono); }
  .tr-content { color: var(--text); }
  .tr-text { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tr-tool { display: grid; grid-template-columns: clamp(180px, 36cqw - 56px, 480px) minmax(0, 1fr); align-items: center; gap: 8px; font: 400 12px/16px var(--mono); }
  .tr-call { display: flex; min-width: 0; overflow: hidden; }
  .tr-name { flex: none; margin-right: 7px; color: var(--text); }
  .tr-args { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-2); }
  .tr-inline-result { display: flex; align-items: center; min-width: 0; }
  .tr-arrow { flex: none; margin-right: 8px; color: var(--text-3); }
  .tr-result { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-2); }
  .tr-no-output { color: var(--text-3); }
  #tr-table tbody tr.tr-compact .tr-args, #tr-table tbody tr.tr-compact .tr-result, #tr-table tbody tr.tr-compact .tr-arrow { display: none; }
  #tr-details { display: flex; flex-direction: column; flex: none; width: clamp(320px, 38%, 440px); min-width: 0; border-left: .5px solid var(--line); background: var(--surface); overflow: hidden; }
  #tr-details[hidden] { display: none; }
  .tr-d-resize { flex: none; width: 8px; margin-left: -4px; cursor: col-resize; touch-action: none; background: none; border: 0; padding: 0; position: relative; z-index: 2; }
  .tr-d-resize:hover, .tr-d-resize:focus-visible { outline: none; box-shadow: inset 1px 0 0 var(--accent); }
  .tr-d-head { display: flex; align-items: center; gap: 8px; flex: none; height: 42px; padding: 0 8px 0 12px; border-bottom: .5px solid var(--line); }
  .tr-d-where { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-2); font: 500 12px var(--mono); }
  .tr-d-close { margin-left: auto; flex: none; width: 28px; height: 28px; border: 0; border-radius: 4px; background: none; color: var(--text-2); font-size: 18px; line-height: 18px; cursor: pointer; }
  .tr-d-close:hover { color: var(--text); background: var(--hover); }
  .tr-d-tabs { display: flex; flex: none; gap: 1px; height: 34px; padding: 0 8px; border-bottom: .5px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tr-d-tabs::-webkit-scrollbar { display: none; }
  .tr-d-tab { flex: none; padding: 0 9px; border: 0; background: none; color: var(--text-3); font: 400 13px var(--font); cursor: pointer; }
  .tr-d-tab:hover { color: var(--text); background: var(--hover); }
  .tr-d-tab[aria-selected='true'] { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .tr-d-body { flex: 1; min-height: 0; padding: 10px 14px 14px; overflow: auto; }
  .tr-d-rows { display: grid; grid-template-columns: 94px minmax(0, 1fr); align-items: baseline; gap: 2px 8px; margin: 0 0 10px; font-size: 13px; }
  .tr-d-rows dt { color: var(--text-3); }
  .tr-d-rows dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
  .tr-d-section { margin: 12px 0 4px; color: var(--text-2); font-size: 13px; font-weight: 600; }
  .tr-d-body pre { margin: 6px 0 0; padding: 8px 10px; border-radius: 4px; background: var(--code-bg); color: var(--text); font: 12px/19px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .tr-d-acc { margin: 0 0 6px; }
  .tr-d-acc > summary { cursor: pointer; padding: 2px 0; color: var(--text-2); font: 500 13px/20px var(--font); list-style: none; }
  .tr-d-acc > summary::-webkit-details-marker { display: none; }
  .tr-d-acc > summary::before { content: '▸'; display: inline-block; width: 12px; color: var(--text-3); }
  .tr-d-acc[open] > summary::before { content: '▾'; }
  .tr-html pre, .tr-html code { margin: 6px 0 0; font: 12px/19px var(--mono); }
  .tr-error-text { color: #d14343; }
  .tr-d-body details { margin: 2px 0; }
  .tr-d-body details > summary { color: var(--text-2); cursor: pointer; font-size: 13px; }
  .tr-d-empty { color: var(--text-3); font-size: 13px; }

  /* The team panel: roster with live status, the shared board and the mailbox ledger, under the goal bar. */
  #team-panel { padding: .4rem .75rem; border-bottom: 1px solid var(--line); font-size: 12px; display: grid; gap: .3rem; }
  #team-panel[hidden] { display: none; }
  #team-head { display: flex; gap: .5rem; align-items: baseline; }
  #team-title { font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; opacity: .8; }
  #team-summary { opacity: .7; }
  #team-roster, #team-tasks { display: flex; flex-wrap: wrap; gap: .35rem; list-style: none; margin: 0; padding: 0; }
  .team-member, .team-task { border: 1px solid var(--line); border-radius: 999px; padding: .05rem .5rem; display: inline-flex; gap: .3rem; align-items: baseline; }
  .team-member[data-status='running'] { border-color: #2fa36b; }
  .team-member[data-status='provisioning'] { border-color: #b7791f; }
  .team-member[data-status='failed'] { border-color: #d14343; }
  .team-member[data-role='lead'] { font-weight: 600; }
  .team-task[data-status='completed'] { opacity: .6; }
  .team-task[data-status='deleted'] { opacity: .4; text-decoration: line-through; }
  #team-mail { opacity: .7; }
</style>
</head>
<body>
<aside id="workspace-sidebar">
  <!--
    The brand row, above the workspaces — DSH's `logoRow`, and its measurements are why this is shaped the way it
    is: a 60-pixel row with the mark inset 12 pixels from the left, sitting above the nav rather than inside it.

<script type="module">
const log = document.getElementById('log')
const ledger = document.getElementById('ledger')
const timeline = document.getElementById('timeline')
const filePane = document.getElementById('file')
const fileHead = document.getElementById('file-head')
const fileBody = document.getElementById('file-body')
/** Where each turn's section is, so picking a segment can take the reader to it. */
const turnAnchors = new Map()

/**
 * Whether the ledger should keep moving to its newest record.
 *
 * The rule DSH states and the reason it exists: the view follows the tail while a session is running, and
 * **stops following when the reader scrolls up**, so arriving records do not move the text being read. A
 * ledger that always jumped to the bottom would be unusable during a long turn, which is exactly when a
 * person wants to read what already happened.
 *
 * It starts true, because opening at the tail is what a reader wants from a view of what just happened.
 */
let followTail = true
/** How close to the bottom still counts as following. A few pixels, because a scrollbar is not exact. */
const FOLLOW_SLACK_PX = 24

/**
 * Captured, not bubbled: the pane that scrolls is `.tr-pane` (the table's own box), and a scroll event
 * does not bubble — measured, a listener on `#ledger` never fired for a reader scrolling up, so the
 * view kept pulling itself to the tail while they were reading.
 */
ledger.addEventListener(
  'scroll',
  (scrollEvent) => {
    const target = scrollEvent.target
    const scroller = target instanceof Element && target.classList.contains('tr-pane') ? target : ledger
    const distance = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight
    followTail = distance <= FOLLOW_SLACK_PX
  },
  true,
)

/**
 * Put the newest record in view, when the reader has not scrolled away from it.
 *
 * Written on the next frame rather than immediately, and that is a fix rather than a flourish: measured, the
 * ledger opened 40px short of its tail because the scroll was written before the legend that sits above the
 * rows had been laid out, so the pane grew underneath the position. Scrolling after layout has settled is
 * what makes "opens at the tail" true rather than nearly true.
 */
function followLedgerTail() {
  if (!followTail || view !== 'trajectory') return
  const place = () => {
    if (followTail && view === 'trajectory') {
      const pane = ledger.querySelector('.tr-pane')
      const scroller = pane ?? ledger
      scroller.scrollTop = scroller.scrollHeight
    }
  }
  place()
  requestAnimationFrame(place)
}
/**
 * The bottom group: folders **adopted** because a session ran in them.
 *
 * Not "all sessions": those are already in the tree above, and a second list of the same thing was
 * duplication. What is worth showing apart is ad-hoc work — a folder nobody registered, which exists
 * as a root only because `bootstrap` adopts any folder a session ran in. Registering one (the `+`
 * above, or `heddle workspace add`) promotes it into the tree, sessions and all.
 */
const list = document.getElementById('adhoc')
const adhocNote = document.getElementById('adhoc-note')
let current = null
/** The goal bar's last read, declared here because a module is strict mode and assigning it was not. */
let goalView = null

function add(kind, text, merge = true, label, tool) {
  if (text === '' || text === undefined) return
  const last = log.lastElementChild
  // The merge flag is what the live stream wants: deltas of one answer belong in one block. Passing
  // false is what history wants, where two consecutive entries of the same kind are two turns.
  //
  if (kind === 'assistant' && merge && last && last.tagName === 'DIV' && last.dataset.kind === 'assistant') {
    // Only a plain assistant div is merged into. An earlier version merged on `data-kind` alone, so a
    // reasoning block (a `details` whose data-kind is reasoning) was never the target — but the branch
    // still looked for `[data-body]` on whatever the last child was, and a history render passes
    // merge=false... measured, that path is what threw and left the log holding one turn of nine.
    last.textContent += text
    last.dataset.state = 'running'
    log.scrollTop = log.scrollHeight
    return
  }
  if (kind === 'reasoning' || kind === 'tool') {
    addBlock(kind, text, merge, label, tool)
    return
  }
  const node = document.createElement('div')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  /**
   * Whether this row is still arriving.
   *
   * DSH's assistant row carries a `status` of `running` while deltas are landing and `settled` once the turn
   * ends, and the difference is visible: a running answer shows a caret, a settled one does not. A history
   * render is settled by construction — those events all happened before the page asked for them.
   */
  node.dataset.state = merge ? 'running' : 'settled'
  /**
   * A settled answer is drawn as the document it is — DSH's `AssistantMarkdown`, whose markdown is rendered
   * only once the row is settled (its `finalNode` exists then and not before).
   *
   * History arrives already rendered: the transcript route folds the answer through the server's markdown
   * renderer, so reading a session costs one pass and this page never asks per turn. A **live** answer is
   * plain text until its turn ends, and `renderSettledAnswers()` asks for the one document it needs.
   */
  if (kind === 'assistant' && tool !== undefined && typeof tool.html === 'string') {
    node.classList.add('markdown')
    node.dataset.rendered = 'true'
    node.innerHTML = tool.html
    /**
     * A history row is settled by construction, so it gets its actions here — the same ones the live path
     * attaches; `dataset.copyText` is snapshotted before the button is inside the row.
     */
    node.dataset.copyText = node.innerText
    node.append(messageActions(node))
  } else {
    node.textContent = text
  }
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/**
 * Draw every settled answer that is still plain text.
 *
 * The renderer is the **server's** — `POST /api/markdown`, which is `renderMarkdown` and an allow-list — and
 * that is the repository's rule rather than a shortcut: escaping belongs where the renderer is, and one
 * renderer means the chat and a file preview cannot disagree about what a document is. A row that cannot be
 * rendered keeps its plain text and says so on itself, because an answer that failed to be drawn is still an
 * answer.
 */
/**
 * The actions a settled row offers, which is DSH's `MessageIconActions` reduced to the one this harness has:
 * **copy the answer**.
 *
 * The text is snapshotted onto the row when the row settles rather than read at click time, because the button
 * lives inside the row and a copy that included its own glyph would be copying the wrong thing. What is copied
 * is the answer as it reads — the drawn document's text, not its markdown source — which is what a person
 * pasting it somewhere expects.
 */
function messageActions(row) {
  const bar = document.createElement('div')
  bar.className = 'actions'
  const button = document.createElement('button')
  button.type = 'button'
  button.className = 'action'
  button.textContent = '⧉'
  button.title = 'Copy this answer'
  button.setAttribute('aria-label', 'Copy this answer')
  button.onclick = async () => {
    const text = row.dataset.copyText ?? row.innerText
    try {
      await navigator.clipboard.writeText(text)
      button.dataset.copied = 'true'
      button.textContent = '✓'
      setTimeout(() => {
        delete button.dataset.copied
        button.textContent = '⧉'
      }, 1500)
    } catch (error) {
      /**
       * A clipboard the browser refuses — no permission, or a page not focused — is reported rather than
       * silently doing nothing, because a copy that did not happen is worse than one that says so.
       */
      button.title = `could not copy: ${(error && error.message) || error}`
    }
  }
  bar.append(button)
  return bar
}

async function renderSettledAnswers() {
