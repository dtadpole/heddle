const queueDock = document.getElementById('queue')
const modelTrigger = document.getElementById('model-trigger')
const modelMenu = document.getElementById('model-menu')
const modelLabel = document.getElementById('model-label')

/** DSH's `DEFAULT_BUSY_ENTER_BEHAVIOR`: plain Enter queues while the agent is busy. */
const BUSY_ENTER = 'queue'

function queueOf(key = composerKey) {
  let queue = queues.get(key)
  if (queue === undefined) {
    queue = []
    queues.set(key, queue)
  }
  return queue
}

/**
 * Follow the session the panel shows, carrying anything queued before that session existed.
 *
 * The first turn of a fresh panel starts a session, and a message queued while that turn ran belongs to the
 * session it created rather than to "no session" — so the loose queue moves with the id as the **same array**,
 * which is what keeps the pump already holding it working on the right list.
 */

  if (typeof id !== 'string' || id.length === 0 || id === composerKey) return
  if (composerKey === QUEUE_KEY_NONE) {
    const loose = queues.get(QUEUE_KEY_NONE)
    if (loose !== undefined) {
      const existing = queues.get(id)
      if (existing === undefined) queues.set(id, loose)
      else existing.unshift(...loose.splice(0, loose.length))
      queues.delete(QUEUE_KEY_NONE)
    }
  }
  composerKey = id
  renderQueue()
}

function sessionRunning() {
  return runningSessions.has(composerKey)
}
function turnInFlight() {
  return queueOf().some((item) => item.status === 'sending')
}
function anyRunning() {
  return turnInFlight() || sessionRunning()
}

/**
 * Resolve a submission gesture into a delivery mode — DSH's `resolveSubmitMode`.
 *
 * Written as DSH writes it — `if (!running) return 'queue'; if (gesture === 'enter') return preferred;
 * return preferred === 'queue' ? 'steer' : 'queue'` — minus its `steeringAvailable` test, which is what
 * refuses the accelerated gesture on a transport that cannot steer. heddle's `steer` means "send this next"
 * rather than "inject into the running turn", so the gesture is always available and does something visible.
 */
function resolveSubmitMode(preferred, running, gesture) {
  if (!running) return 'queue'
  if (gesture === 'enter') return preferred
  return preferred === 'queue' ? 'steer' : 'queue'

/** How much of a queued message a closed row shows, in characters — DSH's own preview length. */
const QUEUE_PREVIEW_CHARS = 200

let queueExpanded = false

function queuePreview(text) {

  const chars = Array.from(flat)
  return chars.length > QUEUE_PREVIEW_CHARS ? `${chars.slice(0, QUEUE_PREVIEW_CHARS).join('')}…` : flat

/** Submit the draft, or steer what is waiting when there is nothing to submit. */
function submitDraft(gesture) {

  if (text === '') {

    return
  }
  field.value = ''

/** Add one message to the wait: at the end for an ordinary submit, at the front for a steer that could not land. */

/**

 *
 * DSH's host refuses a steer whose turn has ended (`session/steer-unavailable`), and the composer's answer to
 * that refusal is a **queue** — the same thing DSH's own loop does with a submission that arrives after the
 * window closed. So a refusal falls back rather than failing: the message is not lost, it is next in the wait.

async function deliverSteered(text) {

  enqueue(text, 'steer')
}

/** One steer attempt. `true` means the message is in the running turn; `false` means it was refused. */

  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(composerKey)}/steer`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ prompt: text }),

    if (response.status === 409) return false

  } catch (error) {

    const at = queue.findIndex((entry) => entry.id === item.id)
    if (at !== -1) queue.splice(at, 1)
    renderQueue()
  }
  void pumpQueue()

  const at = queue.findIndex((item) => item.id === id)
  if (at === -1) return
  queue.splice(at, 1)
  if (editing !== null && editing.id === id) editing = null
  renderQueue()

/** One row's action buttons. A row being sent refuses all three, which is DSH's rule. */

    const button = document.createElement('button')

const RETRY_DELAY_MS = 1200

/**

 *

 * so in its own notes; the composer should be no more brittle than the door. A connection that never opened

 * error from the harness itself is **not** retried, because the message may already be in the log.

        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),

      if (response.ok || !NOT_FORWARDED.has(response.status) || attempt > 0) return response
    } catch (error) {
      if (attempt > 0) throw error
    }
    await new Promise((resolve) => setTimeout(resolve, RETRY_DELAY_MS))

async function runTurn(text, key) {

  const target = key === QUEUE_KEY_NONE ? null : key
  const response = await sendTurn({

     * The folder is named when a tree node is selected, and the server continues **that folder's**
     * session. With no selection the request is what it always was — a session in the server's own
     * working directory — so a window opened without touching the tree still works.
     *
     * The endpoint and model named here are the composer's own choice, which is what makes the model seat
     * more than a label: the turn asks the backend a person picked, and the server records it on the session
     * so a reload comes back to it.
     */

    session: target,
    folder: activeFolder,
    ...selectionForTurn(),
  })
  if (!response.ok) {

     * The server's own sentence, not only its status.
     *
     * Measured on 2026-10-12: a refusal here was reported as `the server refused it (400)`, and the sentence
     * that said *why* — the name of an endpoint the run did not have — was read and thrown away. A status is
     * not a diagnosis; the body is.
     */
    const detail = await response.text().catch(() => '')
    throw new Error(detail.trim().replace(/\s+/g, ' ').slice(0, 300) || `the server refused it (${response.status})`)

   * Blocks are separated by a **blank line** — two real newlines. Measured while writing this, and the reason
   * the literal is called out: it was written as `'\\n\\n'`, four characters rather than two, so the split
   * never matched and only the first block of the stream was ever read. The live view survived because the
   * `EventSource` renders the events independently; what silently did not work was everything only this
   * response carries — a denial, and the redraw after a turn.
   */
  for (;;) {
    const { value, done } = await reader.read()
    if (done) break
    buffer += decoder.decode(value, { stream: true })
    for (const block of buffer.split('\n\n')) {
      if (!block.trim().startsWith('event:')) continue
      const name = /event: (.+)/.exec(block)?.[1]
      const data = /data: (.+)/.exec(block)?.[1]
      if (!data) continue
      const payload = JSON.parse(data)
      if (name === 'session') {
        /**
         * A turn with no session starts one, and the panel follows it: the queue that was loose while the
         * turn ran belongs to the session it created.
         */
        if (target === null) {
          current = payload.session
          adoptSession(payload.session)
          /** A Stop pressed before the session existed lands now. */
          if (stopRequested) {
            stopRequested = false
            void stopTurn()
          }
        }
      } else if (name === 'done') {
        /** What the provider said the turn cost, and how long it took, if it said anything. */
        stopRequested = false
        lastTurnUsage = payload.usage ?? null
        lastTurnSeconds = (performance.now() - startedAt) / 1000
        updateStatusBar()
        for (const denial of payload.denials ?? []) add('denied', `${denial.tool}: ${denial.message}`)
        /** The turn is over, so nothing in the transcript is still arriving — DSH's rows become settled. */

        void renderSettledAnswers()
        /**
         * The turn may have created **this folder's** session, so both the tree and the list are
         * re-read.
         *
         * The view-ring handler sat inside this branch until 2026-10-11, and it was a defect rather
         * than a placement: every finished turn registered another identical listener, and the same
         * registration appeared twice more at the end of the file. Measured: three handlers after one
         * turn, one more per turn after that. It is registered once, below.
         */
        await renderTree()
        await refreshSessions()
      } else if (name === 'cancelled') {
        /**
         * A stopped turn is not an error: the rows settle and the action returns to Send, with no red
         * sentence in the transcript for something the reader asked for.
         */
        stopRequested = false
        settleChat()
        void renderSettledAnswers()
        if (typeof payload.session === 'string') {
          runningSessions.delete(payload.session)
          paintRunningMarks()
        }
        renderComposerState()
      } else if (name === 'error') {
        add('denied', payload.message)
        /** The turn ended without its own `turn/completed`, so the running state it set is cleared here. */
        if (typeof payload.session === 'string') runningSessions.delete(payload.session)
        renderComposerState()
      }
    }
    const lastBreak = buffer.lastIndexOf('\n\n')
    if (lastBreak !== -1) buffer = buffer.slice(lastBreak + 2)
  }
}

/**
 * The keymap: Enter submits, Shift+Enter is a newline, Ctrl/Cmd+Enter is the accelerated gesture.
 *
 * The composition guard is DSH's and is not optional here: a Chinese or Japanese candidate list is confirmed
 * with Enter, so submitting on a composition-closing key would send half a word. `isComposing` covers most
 * engines and `keyCode === 229` is the legacy signal they emit without it — both are what DSH's keymap checks.
 */
/**
 * DSH's editor grows with the draft and stops at 336px, after which it scrolls.
 *
 * The manual resize handle the composer used to carry is the one thing that cannot coexist with this: it
 * remembers a height the growth logic does not know about, so the two fight and the box jumps. DSH's cap is
 * the contract and is measured from its own page.
 */
const COMPOSER_MAX_HEIGHT = 336
function growComposer() {
  field.style.height = 'auto'
  field.style.height = `${Math.min(field.scrollHeight, COMPOSER_MAX_HEIGHT)}px`
}
function updateSendDisabled() {
  /** While a turn runs the button in that place is Stop, so the disabled state only concerns an idle send. */
  sendButton.disabled = !anyRunning() && field.value.trim().length === 0
}
field.addEventListener('input', () => {
  growComposer()
  updateSendDisabled()
})

field.addEventListener('keydown', (keyEvent) => {
  if (keyEvent.key !== 'Enter') return
  if (keyEvent.isComposing || keyEvent.keyCode === 229) return
  if (keyEvent.shiftKey) return
  keyEvent.preventDefault()
  submitDraft(keyEvent.ctrlKey || keyEvent.metaKey ? 'accelerated' : 'enter')
})

/**
 * The arrow button and plain Enter share one gesture, which is DSH's rule: plain Enter and the primary Send
 * button deliver exactly what Enter would. The button is a submit button inside the form, so the browser
 * gives it click, focus and keyboard behaviour for free.
 */
composer.addEventListener('submit', (submitEvent) => {
  submitEvent.preventDefault()
  submitDraft('enter')
})

/**
 * The submit action's own label, which DSH changes with what pressing it will do.
 *
 * While a turn is running the arrow queues rather than sends, and the accessible name says so — a control
 * whose meaning changed without saying so is the failure this avoids.
 */
function renderComposerState() {
  const running = anyRunning()
  const mode = resolveSubmitMode(BUSY_ENTER, running, 'enter')
  const label = running ? (mode === 'steer' ? 'Steer message' : 'Queue message') : 'Send message'
  sendButton.setAttribute('aria-label', label)
  sendButton.title = running ? `${label} — Enter · Ctrl+Enter sends the queue` : `${label} — Enter · Shift+Enter for a new line`
  /**
   * One action at a time: while a turn runs, the button that can **end** it takes Send's place, which is
   * DSH's own pair. The send button stays in the DOM (hidden) so the form still submits on Enter — Enter
   * queues while a turn runs, exactly as before.
   */
  stopButton.hidden = !running
  sendButton.hidden = running
  updateSendDisabled()
  updateStatusBar()
}

/**
 * The status line under the card: what this page can actually know.
 *
 * DSH prints turns, steps, token rate and context use; heddle records turns and tool calls in the transcript
 * and nothing about tokens yet, so the line prints the two it has and the model that answers. A number this
 * page cannot measure is not printed rather than invented.
 */
/**
 * The last completed turn's reported usage and duration, when the provider reported both.
 *
 * DSH prints a token rate and a context share under its composer. Both need numbers a provider sends, so they
 * are kept here rather than invented: no usage means no rate, and no declared `contextWindow` means no
 * percentage — a made-up denominator would be worse than an empty cell.
 */
let lastTurnUsage = null
let lastTurnSeconds = 0

function updateStatusBar() {
  if (statusBar === null) return
  let turns = 0
  let steps = 0
  for (const node of log.querySelectorAll('.turn')) {
    if (node.dataset.kind === 'user') turns += 1
    else if (node.dataset.kind === 'tool') steps += 1
  }
  const turnsCell = statusBar.querySelector('[data-stat="turns"]')
  const stepsCell = statusBar.querySelector('[data-stat="steps"]')
  if (turnsCell !== null) turnsCell.textContent = `${turns} turn${turns === 1 ? '' : 's'}`
  if (stepsCell !== null) stepsCell.textContent = `${steps} step${steps === 1 ? '' : 's'}`
  const tokensCell = statusBar.querySelector('[data-stat="tokens"]')
  if (tokensCell !== null) {
    const out = lastTurnUsage?.outputTokens
    tokensCell.textContent = typeof out === 'number' && lastTurnSeconds > 0 ? `${Math.round(out / lastTurnSeconds)} tok/s` : ''
  }
  const contextCell = statusBar.querySelector('[data-stat="context"]')
  if (contextCell !== null) {
    const used = lastTurnUsage?.inputTokens
    const endpoint = endpointOptions.find((option) => option.name === (chosenEndpoint ?? endpointDefault))
    const window = endpoint?.contextWindow
    contextCell.textContent =
      typeof used === 'number' && typeof window === 'number' && window > 0
        ? `${Math.round((used / window) * 100)}% context`
        : ''
  }
}

/**
 * A stop asked for before the turn has named its session.
 *
 * Measured: the button appears as soon as the message is being delivered, and a turn that created the session
 * has no id for those first milliseconds — so a click could reach a button that knew nothing to stop. It is
 * remembered and delivered the moment the session event names it, which is the behaviour a person expects from
 * a Stop that looked pressable.
 */
let stopRequested = false

/** Ask the server to end the turn that is running. A no-op when it already ended is not a failure. */
async function stopTurn() {
  if (composerKey === QUEUE_KEY_NONE) {
    stopRequested = true
    return
  }
  try {
    await fetch(`/api/sessions/${encodeURIComponent(composerKey)}/stop`, { method: 'POST' })
  } catch {
    // The turn may have ended between the click and the request; the stream settles the row either way.
  }
}
stopButton.addEventListener('click', () => void stopTurn())

/**
 * The `+` menu: insert a workspace file's path at the cursor.
 *
 * DSH's `+` opens files and commands; heddle's agent already reads files by path, so the useful half here is
 * the path itself — one level at a time, the same shape `/api/tree` serves, so a large workspace is never
 * walked to open a menu.
 */
let attachTrail = []
function closeAttachMenu() {
  attachMenu.hidden = true
  attachButton.setAttribute('aria-expanded', 'false')
}
function insertAtCursor(text) {
  const start = field.selectionStart ?? field.value.length
  const end = field.selectionEnd ?? start
  field.value = `${field.value.slice(0, start)}${text}${field.value.slice(end)}`
  field.focus()
  field.selectionStart = start + text.length
  field.selectionEnd = field.selectionStart
  growComposer()
}
function renderAttachMenu(node) {
  attachMenu.replaceChildren()
  if (attachTrail.length > 0) {
    const up = document.createElement('button')
    up.type = 'button'
    up.textContent = '↑ up'
    up.addEventListener('click', () => {
      attachTrail.pop()
      void openAttachLevel(attachTrail[attachTrail.length - 1] ?? null)
    })
    attachMenu.append(up)
  }
  const children = [...(node?.children ?? []), ...(node?.adHoc ?? [])]
  if (children.length === 0) {
    const empty = document.createElement('div')
    empty.className = 'meta'
    empty.textContent = 'nothing to insert here'
    attachMenu.append(empty)
    return
  }
  for (const child of children) {
    const item = document.createElement('button')
    item.type = 'button'
    item.textContent = child.kind === 'file' ? child.label : `${child.label}/`
    item.title = child.path
    item.addEventListener('click', () => {
      if (child.kind === 'file') {
        insertAtCursor(child.path)
        closeAttachMenu()
        return
      }
      attachTrail.push(child)
      void openAttachLevel(child)
    })
    attachMenu.append(item)
  }
}
async function openAttachLevel(node) {
  attachMenu.hidden = false
  attachButton.setAttribute('aria-expanded', 'true')
  if (node === null) {
    attachTrail = []
    try {
      const response = await fetch('/api/tree')
      const body = await response.json()
      attachMenu.replaceChildren()
      renderAttachMenu(body)
    } catch {
      renderAttachMenu(null)
    }
    return
  }
  try {
    const response = await fetch(`/api/tree?path=${encodeURIComponent(node.path)}`)
    renderAttachMenu(await response.json())
  } catch {
    renderAttachMenu(null)
  }
}
attachButton.addEventListener('click', () => {
  if (attachMenu.hidden) void openAttachLevel(null)
  else closeAttachMenu()
})
document.addEventListener('click', (clickEvent) => {
  if (attachMenu.hidden) return
  if (attachMenu.contains(clickEvent.target)) return
  if (clickEvent.target === attachButton) return
  closeAttachMenu()
})
document.addEventListener('keydown', (keyEvent) => {
  if (keyEvent.key === 'Escape' && !attachMenu.hidden) closeAttachMenu()
})

/**
 * The access chip: the sandbox mode the server runs under, read from `/api/status`.
 *
 * The mode is fixed when the server constructs its sandbox, so this is a read-out rather than a control —
 * which is exactly why it is worth showing: a person should not have to guess whether the agent can write.
 */
function accessTitle(mode) {
  if (mode === 'read-only') return 'Read only'
  if (mode === 'danger-full-access') return 'Full access'
  return 'Workspace write'
}
async function loadStatus() {
  try {
    const response = await fetch('/api/status')
    if (!response.ok) return
    const body = await response.json()
    const mode = body?.sandbox?.mode
    if (typeof mode !== 'string') return
    accessButton.textContent = accessTitle(mode)
    accessButton.title = `the sandbox mode this server runs under: ${mode}`
    /** DSH names this control `Access mode, current <value>`; a name of only "Access mode" hides the value it shows. */
    accessButton.setAttribute('aria-label', `Access mode, current: ${accessTitle(mode)}`)
  } catch {
    // A status the page cannot read must not stop the composer from being one.
  }
}

/**
 * The model seat: which backend answers this session.
 *
 * DSH's `conversation.input.model` seat in the composer's tool row, and its `/api/endpoints` counterpart rather
 * than DSH's provider catalogue: heddle's configuration names **endpoints**, each already carrying the model it
 * answers with, so the menu is one level where DSH's is two. Everything else follows DSH — the trigger shows
 * the current selection, choosing one applies to **this session** rather than to the harness, and the choice is
 * recorded so a reload comes back to it.
 *
 * The list comes from the server rather than from the configuration file, because an endpoint is resolved from
 * several layers and a page that read one file would miss the environment overrides and the repository's own
 * defaults.
 */

/** The endpoints the server offers, in its order, and the one it nominates. */
let endpointOptions = []
let endpointDefault = null
/** What this page will ask with. `null` means "whatever the server defaults to". */
let chosenEndpoint = null
let chosenModel = null

/** The name a person reads: the endpoint, and the model it answers with when it names one. */
function endpointTitle(name) {
  const found = endpointOptions.find((option) => option.name === name)
  if (found === undefined) return `${name} (not configured)`
  return typeof found.model === 'string' && found.model.length > 0 ? `${name} · ${found.model}` : name
}

/**
 * What this turn will ask with, checked against the endpoints the run actually has.
 *
 * A page can be older than the server it is talking to: a tab left open across a configuration change, or a
 * daemon restarted with a different endpoint list. The stale name it holds is then a name the run does not
 * have, and sending it refuses **every** message with a complaint about a backend nobody chose — measured on
 * 2026-10-12, after this machine's own configuration renamed an endpoint under an open tab.
 *
 * So the name is checked here. The run's nominated default answers instead, and the transcript says so rather
 * than letting a different backend take over in silence; a model override belonged to the endpoint that is
 * gone, so it goes with it.
 */
let staleEndpointNoted = null
function selectionForTurn() {
  const names = endpointOptions.map((option) => option.name)
  if (chosenEndpoint === null) return chosenModel !== null ? { model: chosenModel } : {}
  if (names.includes(chosenEndpoint)) {
    return { endpoint: chosenEndpoint, ...(chosenModel !== null ? { model: chosenModel } : {}) }
  }
  const fallback = endpointDefault ?? names[0] ?? null
  if (fallback === null) return {}
  if (staleEndpointNoted !== chosenEndpoint) {
    staleEndpointNoted = chosenEndpoint
    add('denied', `this session is set to '${chosenEndpoint}', which this run does not have; '${fallback}' answers instead`)
  }
  return { endpoint: fallback }
}

/**
 * Draw the seat and its menu.
 *
 * An endpoint the configuration no longer holds is **kept in the list**, as the session's own recorded value.
 * That is the reason this is a menu the page draws rather than a native `<select>`: a session switched to an
 * endpoint that was later removed still has to say what it is set to, or the first symptom is a turn that
 * refuses and a control that looks perfectly fine.
 */
function renderModelSeat() {
  const names = endpointOptions.map((option) => option.name)
  const wanted = chosenEndpoint ?? endpointDefault ?? names[0] ?? null
  chosenEndpoint = wanted
  const modelName = wanted === null ? 'no model' : chosenModel !== null ? `${wanted} · ${chosenModel}` : endpointTitle(wanted)
  modelLabel.textContent = modelName
  /**
   * DSH's seat is named `Select model, current <model>` — the control's kind **and** its value, because a name that is
   * only the value does not say it is a control, and a name that is only the kind does not say what is chosen. Measured
   * from its own button on 2026-10-17.
   */
  modelTrigger.setAttribute('aria-label', `Select model, current ${modelName}`)
  modelTrigger.disabled = names.length === 0
  const offered = wanted !== null && !names.includes(wanted) ? [wanted, ...names] : names
  modelMenu.replaceChildren()
  for (const name of offered) {
    const option = endpointOptions.find((entry) => entry.name === name)
    const item = document.createElement('button')
    item.type = 'button'
    item.setAttribute('role', 'menuitemradio')
    item.setAttribute('aria-checked', name === wanted ? 'true' : 'false')
    const label = document.createElement('span')
    label.className = 'model-name'
    label.textContent = name
    const model = document.createElement('span')
    model.className = 'model-id'
    if (option === undefined) {
      model.classList.add('model-missing')
      model.textContent = 'not configured'
    } else {
      model.textContent = typeof option.model === 'string' ? option.model : ''
    }
    item.append(label, model)
    item.onclick = () => {
      closeModelMenu()
      void chooseEndpoint(name)
    }
    modelMenu.append(item)
  }
}

function closeModelMenu() {
  modelMenu.hidden = true
  modelTrigger.setAttribute('aria-expanded', 'false')
}

/**
 * Choose the endpoint that answers this session.
 *
 * The choice is local **and** recorded. Local, because the next turn names it — which is what makes a choice
 * made before a session exists travel with the turn that creates one. Recorded, because the server writes it
 * to the session's own metadata, which is what makes a reload come back to it. A failure is reported rather
 * than swallowed: a switch that silently did nothing would leave a person talking to the backend they thought
 * they had left.
 */
async function chooseEndpoint(name, model) {
  chosenEndpoint = name
  chosenModel = model ?? null
  renderModelSeat()
  if (current === null) return
  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(current)}/model`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ endpoint: name, ...(model !== undefined ? { model } : {}) }),
    })
    if (!response.ok) {
      const body = await response.json().catch(() => ({}))
      setNote(body.error ?? `could not switch this session onto ${name}`)
    } else setNote('')
  } catch (error) {
    setNote(`could not switch this session onto ${name}: ${(error && error.message) || error}`)
  }
}

/** The model a session is recorded with, when it has one; a session with none keeps the page's own choice. */
function applySessionModel(endpoint, model) {
  if (typeof endpoint !== 'string' || endpoint.length === 0) return
  chosenEndpoint = endpoint
  chosenModel = typeof model === 'string' && model.length > 0 ? model : null
  renderModelSeat()
}

/** The endpoint list, which is what the seat needs before it can offer anything. */
async function loadEndpoints() {
  try {
    const response = await fetch('/api/endpoints')
    if (!response.ok) {
      setNote(`the endpoint list answered ${response.status}`)
      return
    }
    const body = await response.json()
    endpointOptions = Array.isArray(body.endpoints) ? body.endpoints : []
    endpointDefault = typeof body.default === 'string' ? body.default : null
  } catch (error) {
    setNote(`could not read the endpoint list: ${(error && error.message) || error}`)
  }
  renderModelSeat()
}

modelTrigger.addEventListener('click', (clickEvent) => {
  clickEvent.stopPropagation()
  const open = modelMenu.hidden
  modelMenu.hidden = !open
  modelTrigger.setAttribute('aria-expanded', String(open))
})

/** Any click outside the seat dismisses the menu, which is what DSH's popup shell does. */
document.addEventListener('click', (clickEvent) => {
  if (modelMenu.hidden) return
  if (!modelMenu.contains(clickEvent.target) && clickEvent.target !== modelTrigger) closeModelMenu()
})

document.addEventListener('keydown', (keyEvent) => {
  if (keyEvent.key === 'Escape' && !modelMenu.hidden) {
    closeModelMenu()
    modelTrigger.focus()
  }
})

/**
 * The left column: the folder tree of every registered workspace.
 *
 * Three rules are the owner's, and this renderer follows them rather than re-deriving them:
 *
 * - **A type folder is the boundary, and a session row exists only for an instance of one.** The
 *   server decides that and sends `session: null` everywhere else, so the page never guesses; a
 *   folder without a session is still navigable, it is simply not a place to work.
 * - **`+` and `−` are the disclosure**, in a boxed hit target, with the state on the row and the
 *   children inside a `role="group"` — the shape the owner asked for by name.
 * - **One level at a time.** A node's children are fetched when it is opened, and the expanded set is
 *   kept in `localStorage` so a reload comes back to the same shape.
 */
const treeList = document.getElementById('tree')
const treeNote = document.getElementById('tree-note')
const EXPANDED_KEY = 'heddle.tree.expanded.v1'

/** Where each drawn node is, so a remembered path can be opened without walking the DOM by label. */
const rowIndex = new Map()

/**
 * Paint the running marks from the set the stream fills.
 *
 * Called on every add and delete rather than redrawing the tree: the tree's rows are the same rows, and only one span
 * per session changes. A re-fetch per event would also be a request per event.
 */
function paintRunningMarks() {
  for (const entry of rowIndex.values()) {
    const { node, li } = entry
    if (node.kind !== 'session' || node.session === undefined || node.session === null) continue
    const row = li.querySelector(':scope > .row')
    if (row === null) continue
    const existing = row.querySelector(':scope > .status')
    const running = runningSessions.has(node.session.id)
    if (running && existing === null) {
      const status = document.createElement('span')
      status.className = 'status'
      status.textContent = 'Running'
      row.querySelector(':scope > .icon')?.after(status)
    } else if (!running && existing !== null) {
      existing.remove()
    }
  }
}

/** The folder the prompt box belongs to, so a run continues the folder a person selected. */
let activeFolder = null

/**
 * The workspace rows the tree last drew, in its order.
 *
 * The tree's own render is the only place that knows them, and the primary action needs one when nothing is selected —
 * so the last drawing keeps them rather than the button re-fetching the tree to find out what it already has.
 */
let treeTops = []

function readExpanded() {
  try {
    return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY) ?? '[]'))
  } catch (error) {
    return new Set()
  }
}

const expanded = readExpanded()

/**
 * Whether sessions the owner archived are drawn.
 *
 * A reading preference, so it persists like the expansion set; `off` is the default because a row a person put
 * away is not one they asked to see. The alternative — a session that disappears with no way back — is what
 * archiving would be if this did not exist.
 */
const ARCHIVED_KEY = 'heddle.tree.archived.v1'
/**
 * Which archived sessions the tree draws: DSH's three states, kept as a string rather than a flag.
 *
 * `'hide'` is the default — a row a person put away is not one they asked for — `'show'` adds them back with their
 * marker, and `'only'` answers "where did it go", which a two-state toggle cannot. Persisted like the expansion
 * set, because it is a reading preference.
 */
/**
 * How the session list is grouped — DSH's other View options choice, measured on 2026-10-17: `Workspace Tree` (the
 * folders this UI draws, which is the same idea) or `In one list` (every session flat, newest first, whatever folder it
 * lives in). A reading preference, persisted beside the archive filter.
 */
const GROUPING_KEY = 'heddle.tree.grouping.v1'
let groupingMode = (() => {
  try {
    return localStorage.getItem(GROUPING_KEY) === 'list' ? 'list' : 'tree'
  } catch (error) {
    return 'tree'
  }
})()

function rememberGrouping() {
  try {
    localStorage.setItem(GROUPING_KEY, groupingMode)
  } catch (error) {
    /* A browser with no storage still draws the list; the preference is what is lost. */
  }
}

let archiveMode = (() => {
  try {
    const stored = localStorage.getItem(ARCHIVED_KEY)
    return stored === 'show' || stored === 'only' ? stored : 'hide'
  } catch (error) {
    return 'hide'
  }
})()

function rememberArchived() {
  try {
    localStorage.setItem(ARCHIVED_KEY, archiveMode)
  } catch (error) {
    /* A browser with no storage still draws the tree; the preference is what is lost. */
  }
}

/** The query string the tree is read with, for the roots and for a branch alike. */
function archiveQuery(separator) {
  return archiveMode === 'hide' ? '' : `${separator}archived=${archiveMode}`
}

/** DSH's `View options`: the archive filter in one control, with the state it is in marked. */
function viewOptionItems() {
  /**
   * DSH's three labels, verbatim. The current one is marked with aria-checked and a tick drawn by CSS rather than by a
   * character in the label: the name of the item has to be the action, and a name that changes with the state is two
   * names for one thing.
   */
  const archiveModes = [
    ['hide', 'Hide archived'],
    ['show', 'All conversations (show archived)'],
    ['only', 'Archived only'],
  ]
  return [
    /**
     * DSH's View options is four groups, read from its own menu on 2026-10-17: a `WorkSpace` heading, the grouping
     * pair (`Workspace Tree` / `In one list`), the ordering pair (`Manual` / `Last updated`), and the archive trio.
     * This menu carries the grouping pair and the archive trio. `Manual` is **not** here: `Last updated` is the only
     * order this UI has, and drag-to-order plus a persisted order is a feature rather than a switch. A group with one
     * item would be a control that cannot be chosen, so that group is left out and the difference is written down.
     */
    { heading: 'WorkSpace' },
    {
      label: 'Workspace Tree',
      glyph: 'tree',
      current: groupingMode === 'tree',
      run: async () => {
        groupingMode = 'tree'
        rememberGrouping()
        await renderTree()
      },
    },
    {
      label: 'In one list',
      glyph: 'list',
      current: groupingMode === 'list',
      run: async () => {
        groupingMode = 'list'
        rememberGrouping()
        await renderTree()
      },
    },
    {
      label: 'Last updated',
      glyph: 'clock',
      current: true,
      run: async () => {
        /** The only order there is; choosing it is a no-op rather than an error. */
        await renderTree()
      },
    },
    ...archiveModes.map(([mode, label]) => ({
      label,
      glyph: mode === 'hide' ? 'archive' : mode === 'show' ? 'archive-restore' : 'archive-only',
      current: archiveMode === mode,
      run: async () => {
        archiveMode = mode
        rememberArchived()
        await renderTree()
      },
    })),
  ]
}

function rememberExpanded() {
  try {
    localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expanded]))
  } catch (error) {
    // A browser that refuses storage still gets the tree; only the memory of its shape is lost.
  }
}

function setNote(text) {
  treeNote.textContent = text ?? ''
  treeNote.hidden = text === undefined || text === null || text === ''
}

const FOLDER_PATH = 'M2 4.6A1.6 1.6 0 0 1 3.6 3h2.6l1.6 2h4.6A1.6 1.6 0 0 1 14 6.6v4.8A1.6 1.6 0 0 1 12.4 13H3.6A1.6 1.6 0 0 1 2 11.4z'
/** The one mark that distinguishes a type folder from a plain one: the braces around its name. */
const TYPE_MARK = 'M6.3 7.4 5 9.5l1.3 2.1M9.7 7.4 11 9.5l-1.3 2.1'
/** The front panel of an open folder, drawn as if the flap had fallen forward inside the same box. */
const FOLDER_OPEN_FRONT = 'M4.6 7.9h8.9l-1.4 4.6H3.2z'

function svgPath(d) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  path.setAttribute('d', d)
  return path
}

/**
 * One inline SVG per kind of node, drawn in `currentColor` so it follows the theme.
 *
 * A folder's glyph carries the one bit a reader needs before clicking: **open or closed**. The closed
 * folder is the outline, and the open one adds the tilted front panel inside the same 16px box, so the
 * state is visible without moving any other row — the owner's rule of 2026-10-11.
 */
/** How long ago, in the compact form a list uses: `now`, `12min`, `3h`, `4d`. */
function relativeAge(created) {
  const then = Date.parse(created)
  if (!Number.isFinite(then)) return ''
  const seconds = Math.max(0, Math.round((Date.now() - then) / 1000))
  if (seconds < 60) return 'now'
  const minutes = Math.round(seconds / 60)
  if (minutes < 60) return minutes + 'min'
  const hours = Math.round(minutes / 60)
  if (hours < 24) return hours + 'h'
  return Math.round(hours / 24) + 'd'
}

function kindIcon(kind, open = false) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', '0 0 16 16')
  svg.setAttribute('width', '14')
  svg.setAttribute('height', '14')
  svg.setAttribute('fill', 'none')
  svg.setAttribute('stroke', 'currentColor')
  svg.setAttribute('stroke-width', '1.2')
  svg.setAttribute('stroke-linejoin', 'round')
  svg.setAttribute('aria-hidden', 'true')
  svg.setAttribute('data-state', kind === 'file' ? 'file' : open ? 'open' : 'closed')
  if (kind === 'generated') svg.setAttribute('stroke-dasharray', '2 1.5')
  if (kind === 'plus') {
    /** A plus: the one control that makes something rather than acting on a row. */
    const vertical = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    vertical.setAttribute('d', 'M8 3.5v9')
    const horizontal = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    horizontal.setAttribute('d', 'M3.5 8h9')
    svg.append(vertical, horizontal)
    return svg
  }
  /**
   * The marks a menu item carries. Each is one small stroke drawing in the same 16px box as the tree's own icons, so a
   * menu and a row use one visual language rather than two.
   */
  const menuMarks = {
    rename: 'M11.5 2.5l2 2-9 9H2.5v-2z',
    fork: 'M5 2.5v6a3 3 0 0 0 3 3h3M10 8.5l2.5 2.5L10 13.5M13.5 2.5v3a2.5 2.5 0 0 1-2.5 2.5H8',
    download: 'M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11',
    unregister: 'M4.5 4.5l7 7M11.5 4.5l-7 7',
    tree: 'M2.5 3.5h4v3h-4zM9.5 9.5h4v3h-4zM4.5 6.5v5h5',
    list: 'M3 4h10M3 8h10M3 12h10',
    clock: 'M8 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11M8 5v3.2l2.2 1.3',
    'archive-restore': 'M2.5 5.5h11v3h-11zM3.5 8.5v5h9v-5M8 2.5v4M6 4.5L8 2.5l2 2',
    'archive-only': 'M2.5 5.5h11v3h-11zM3.5 8.5v5h9v-5M6 3.5h4',
  }
  if (menuMarks[kind] !== undefined) {
    const mark = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    mark.setAttribute('d', menuMarks[kind])
    svg.append(mark)
    return svg
  }
  if (kind === 'file') {
    /**
     * A page rather than a folder: the same body with the corner turned down, which is the one mark
     * that says "you can open this and read it" next to a row that says "you can go into this".
     */
    svg.append(svgPath('M4 2h5l3 3v9H4z'), svgPath('M9 2v3h3'))
    return svg
  }
  if (kind === 'archive') {
    /** A box with its lid off — the mark a list uses for "put away", drawn here for the same reason as the pin. */
    svg.append(svgPath('M2.6 2.8h10.8v2.4H2.6z'), svgPath('M3.8 5.2v7.6h8.4V5.2'), svgPath('M6.4 7.6h3.2'))
    return svg
  }
  if (kind === 'pin') {
    /** A pin, drawn rather than borrowed from the emoji font, which renders in a different style on every machine. */
    svg.append(svgPath('M6 2.2h4v1.1l-.9.5v3l1.4 1.3H3.5l1.4-1.3v-3L4 3.3z'), svgPath('M8 8.2v4.4'))
    return svg
  }
  if (kind === 'session') {
    /**
     * A conversation, not a folder: two speech lines in the same box. A session's `_sessions_` folder is
     * not drawn at all (the server hoists its instances into the branch), so this glyph is the only thing
     * that says a row is a session rather than something to walk into.
     */
    svg.append(svgPath('M3.2 3.6h9.6v6.2H8.4L5.6 12v-2.2H3.2z'), svgPath('M5.6 6.3h4.8M5.6 8.2h3.2'))
    return svg
  }
  svg.append(svgPath(FOLDER_PATH))
  if (open) svg.append(svgPath(FOLDER_OPEN_FRONT))
  if (kind === 'type') svg.append(svgPath(TYPE_MARK))
  if (kind === 'instance') {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
    dot.setAttribute('cx', '8')
    dot.setAttribute('cy', '9.9')
    dot.setAttribute('r', '1.5')
    dot.setAttribute('fill', 'currentColor')
    dot.setAttribute('stroke', 'none')
    svg.append(dot)
  }
  return svg
}

/** How big a file is, in the units a person reads without counting digits. */
function humanBytes(bytes) {
  if (bytes < 1024) return bytes + ' B'
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10 * 1024 ? 1 : 0) + ' KB'
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB'
}

/**
 * Show one file in the right panel.
 *
 * The fetch is the whole mechanism, and the refusals are shown rather than swallowed: a file the server
 * will not read — outside every root, a directory, a binary — arrives as a status and a sentence, and a
 * panel that went blank instead would look like an empty file. The path is the row's canonical path, so
 * what is read is what was clicked.
 */
let fileFetches = 0
async function showFile(node) {
  /** A file is something to read; the invitation belongs to the panel with nothing in it. */
  document.getElementById('empty-state')?.setAttribute('hidden', '')
  const ticket = ++fileFetches
  chooseSelected(node.path)
  /**
   * A file is shown in the panel **on its own**: the ring holds the file's tab and nothing else, because
   * Chat, Trajectory and Docs are all statements about a session and a file has none of them (owner's rule).
   */
  renderRing('file')
  fileHead.textContent = node.path
  fileBody.textContent = 'reading…'
  await showView('file')
  try {
    const response = await fetch('/api/file?path=' + encodeURIComponent(node.path))
    const body = await response.json()
    if (ticket !== fileFetches) return
    if (!response.ok) {
      fileBody.textContent = body.error ?? `the server answered ${response.status}`
      return
    }
    const bits = [humanBytes(body.bytes), body.lines + (body.lines === 1 ? ' line' : ' lines')]
    if (body.truncated) bits.push(`showing the first ${humanBytes(body.text.length)}`)
    fileHead.textContent = `${body.path}  ·  ${bits.join('  ·  ')}`
    /**
     * The server decided how to show this file and, for a document or source, produced the markup.
     * Handing it over is the whole client-side renderer: nothing here parses, escapes or highlights,
     * which is what keeps one escaping rule in the project rather than two that can disagree.
     */
    fileBody.dataset.renderer = body.renderer ?? 'text'
    /**
     * A page is fetched and framed; everything else is markup the server already produced.
     *
     * The two are separate requests on purpose: the file route answers JSON about a file, while the HTML route answers
     * the document itself with its resources rewritten, and mixing them would mean one route deciding whether its
     * answer is data or a program.
     */
    if (body.renderer === 'html') {
      fileHead.textContent = `${body.path}  ·  ${bits.join('  ·  ')}  ·  preview`
      await showHtml(body.path, await (await fetch('/api/html?path=' + encodeURIComponent(body.path))).json())
      return
    }
    fileHtml.hidden = true
    fileBody.hidden = false
    if (typeof body.html === 'string') {
      fileBody.innerHTML = body.html
    } else {
      fileBody.textContent = body.text
    }
  } catch (error) {
    if (ticket !== fileFetches) return
    fileBody.textContent = 'could not read this file: ' + (error && error.message)
  }
}

/**
 * The two panes a file can occupy: the text pane, and the frame an HTML document is shown in.
 *
 * A page cannot live in the text pane, because the text pane's rules are written for this project's own markup and a
 * document's own CSS would repaint the harness around it. The frame is a separate document, so a page looks like a
 * page and nothing it says can reach this one.
 */
const fileHtml = document.getElementById('file-html')
const htmlView = document.getElementById('html-view')

/** What a preview is allowed to contain, and it is **narrower** than DOMPurify's default rather than wider. */
const PREVIEW_TAGS = [
  'a', 'abbr', 'article', 'aside', 'b', 'blockquote', 'br', 'caption', 'cite', 'code', 'col', 'colgroup', 'dd',
  'del', 'details', 'dfn', 'div', 'dl', 'dt', 'em', 'figcaption', 'figure', 'footer', 'h1', 'h2', 'h3', 'h4',
  'h5', 'h6', 'header', 'hgroup', 'hr', 'i', 'img', 'ins', 'kbd', 'label', 'legend', 'li', 'main', 'mark', 'nav',
  'ol', 'p', 'picture', 'pre', 'q', 's', 'samp', 'section', 'small', 'source', 'span', 'strong', 'sub', 'summary',
  'sup', 'table', 'tbody', 'td', 'tfoot', 'th', 'thead', 'time', 'tr', 'u', 'ul', 'var', 'wbr', 'link', 'style',
]
const PREVIEW_ATTRS = [
  'abbr', 'align', 'alt', 'class', 'colspan', 'dir', 'height', 'href', 'hreflang', 'id', 'lang', 'media', 'name',
  'rel', 'role', 'sizes', 'span', 'src', 'srcset', 'start', 'style', 'summary', 'title', 'type', 'valign', 'width',
]

/**
 * Show an HTML document as a page.
 *
 * The order matters and is the whole safety argument: the sanitiser runs **before** anything is put in the frame, the
 * frame allows no scripts, and the document carries a policy the browser enforces. If the sanitiser has a bug, the
 * frame still cannot run a script; if both failed, the policy is what the browser reads. Three things have to fail
 * for a document in a workspace to run code in this app, and none of them is the only one.
 */
/**
 * The sanitiser, loaded on first use from this server's own copy of the package.
 *
 * Loaded here rather than by a `<script>` in the page's head, and the reason is a measurement: the first attempt
 * inserted the tag before the **first** `</head>` in the file, which is inside this page's own documentation comment
 * — so the tag never loaded, `DOMPurify` was undefined, and the whole module stopped at that point while the server
 * was answering correctly. Loading it lazily means a document that is not HTML never pays for it either.
 */
let purifierPromise = null
function loadPurifier() {
  if (globalThis.DOMPurify !== undefined) return Promise.resolve(globalThis.DOMPurify)
  if (purifierPromise === null) {
    purifierPromise = new Promise((resolve, reject) => {
      const element = document.createElement('script')
      element.src = '/vendor/purify.js'
      element.onload = () => resolve(globalThis.DOMPurify)
      element.onerror = () => reject(new Error('the sanitiser did not load'))
      document.head.append(element)
    })
  }
  return purifierPromise
}

async function showHtml(path, body) {
  let purifier = globalThis.DOMPurify
  if (purifier === undefined) {
    try {
      purifier = await loadPurifier()
    } catch {
      purifier = undefined
    }
  }
  if (purifier === undefined) {
    fileHtml.hidden = true
    fileBody.hidden = false
    fileBody.dataset.renderer = 'text'
    fileBody.textContent = 'the sanitiser did not load, so this document is shown as its source instead'
    return
  }
  const clean = purifier.sanitize(body.html ?? '', {
    ALLOWED_TAGS: PREVIEW_TAGS,
    ALLOWED_ATTR: PREVIEW_ATTRS,
    /** A style or a link element is kept for the document's own presentation, and `srcset` describes an image. */
    ADD_ATTR: ['srcset', 'sizes', 'media'],
    /** Nothing may be framed, and no URL may be followed that is not a resource. */
    FORBID_TAGS: ['script', 'iframe', 'object', 'embed', 'form', 'input', 'button', 'textarea', 'select', 'base'],
    FORBID_ATTR: ['onerror', 'onload', 'onclick', 'srcdoc', 'formaction', 'ping'],
    WHOLE_DOCUMENT: true,
    RETURN_DOM: false,
  })
  /**
   * The policy goes in as the first thing in the document, and `base` after it, so a relative reference the browser
   * resolves itself — a `url()` inside a stylesheet, which the rewrite cannot see — still lands beside the document.
   */
  const base = path.slice(0, path.lastIndexOf('/') + 1)
  const framed = clean.replace(
    /<head([^>]*)>/i,
    `<head$1><meta http-equiv="Content-Security-Policy" content="${body.csp ?? ''}"><base href="${base}">`,
  )
  htmlView.setAttribute('sandbox', 'allow-same-origin')
  /**
   * The sanitiser is asked for a whole document, so there is no branch that rebuilds one around a fragment.
   *
   * Measured, and it is why this is a sentence rather than code: the first version had such a fallback, and writing the
   * closing document tag inside its template literal **closed this page** — the browser ended the harness document at
   * that line, the body came out empty, and the server was answering correctly the whole time. The same trap caught the
   * comment that explained it, which is why this paragraph names no tag. A fallback that cannot be reached is not worth
   * a second way to write the document.
   */
  htmlView.srcdoc = framed
  fileBody.hidden = true
  fileHtml.hidden = false
}

/**
 * Follow a link inside a document, **in the panel**, rather than navigating the page away from it.
 *
 * Measured: a markdown link to a sibling file asked the browser for `/DEPLOY.md`, which answered `404`, so the reader
 * lost the document they were reading to reach a blank page. The server marks a link that names a file with
 * `data-heddle-path`, and a plain click on one opens that file here. A modified click is left alone, so
 * open-in-new-tab still does what it says.
 */
fileBody.addEventListener('click', async (clickEvent) => {
  const anchor = clickEvent.target instanceof Element ? clickEvent.target.closest('a') : null
  if (anchor === null) return
  /** A remote link, or one already marked to open beside the document, is left to the browser. */
  if (anchor.getAttribute('target') !== null) return
  if (clickEvent.metaKey || clickEvent.ctrlKey || clickEvent.shiftKey || clickEvent.button !== 0) return
  /**
   * Two shapes mean "a file in this workspace": the attribute a markdown link carries, and the address a raw HTML one
   * is given. Measured: a hand-written `<a href="README.md">` arrives only as the address, because the sanitizer
   * answers for an attribute's **value** and cannot add one to the tag — so a handler that read only the attribute
   * followed markdown links and navigated away on HTML ones.
   */
  const attribute = anchor.getAttribute('data-heddle-path')
  const addressed = anchor.getAttribute('href') ?? ''
  const path = attribute !== null && attribute.length > 0 ? attribute : decodeRawPath(addressed)
  if (path === null || path.length === 0) return
  clickEvent.preventDefault()
  const at = (anchor.getAttribute('href') ?? '').split('#')[1] ?? ''
  await openPath(path)
  if (at.length > 0) scrollToHeading(at)
  else fileBody.scrollTop = 0
})

/**
 * The file a raw address names, or `null` when the address is not this server's raw route.
 *
 * The page reads the path out of the address rather than being told it, which is the only way a raw HTML link can be
 * followed: the sanitizer decides one attribute's value and cannot add a second to the tag.
 */
function decodeRawPath(href) {
  const at = href.indexOf('/api/raw?path=')
  if (at === -1) return null
  const encoded = href.slice(at + '/api/raw?path='.length).split('#')[0]
  try {
    return decodeURIComponent(encoded)
  } catch {
    return null
  }
}

/** Open a file by its path, which is what a link names and what a tree row carries. */
async function openPath(path) {
  await showFile({ path, label: path.split('/').pop() ?? path, kind: 'file' })
}

/**
 * Take the reader to the heading a link's `#fragment` names.
 *
 * The fragments are matched by their text rather than by an `id`, because the renderer does not write ids and a
 * document written for GitHub relies on GitHub's own heading slugs. A reference that matches nothing does nothing,
 * which is the honest outcome: a jump to the top would be a lie about where the fragment is.
 */
function scrollToHeading(fragment) {
  const wanted = slug(fragment)
  const heading = [...fileBody.querySelectorAll('h1, h2, h3, h4, h5, h6')].find((element) => slug(element.textContent ?? '') === wanted)
  if (heading === undefined) return
  heading.scrollIntoView({ block: 'start' })
}

/** The same shape a heading's slug takes: lowercase, punctuation dropped, spaces as dashes. */
function slug(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
}

/**
 * Select a session row: show its conversation, and offer its two views.
 *
 * The prompt box keeps working because the session's **branch** — the folder its definition sits under — is
 * what work goes to. It is derived rather than stored, since the row's path is the definition and the branch
 * is always its grandparent: `<branch>/_sessions_/<session>`.
 */
async function selectSession(node) {
  activeFolder = node.path.replace(/\/_sessions_\/[^/]+$/, '')
  setNote('')
  if (view !== 'chat' && view !== 'trajectory') await showView('chat')
  renderRing('session')
  await showSession(node.session.id)
  /**
   * The mark is put on the row that was **clicked**, and last, because `showSession` resynchronises the
   * selection to whichever row claims the session. Before the tree stopped showing a captured conversation
   * twice, that moved the mark to the instance row — the session was shown once but claimed by two rows.
   */
  chooseSelected(node.path)
}

/**
 * What the right panel is showing, as a path in the tree.
 *
 * One idea rather than two: the panel shows a conversation or a file, and the tree marks the row that
 * is being shown. That is why the mark follows a session change *and* a file click, and why switching
 * back to Chat moves it to the conversation again — a mark that meant something else would be a second
 * thing to keep in step.
 */
let selectedPath = null

/**
 * Paint the selection, and only the selection: called after every change that redraws or adds rows.
 *
 * `aria-selected` is DSH's attribute for a chosen tree item — its session rows carry `aria-selected` and this UI used
 * `aria-current` on the row instead, which is the attribute for "the current item in a set" on a link or a page, and
 * not what a treeitem means. The stylesheet reads the attribute, so the style and the ARIA name cannot disagree.
 */
function markSelection() {
  for (const li of treeList.querySelectorAll('li[role="treeitem"]')) {
    if (!li.hasAttribute('aria-selected')) continue
    /** A tree row is chosen by path; a flat list row by the session it opens, because it has no definition folder. */
    if (li.dataset.sessionId !== undefined) {
      li.setAttribute('aria-selected', li.dataset.sessionId === current ? 'true' : 'false')
      continue
    }
    const row = li.querySelector(':scope > .row')
    li.setAttribute('aria-selected', row !== null && row.dataset.path === selectedPath ? 'true' : 'false')
  }
}

function chooseSelected(path) {
  selectedPath = path
  markSelection()
}

/** Move the mark to the row whose session is the one now shown, when that row is drawn at all. */
function syncSelectionToSession() {
  if (current === null) return
  for (const [path, entry] of rowIndex) {
    if (entry.node.session?.id === current) {
      chooseSelected(path)
      return
    }
  }
}

/** Close every open row menu; any click outside one is a dismissal. */
/**
 * Close every menu, wherever it is.
 *
 * Measured bug: this used to walk only `#tree`, so the two menus in the header — `View options` and the session's
 * `More actions` — never closed when an item was chosen, and the next click on their button was read as "close this
 * open one", which took two clicks to reopen. A menu that is not closed is a menu whose button lies about its state.
 */
function closeMenus() {
  for (const wrap of document.querySelectorAll('.menu-wrap')) {
    const list = wrap.querySelector(':scope > .menu')
    if (list !== null) list.hidden = true
    const button = wrap.querySelector(':scope > button')
    if (button !== null) button.setAttribute('aria-expanded', 'false')
  }
}

/**
 * What a row offers, as `{label, run}` pairs. An empty list means no `…` is drawn at all.
 *
 * The owner's rule of 2026-10-11: actions live behind the menu rather than on the row, because a control
 * that removes something should not sit one pixel from the control that navigates. A workspace can be
 * renamed and unregistered; an instance can start a session and retitle the one it has. A file, a type
 * folder and a plain folder offer nothing yet, so they show no menu rather than an empty one.
 */
function menuItemsFor(node) {
  const items = []
  if (node.kind === 'workspace') {
    /**
     * The owner's rule of 2026-10-11: a session can be started at the **top-level workspace** as well as
     * inside an instance, so a session that belongs to the whole repository has a home. It writes the
     * session's definition into that branch and leaves the log where logs live.
     */
    items.push({
      label: 'New session',
      glyph: 'plus',
      run: () => startSessionAt(node),
    })
    items.push({
      label: 'Rename…',
      glyph: 'rename',
      run: async () => {
        const title = window.prompt('Rename this workspace', node.label)
        if (title === null) return
        const response = await fetch('/api/workspaces/' + encodeURIComponent(node.path), {
          method: 'PATCH',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ title }),
        })
        const body = await response.json().catch(() => ({}))
        if (!response.ok) {
          setNote(body.error ?? 'could not rename that workspace')
          return
        }
        setNote('')
        await renderTree()
      },
    })
    /**
     * A refusal is shown rather than swallowed: `bootstrap` re-registers any folder that still has
     * sessions and no root above it, so "removed" and "gone" are different answers and the second one is
     * not available.
     */
    items.push({
      label: 'Unregister',
      glyph: 'unregister',
      run: async () => {
        const response = await fetch('/api/workspaces/' + encodeURIComponent(node.path), { method: 'DELETE' })
        if (!response.ok) {
          const body = await response.json().catch(() => ({}))
          setNote(body.error ?? 'could not unregister that workspace')
          return
        }
        setNote('')
        await renderTree()
      },
    })
  }
  if (node.kind === 'session' && node.session) {
    /**
     * A session's row offers what DSH's own session menu offers — pin, rename, fork, archive — because that is the
     * set a person expects from this control. The `node.session` guard is load-bearing: a `_sessions_` folder written
     * by hand names no session, and a menu on it would offer four actions that could only fail. Two are missing on purpose: **delete**, because this store's log is
     * append-only and archiving is the reversible act, and **duplicate**, because a session is a record of a run
     * rather than a document.
     *
     * The same four actions are also drawn **on the row**, revealed on hover, which is DSH's own arrangement: the
     * two acts frequent enough to skip the menu (pin and archive) sit beside the `…`, and everything else is
     * inside it. One implementation feeds both places — a second copy would be a second set of behaviours.
     */
    /**
     * DSH's names, verbatim, because that is what the owner asked for and what a person recognises: `Pin session`,
     * `Rename`, `Fork session`, `Archive session` — and `Unpin session` / `Unarchive session` when the state is the
     * other way round. The shortcut the other menu shows beside each item is not printed here; the keys work, and
     * duplicating them into the label would make the name something other than the action.
     */
    items.push({ label: node.pinned ? 'Unpin session' : 'Pin session', glyph: 'pin', run: () => pinSession(node) })
    items.push({ label: 'Rename', glyph: 'rename', run: () => renameSession(node) })
    items.push({ label: 'Fork session', glyph: 'fork', run: () => forkSession(node) })
    items.push({ label: node.archived ? 'Unarchive session' : 'Archive session', glyph: 'archive', run: () => archiveSession(node) })
  }
  if (node.kind === 'instance') {
    /**
     * `New session here` is the branch case, not a special one: it goes through the same route as the
     * workspace row's item, because what makes a session findable is its **definition** and a store session
     * without one is invisible to the tree. Measured: the first version called `/api/folders/session`, which
     * only starts a transcript — so the menu item created a session nobody could see, which is precisely
     * what "make sure it works" found.
     */
    items.push({
      label: 'New session here',
      glyph: 'plus',
      run: () => startSessionAt(node),
    })
    if (node.session) {
      items.push({
        label: 'Rename conversation…',
        glyph: 'rename',
        run: async () => {
          const title = window.prompt('Rename this conversation', node.session.title ?? '')
          if (title === null) return
          const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/title', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ title }),
          })
          const body = await response.json().catch(() => ({}))
          if (!response.ok) {
            setNote(body.error ?? 'could not rename that conversation')
            return
          }
          setNote('')
          await renderTree()
          await refreshSessions()
        },
      })
    }
  }
  return items
}

/**
 * Rename a session: its **title**, which the row shows, while the folder stays the identity.
 *
 * One function for the menu and (in future) a shortcut, because the two must not drift: a rename that one of them
 * wrote differently would be two behaviours wearing one label.
 */
async function renameSession(node) {
  const title = window.prompt('Rename this session', node.session?.title ?? '')
  if (title === null) return
  const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/title', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ title, folder: node.path }),
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not rename that session')
    return
  }
  setNote('')
  await renderTree()
  await refreshSessions()
}

/**
 * Fork a session: DSH's item and DSH's naming — `<title> (1)` — appearing beside its parent, with the view left
 * where it was, because a fork is a branch rather than a departure.
 */
async function forkSession(node) {
  const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/fork', { method: 'POST' })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not fork that session')
    return
  }
  setNote('')
  await renderTree()
  await refreshSessions()
}

/** Pin or unpin, and archive or unarchive — the two states a row can carry. */
function pinSession(node) {
  return setSessionFlags(node, { pinned: !node.pinned })
}

function archiveSession(node) {
  return setSessionFlags(node, { archived: !node.archived })
}

/**
 * Pin, unpin, archive or unarchive a session, then redraw what the change affects.
 *
 * One function for both flags because the route is one: the record and the definition are written together, and
 * a row's menu only decides which of the two it is changing.
 */
async function setSessionFlags(node, patch) {
  const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/flags', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ...patch, folder: node.path }),
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not change that session')
    return
  }
  setNote('')
  await renderTree()
  await refreshSessions()
}

/**
 * Start a session at a branch, and make the act **visible**.
 *
 * Measured: the first version created the session correctly and then re-rendered the tree, and the owner
 * reported that nothing happened — because the branch the session appeared in was **closed**, so the new row
 * was inside a closed folder. Three things follow from that, and they are what this does: the branch is
 * opened, the new session's own row is selected so the eye lands on it, and only then is the tree redrawn.
 */
async function startSessionAt(node) {
  const response = await fetch('/api/sessions', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ branch: node.path }),
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not start a session there')
    return
  }
  setNote('')
  activeFolder = node.path
  expanded.add(node.path)
  rememberExpanded()
  if (typeof body.definition === 'string') chooseSelected(body.definition.replace(/\/session\.json$/, ''))
  await showSession(body.session)
  await renderTree()
}

/**
 * Which workspace a new session should start in.
 *
 * The panel's primary action has no row of its own to be about, so it takes the reader's context in the order that
 * context exists: the selected row's workspace, then the folder the prompt box was last aimed at, then the first
 * workspace the tree draws. All three are answers to "where am I", and the first one that applies wins.
 */
function newSessionWorkspace() {
  /** The top-level root that owns a path, if any. A session's definition lives under it. */
  const owner = (path) => treeTops.find((node) => path === node.path || path.startsWith(node.path + '/')) ?? null
  if (selectedPath !== null) {
    const bySelection = owner(selectedPath)
    if (bySelection !== null) return bySelection
  }
  if (activeFolder !== null) {
    const byFolder = owner(activeFolder)
    if (byFolder !== null) return byFolder
  }
  return treeTops[0] ?? null
}

/**
 * Start a session from the panel's primary action, or say why it cannot.
 *
 * The act itself is `startSessionAt`, the same function a workspace row's `New session in …` calls: one path for the
 * one thing, so the two entry points cannot drift. The only new decision is **which** workspace, which is what
 * `newSessionWorkspace` answers.
 */
async function startNewSession() {
  const workspace = newSessionWorkspace()
  if (workspace === null) {
    setNote('register a workspace first — the + beside Workspaces')
    return
  }
  await startSessionAt(workspace)
}

document.getElementById('new-session').addEventListener('click', () => {
  void startNewSession()
})

/**
 * The session shortcuts — DSH's own chords, read from its menu on 2026-10-17: `Alt+Meta+G` rename,
 * `Shift+Meta+F` fork, `Alt+Meta+A` archive, and `Alt+Meta+K` to reach the search box.
 *
 * `Meta` is written as "meta or control" because the page runs on a Mac where the chord is ⌥⌘ and a keyboard that
 * only has Control should still reach it. Each entry states its modifiers exactly: a chord with `shift` is not the
 * same gesture as one without, and matching loosely would make `Shift+Alt+Meta+A` archive a session by accident.
 */
const SESSION_SHORTCUTS = [
  { key: 'a', alt: true, action: 'archive' },
  { key: 'g', alt: true, action: 'rename' },
  { key: 'k', alt: true, action: 'search' },
  { key: 'f', shift: true, action: 'fork' },
  /** DSH's own chord for the same control: `Alt+Meta+B`. */
  { key: 'b', alt: true, action: 'sidebar' },
  /** DSH's chord for its primary action; read from its `New session` control on 2026-10-17. */
  { key: 'n', alt: true, action: 'new-session' },
]

/**
 * Which shortcut an event is, or `null` when it is none of them.
 *
 * A pure reading of the event rather than four `if`s in a handler: the chords are a table, and a table can be read
 * back in a test or a bug report instead of being inferred from control flow.
 */
function shortcutFor(event) {
  if (!event.metaKey && !event.ctrlKey) return null
  for (const shortcut of SESSION_SHORTCUTS) {
    if (String(event.key).toLowerCase() !== shortcut.key) continue
    if (Boolean(shortcut.alt) !== event.altKey) continue
    if (Boolean(shortcut.shift) !== event.shiftKey) continue
    return shortcut.action
  }
  return null
}

/** The node of the row the panel is showing, which is what a shortcut acts on. */
function selectedNode() {
  if (selectedPath === null) return null
  const entry = rowIndex.get(selectedPath)
  return entry === undefined ? null : entry.node
}

/**
 * One listener for the four chords, on the document so they work from anywhere on the page.
 *
 * A shortcut that needs a session says so when there is none rather than doing nothing: a key that silently does
 * nothing is indistinguishable from a key that is not bound.
 */
document.addEventListener('keydown', (event) => {
  const action = shortcutFor(event)
  if (action === null) return
  event.preventDefault()
  if (action === 'sidebar') {
    setSidebarCollapsed(!sidebarCollapsed())
    sidebarToggle.focus()
    return
  }
  if (action === 'new-session') {
    void startNewSession()
    return
  }
  if (action === 'search') {
    /** The field is put away while the sidebar is a rail, so reaching it means putting the panel back first. */
    if (sidebarCollapsed()) setSidebarCollapsed(false)
    const field = document.getElementById('session-search')
    field.focus()
    field.select()
    return
  }
  const node = selectedNode()
  if (node === null || node.kind !== 'session' || node.session === undefined || node.session === null) {
    setNote('select a session first — the shortcut acts on the row the panel is showing')
    return
  }
  setNote('')
  if (action === 'archive') void archiveSession(node)
  else if (action === 'fork') void forkSession(node)
  else if (action === 'rename') void renameSession(node)
})

/** The `…` control: a button, and the one list it opens. */
function menuButton(node, items, options = {}) {
  const wrap = document.createElement('span')
  wrap.className = 'menu-wrap'
  const button = document.createElement('button')
  button.type = 'button'
  button.className = 'untwisty'
  button.textContent = '…'
  /** The name of the control, which is DSH's `More actions` where the menu is the session's own. */
  const name = options.label ?? 'actions for ' + node.label
  button.title = name
  button.setAttribute('aria-label', name)
  button.setAttribute('aria-haspopup', 'true')
  button.setAttribute('aria-expanded', 'false')
  const list = document.createElement('div')
  list.className = 'menu'
  list.setAttribute('role', 'menu')
  list.hidden = true
  /**
   * **Every menu is placed in viewport coordinates when it opens.**
   *
   * Measured bug: the sidebar's menus were `position: absolute; right: 0` inside it, and `View options` is wider than
   * the space to the right of its trigger — so its left half was **clipped by the sidebar's `overflow`**, which reads as
   * a transparent menu with its text laid over the rows behind it. Fixed positioning escapes that clip, and clamping to
   * the viewport keeps the menu on screen when the trigger sits near an edge or near the bottom of a long list.
   */
  const place = () => {
    list.style.position = 'fixed'
    list.style.right = 'auto'
    list.style.top = '0px'
    list.style.left = '0px'
    const trigger = button.getBoundingClientRect()
    const size = list.getBoundingClientRect()
    const margin = 8
    let left = trigger.left
    if (left + size.width > window.innerWidth - margin) left = window.innerWidth - margin - size.width
    if (left < margin) left = margin
    let top = trigger.bottom + 4
    if (top + size.height > window.innerHeight - margin) top = trigger.top - size.height - 4
    if (top < margin) top = margin
    list.style.left = Math.round(left) + 'px'
    list.style.top = Math.round(top) + 'px'
  }
  for (const item of items) {
    /**
     * A section name rather than an action — DSH's `WorkSpace` group title. The item carries the name in `heading`
     * itself, so the test is for the field being present rather than for `true`: an empty button in its place would be
     * a control that does nothing, which is exactly what a section name must not look like.
     */
    if (item.heading !== undefined) {
      const heading = document.createElement('span')
      heading.className = 'menu-heading'
      heading.textContent = typeof item.heading === 'string' ? item.heading : String(item.label ?? '')
      list.append(heading)
      continue
    }
    const entry = document.createElement('button')
    entry.type = 'button'
    entry.setAttribute('role', item.current === true ? 'menuitemradio' : 'menuitem')
    if (item.current === true) {
      entry.setAttribute('aria-checked', 'true')
      entry.dataset.current = 'true'
    }
    /**
     * Every item carries its mark: a menu of plain words is slower to scan than a list where the eye can go straight to
     * the glyph it wants. The glyph is decorative (`aria-hidden`), so the button's name stays exactly the action.
     */
    if (typeof item.glyph === 'string') {
      const glyph = document.createElement('span')
      glyph.className = 'menu-glyph'
      glyph.append(kindIcon(item.glyph, false))
      entry.append(glyph)
    }
    const label = document.createElement('span')
    label.className = 'menu-label'
    label.textContent = item.label
    entry.append(label)
    entry.onclick = async (event) => {
      event.stopPropagation()
      closeMenus()
      await item.run()
    }
    list.append(entry)
  }
  button.onclick = (event) => {
    event.stopPropagation()
    const wasOpen = list.hidden === false
    closeMenus()
    list.hidden = wasOpen
    button.setAttribute('aria-expanded', String(!wasOpen))
    /** Place it after it is visible, so its measured size is its real one; a hidden menu measures zero. */
    if (!wasOpen) place()
  }
  wrap.append(button, list)
  return wrap
}

document.addEventListener('click', closeMenus)

/**
 * The page's **seam for the verifiers**.
 *
 * Parts 85 and 90 drive this page by calling a handler directly — `showSession(id)` — because what they judge is the
 * panel, not the navigation that reaches it. A module's bindings are not global, so those checks met a
 * `ReferenceError: showSession is not defined`; measured in the browser, on a page whose only script is a module.
 * The alternative was for their checks to walk three tree levels to reach the same function, which tests the tree
 * instead of the panel. So the two actions are exposed here, deliberately, in one place, and named for what they
 * are: a seam rather than a public API.
 */
Object.assign(globalThis, { showSession, showFile, paintRunningMarks, runningSessions })

function nodeRow(node) {
  /** The row's right-hand slot, declared before anything appends to it: a later `const` was a TDZ error that took
   * every session row out of the tree while its branch still rendered. */
  const rowRight = document.createElement('span')
  rowRight.className = 'row-right'
  const li = document.createElement('li')
  li.setAttribute('role', 'treeitem')
  li.dataset.kind = node.kind
  li.dataset.open = 'false'
  /**
   * Which ARIA state a row carries is a property of the row, and DSH's tree draws the line where this one should:
   * a row that can open carries `aria-expanded`, and a row that can be **chosen** carries `aria-selected` and no
   * `aria-expanded` at all. This UI put `aria-expanded="false"` on session rows too, which told a screen reader
   * that a leaf has something under it — measured on DSH: its session rows carry `aria-selected` only.
   */
  const expandable = node.kind === 'workspace' || node.kind === 'type' || node.kind === 'instance' || node.kind === 'folder'
  if (expandable) li.setAttribute('aria-expanded', 'false')
  if (node.kind === 'session' || node.kind === 'file') {
    li.setAttribute('aria-selected', node.path === selectedPath ? 'true' : 'false')
  }

  const row = document.createElement('div')
  row.className = 'row'
  row.dataset.path = node.path
  row.tabIndex = 0
  /** The chosen row is marked on the tree item, where a screen reader reads it; the row keeps no second attribute. */

  /** The left of the row is what it **is**: its kind, a type's badge, and its name. */
  const icon = document.createElement('span')
  icon.className = 'icon'
  icon.append(kindIcon(node.kind, false))
  row.append(icon)
  /**
   * DSH prints a session's state before its name — `Running` in the muted body type — and the live half of it is a fact
   * this page already tracks (`runningSessions`, fed by `model/request` and `turn/completed` on the stream). The word
   * is painted from that set and repainted when it changes, so a row says "still working" without a re-fetch.
   */
  if (node.kind === 'session' && node.session !== undefined && node.session !== null && runningSessions.has(node.session.id)) {
    const status = document.createElement('span')
    status.className = 'status'
    status.textContent = 'Running'
    row.append(status)
  }
  if (node.badge) {
    const badge = document.createElement('span')
    badge.className = 'badge'
    badge.textContent = node.badge
    row.append(badge)
  }
  /**
   * A pinned session says so on the row, because a pin that only reorders rows is a rule a reader has to know;
   * this is the same mark DSH puts beside a session it holds at the top.
   */
  if (node.pinned) {
    const pin = document.createElement('span')
    pin.className = 'pin'
    pin.title = 'pinned'
    pin.setAttribute('aria-label', 'pinned')
    pin.append(kindIcon('pin'))
    row.append(pin)
  }
  if (node.archived) li.dataset.archived = 'true'
  const label = document.createElement('span')
  label.className = 'label'
  /**
   * A session row shows the name a person gave it; everything else shows the folder's name.
   *
   * This is what makes `Rename…` mean something: the title was already carried by the node and written by the
   * route, and the row ignored it — measured, renaming succeeded and the label did not move. The folder stays
   * reachable as the row's tooltip, because it is still the identity.
   */
  label.textContent = node.kind === 'session' && node.session?.title ? node.session.title : node.label
  if (node.kind === 'session') row.title = node.path
  row.append(label)

  /**
   * The dot that used to sit here said whether an instance held a session: hollow when none, filled when one.
   *
   * It is gone, by the owner's decision of 2026-10-11 — **one dot per folder is noise, not information**. What
   * it reported is already reported twice: the row's own `turns` count appears only when there is a session,
   * and the folder glyph changes when one is opened. Nothing is lost by removing a third statement of it.
   */
  if (node.session) {
    /**
     * The row says **how long ago**, and the turn count moves to the tooltip.
     *
     * DSH's list reads `context-mgmt 4d` and `Running Heddle browser tool 24min`: the age is what tells a reader
     * which conversations are live, while a count of turns says how long one was. Both are here, in the order a
     * person asks for them — the age on the row, the count on hover.
     */
    const age = document.createElement('span')
    age.className = 'age'
    age.textContent = relativeAge(node.session.created)
    rowRight.append(age)
    if (node.session.turns > 0) row.title = row.title.length > 0 ? row.title : `${node.session.turns} turn${node.session.turns === 1 ? '' : 's'}`
  }

  /**
   * The right of the row is what can be **done** with it, and the row is now clicked to open and close — so the
   * only control at the right edge is the menu.
   *
