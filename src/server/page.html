   * The `+` / `−` box that used to sit here is gone, by the owner's decision of 2026-10-11: the folder glyph on
   * the left already reports the state, and clicking the row performs the act, so the box was a second way to
   * do one thing and the eye had to find it before it could be used.
   */
  /**
   * DSH's arrangement, adopted on 2026-10-17: the row carries **three** controls, not one, and they appear when
   * the pointer or the keyboard arrives rather than always. The two direct ones are the acts frequent enough to
   * skip the menu — pin and archive — and the `…` holds the rest. A row with nothing to do still draws nothing.
   */
  const rowTools = document.createElement('span')
  rowTools.className = 'row-tools'
  /**
   * DSH's order, read from its own DOM: the `…` comes **first**, then `Archive session`, then `Pin session` — the
   * three controls at x=192, 218 and 244 of its row. This UI had `Pin`, `Archive`, `…`, which is the same three
   * gestures under a reading order a person who knows DSH has to translate.
   */
  /**
   * One quick control, shared by both kinds of row.
   *
   * Hoisted out of the session branch, and that is a fix rather than a tidy-up: the workspace branch below calls it
   * too, and while it was declared inside the session branch the workspace row threw `quickButton is not defined` —
   * which took the **whole tree** down, because one row's exception aborts the loop that draws them. Measured in a
   * fresh workspace: no rows, no note, and nothing on screen to say why.
   */
  const quickButton = (label, glyph, run) => {
    const button = document.createElement('button')
    button.type = 'button'
    button.className = 'untwisty'
    button.title = label
    button.setAttribute('aria-label', label)
    button.append(kindIcon(glyph))
    button.onclick = async (event) => {
      event.stopPropagation()
      await run()
    }
    return button
  }
  if (node.kind === 'session' && node.session) {
    const quick = document.createElement('span')
    quick.className = 'session-actions'
    quick.append(quickButton(node.archived ? 'Unarchive session' : 'Archive session', 'archive', () => archiveSession(node)))
    quick.append(quickButton(node.pinned ? 'Unpin session' : 'Pin session', 'pin', () => pinSession(node)))
    quick.dataset.slot = 'after-menu'
    rowTools.append(quick)
  }
  /**
   * A workspace row offers one act on hover, which is the act its name is for. Measured on DSH's own row: its two
   * buttons are `Workspace actions for <name>` (the `…`) and `New session in <name>`, in that order — the menu first,
   * then the one common action, which is the same arrangement the session rows use.
   */
  if (node.kind === 'workspace') {
    const quick = document.createElement('span')
    quick.className = 'session-actions'
    quick.append(quickButton(`New session in ${node.label}`, 'plus', () => startSessionAt(node)))
    quick.dataset.slot = 'after-menu'
    rowTools.append(quick)
  }
  const actions = menuItemsFor(node)
  if (actions.length > 0) rowTools.append(menuButton(node, actions))
  /**
   * The menu goes **before** the quick controls, which is DSH's order. Done by moving the node rather than by
   * building in a different order, because the menu is appended by the shared builder and the quick controls are
   * built above it: `insertBefore` states the arrangement in one line instead of in two call sites.
   */
  const menuSlot = rowTools.querySelector(':scope > .menu-wrap')
  const quickSlot = rowTools.querySelector(':scope > .session-actions')
  if (menuSlot !== null && quickSlot !== null) rowTools.insertBefore(menuSlot, quickSlot)
  /** Nothing to do, nothing drawn: a row with no actions keeps its age at the edge and no empty slot. */
  if (rowTools.children.length > 0) rowRight.append(rowTools)
  if (rowRight.children.length > 0) row.append(rowRight)

  row.onclick = async () => {
    /**
     * Three kinds of row, three different acts — the owner's rules of 2026-10-11.
     *
     * A **file** is selected and shown in the panel, on its own. A **session** is selected and its
     * conversation is shown, with its trajectory a tab away. Everything else is a **folder**, and clicking
     * one only opens or closes it: navigation does not change what the panel is showing, so a person can
     * read a file and open three folders to look for another one without losing their place.
     */
    if (node.kind === 'file') {
      await showFile(node)
      return
    }
    if (node.kind === 'session') {
      await selectSession(node)
      return
    }
    await toggle(node, li)
  }
  row.onkeydown = (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault()
      row.onclick()
    }
  }

  li.append(row)
  rowIndex.set(node.path, { node, li, icon })
  return li
}

/** Draw a node's children, fetching them when they were not part of the answer that drew the node. */
async function loadChildren(node, li) {
  const group = document.createElement('ul')
  group.setAttribute('role', 'group')
  li.append(group)
  let children = node.children
  if (children === null) {
    try {
      /**
       * The same filter the roots were read with. Measured: expanding a branch re-read it **without** the
       * archived flag, so after toggling `Show archived` the roots came back with the archived session and
       * every reopened branch replaced it with the unfiltered list — the row existed and could not be seen.
       */
      const response = await fetch('/api/tree?path=' + encodeURIComponent(node.path) + archiveQuery('&'))
      if (!response.ok) throw new Error('the tree answered ' + response.status)
      children = (await response.json()).children ?? []
    } catch (error) {
      setNote('could not read ' + node.label + ': ' + (error && error.message))
      children = []
    }
  }
  if (children.length === 0) {
    /**
     * A folder with nothing inside still opens **and closes**.
     *
     * The first version disabled the disclosure here and turned it into `·`, which the owner hit at
     * once: a leaf could be opened and then had no way back, because the only control that closed a
     * node was the one just disabled. Whether a folder is empty is only known after asking, so the
     * control cannot be the thing that reports it — the note below does, and `+` / `−` keep meaning
     * what they say.
     */
    const empty = document.createElement('div')
    empty.className = 'empty'
    empty.textContent = 'nothing inside'
    group.append(empty)
    return
  }
  for (const child of children) group.append(nodeRow(child))
  markSelection()
}

async function toggle(node, li) {
  const open = li.dataset.open === 'true'
  const entry = rowIndex.get(node.path)
  /**
   * The signs of one state: the **folder glyph on the left**, and the list item's own `aria-expanded` — which is
   * what tells a screen reader, and is why removing the `+` / `−` box lost no accessibility: the state was
   * always on the row as well as on the control.
   */
  const paint = (isOpen) => {
    li.dataset.open = isOpen ? 'true' : 'false'
    if (li.hasAttribute('aria-expanded')) li.setAttribute('aria-expanded', isOpen ? 'true' : 'false')
    if (entry !== undefined && entry.icon !== undefined) entry.icon.replaceChildren(kindIcon(node.kind, isOpen))
  }
  if (open) {
    paint(false)
    li.querySelector('ul[role=group]')?.remove()
    expanded.delete(node.path)
    rememberExpanded()
    return
  }
  paint(true)
  expanded.add(node.path)
  rememberExpanded()
  await loadChildren(node, li)
  applySearch()
}

/**
 * Filter the tree by name, without asking the server.
 *
 * A session's name is on its row already, so the filter is a walk over the drawn rows rather than another
 * request — which is also why it can run on every keystroke. Only rows are put away: the branches stay, so the
 * answer still shows *where* the matching sessions are.
 */
/**
 * What a search runs over: every session, and the roots that place it.
 *
 * Held until `refreshSessions` says the set changed, because a keystroke should not refetch two endpoints, and
 * rebuilt rather than patched when it does change — a stale index would answer a search with sessions that no
 * longer exist and miss the ones that do.
 */
let searchIndex = null

async function loadSearchIndex() {
  if (searchIndex !== null) return searchIndex
  const [sessions, treeBody] = await Promise.all([
    fetch('/api/sessions').then((response) => (response.ok ? response.json() : [])).catch(() => []),
    fetch('/api/tree').then((response) => (response.ok ? response.json() : { children: [] })).catch(() => ({ children: [] })),
  ])
  searchIndex = {
    sessions: Array.isArray(sessions) ? sessions : [],
    roots: (treeBody.children ?? []).map((node) => ({ path: node.path, title: node.label })),
  }
  return searchIndex
}

/** The workspace a folder belongs to: the longest root path that contains it. */
function workspaceOf(cwd, roots) {
  let best = null
  for (const root of roots) {
    if (cwd === root.path || cwd.startsWith(root.path + '/')) {
      if (best === null || root.path.length > best.path.length) best = root
    }
  }
  return best === null ? null : best.title
}

/**
 * The search box, as DSH has it: a query **replaces** the tree with a flat result list whose rows say which
 * workspace each hit is in, and an empty query restores the tree.
 *
 * Measured against the earlier version, which only hid session rows: that kept the tree's shape but could not
 * find a session whose branch was closed, and it never said where a hit lived. A search is about names.
 */
async function applySearch() {
  const query = document.getElementById('session-search').value.trim()
  const results = document.getElementById('search-results')
  const note = document.getElementById('search-note')
  if (query.length === 0) {
    results.hidden = true
    results.replaceChildren()
    treeList.hidden = false
    note.hidden = true
    note.textContent = ''
    return
  }
  const index = await loadSearchIndex()
  const needle = query.toLowerCase()
  const hits = index.sessions.filter((meta) => `${meta.title ?? ''} ${meta.id}`.toLowerCase().includes(needle))
  treeList.hidden = true
  results.hidden = false
  results.replaceChildren(
    ...hits.map((meta) => {
      const button = document.createElement('button')
      button.type = 'button'
      button.className = 'hit'
      button.setAttribute('role', 'treeitem')
      const title = document.createElement('span')
      title.className = 'hit-title'
      title.textContent = meta.title !== undefined && meta.title.length > 0 ? meta.title : meta.id
      const place = document.createElement('span')
      place.className = 'hit-workspace'
      /**
       * The workspace, and the **age**. DSH's results read `title workspace`; the age is added because a store
       * can hold several sessions with the same first message — measured: a search for `ready` returned 34 rows
       * with one title between them — and a result a reader cannot tell apart is a result they cannot choose.
       */
      place.textContent = [workspaceOf(meta.cwd, index.roots), relativeAge(meta.created)].filter((part) => part !== null && part.length > 0).join(' · ')
      button.append(title, place)
      button.onclick = () => showSession(meta.id)
      return button
    }),
  )
  note.hidden = hits.length > 0
  note.textContent = hits.length > 0 ? '' : `no session matches “${query}”`
}

/** Escape is the second way out of a search, because the first is a small × most browsers draw. */
document.getElementById('session-search').addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return
  document.getElementById('session-search').value = ''
  applySearch()
})

/**
 * DSH's `In one list`: every session in one flat column, newest first, pinned first — the same order the tree uses
 * inside a branch, without the folders.
 *
 * It is a **reading** list rather than a second tree: a row opens its session, and the hover controls that need a
 * session's definition folder stay on the tree's rows, where that folder is known. A flat row that offered a rename it
 * could not complete would be worse than a list that does not offer it.
 */
async function renderFlatList() {
  treeList.replaceChildren()
  rowIndex.clear()
  const index = await loadSearchIndex()
  const visible = index.sessions.filter((meta) => {
    const archived = meta.archived === true
    if (archiveMode === 'only') return archived
    if (archiveMode === 'hide') return !archived
    return true
  })
  visible.sort((left, right) => Number(right.pinned === true) - Number(left.pinned === true) || String(right.created).localeCompare(String(left.created)))
  treeList.replaceChildren(
    ...visible.map((meta) => {
      const li = document.createElement('li')
      li.setAttribute('role', 'treeitem')
      li.dataset.kind = 'session'
      li.dataset.sessionId = meta.id
      li.setAttribute('aria-selected', meta.id === current ? 'true' : 'false')
      const row = document.createElement('div')
      row.className = 'row'
      row.dataset.path = meta.cwd
      row.tabIndex = 0
      const icon = document.createElement('span')
      icon.className = 'icon'
      icon.append(kindIcon('session', false))
      const label = document.createElement('span')
      label.className = 'label'
      label.textContent = meta.title !== undefined && meta.title.length > 0 ? meta.title : meta.id
      const place = document.createElement('span')
      place.className = 'age'
      place.textContent = [workspaceOf(meta.cwd, index.roots), relativeAge(meta.created)].filter((part) => part !== null && part.length > 0).join(' · ')
      row.append(icon, label, place)
      row.onclick = () => showSession(meta.id)
      li.append(row)
      return li
    }),
  )
  setNote(visible.length === 0 ? 'no sessions to list' : '')
}

async function renderTree() {
  if (groupingMode === 'list') {
    await renderFlatList()
    return
  }
  rowIndex.clear()
  let body
  try {
    const response = await fetch('/api/tree' + archiveQuery('?'))
    if (!response.ok) {
      treeList.replaceChildren()
      setNote(
        response.status === 503
          ? 'this profile does not load the workspace plugin'
          : 'the tree answered ' + response.status,
      )
      return
    }
    body = await response.json()
  } catch (error) {
    setNote('could not read the tree: ' + (error && error.message))
    return
  }
  const tops = body.children ?? []
  treeTops = tops
  /**
   * A **first visit** opens the first workspace, which is what DSH shows.
   *
   * Measured from DSH's sidebar on 2026-10-17: its tree arrives with a workspace's sessions on screen, not with a list
   * of closed folder names. Heddle arrived closed unless a previous visit had recorded an expansion, so a reader with
   * no history saw two words — the case the owner reported as the tree having stopped showing. The default is chosen
   * once, written down like any other expansion, and a reader who closes it is remembered as having closed it.
   */
  const firstVisit = (() => {
    try {
      return localStorage.getItem(EXPANDED_KEY) === null
    } catch (error) {
      return false
    }
  })()
  if (firstVisit) {
    const firstBranch = tops.find((node) => Array.isArray(node.children) && node.children.length > 0)
    if (firstBranch !== undefined) {
      expanded.add(firstBranch.path)
      rememberExpanded()
    }
  }
  if (tops.length === 0) setNote('no workspace root yet — register one with the + above')
  else setNote(activeFolder === null ? '' : 'a new conversation in ' + activeFolder.split('/').filter(Boolean).pop())
  treeList.replaceChildren(...tops.map(nodeRow))

  /**
   * The adopted folders, drawn with the same rows as the tree.
   *
   * They are the sessions nobody chose a project for: a folder that exists as a root only because a
   * session ran there. Same component, same lazy expansion, one level at a time — the difference is
   * a heading a person can act on.
   */
  const adhoc = body.adHoc ?? []
  list.replaceChildren(...adhoc.map(nodeRow))
  adhocNote.hidden = adhoc.length > 0
  adhocNote.textContent = 'nothing ad hoc — every session is under a workspace you registered'
  /**
   * A reload comes back to the shape a person left: the remembered nodes are opened again shallowest
   * first, so a deeper one is drawn by the time its turn comes, and each level is re-read rather than
   * remembered, because a cached level is a level that can be stale.
   */
  for (const path of [...expanded].sort((left, right) => left.split('/').length - right.split('/').length)) {
    const entry = rowIndex.get(path)
    // A file is never in `expanded`; skipping it keeps a stray key from asking for a disclosure it has.
    if (entry === undefined || entry.node.kind === 'file' || entry.li.dataset.open === 'true') continue
    await toggle(entry.node, entry.li)
  }
  if (selectedPath === null) syncSelectionToSession()
  markSelection()
}

/**
 * Arrow keys cross the tablist, which is what `role=tab` promises a keyboard reader.
 *
 * The handler is on the tablist rather than on the document, so it only acts while focus is inside the ring — a page
 * that moved its tabs whenever the arrow keys were pressed anywhere would be fighting a reader who was scrolling a
 * conversation.
 */
document.getElementById('views').addEventListener('keydown', (keyEvent) => {
  const tabs = [...document.querySelectorAll('#views button[role="tab"]')].filter((button) => !button.hidden)
  if (tabs.length === 0) return
  const index = tabs.indexOf(document.activeElement)
  if (index === -1) return
  let next = null
  if (keyEvent.key === 'ArrowRight') next = tabs[(index + 1) % tabs.length]
  else if (keyEvent.key === 'ArrowLeft') next = tabs[(index - 1 + tabs.length) % tabs.length]
  else if (keyEvent.key === 'Home') next = tabs[0]
  else if (keyEvent.key === 'End') next = tabs[tabs.length - 1]
  if (next === null) return
  keyEvent.preventDefault()
  next.focus()
  next.click()
})

document.getElementById('views').addEventListener('click', (clickEvent) => {
  const button = clickEvent.target.closest('button[data-view]')
  if (button) showView(button.dataset.view)
})

/**
 * The `+` opens the **platform's** folder chooser and mounts what it returns.
 *
 * The dialog is opened by the server, not by this page, and that is not a shortcut: a page runs
 * sandboxed, so a file input yields relative paths and `showDirectoryPicker` yields an opaque handle —
 * neither carries the absolute path a mount needs. The server runs on the machine the folder is on, so
 * it can ask the platform and hand the answer back.
 *
 * A cancel is nothing to do. A host with no usable dialog answers `501` with the reason, and this falls
 * back to typing a path rather than leaving a person with a button that does nothing.
 */
/**
 * The session's own actions, in the header where DSH keeps them. One item: the log as a file.
 *
 * A download is a navigation, not a fetch: the route answers with `Content-Disposition: attachment`, so pointing an
 * anchor at it is what tells the browser to save rather than navigate. The anchor is created, clicked and removed in
 * one turn of the event loop, which is the only way to trigger a download without a visible control.
 */
function downloadSessionLog() {
  if (current === null) {
    setNote('open a session first — the download is of the session the panel is showing')
    return
  }
  const anchor = document.createElement('a')
  anchor.href = '/api/sessions/' + encodeURIComponent(current) + '/log'
  anchor.download = ''
  document.body.append(anchor)
  anchor.click()
  anchor.remove()
}

document.getElementById('session-more').append(
  menuButton({ label: 'this session' }, [{ label: 'Download session log', glyph: 'download', run: downloadSessionLog }], { label: 'More actions' }),
)
document.getElementById('view-options').append(menuButton({ label: 'view options' }, viewOptionItems()))
document.getElementById('add-workspace').onclick = async () => {
  let path = null
  try {
    const picked = await fetch('/api/workspaces/pick', { method: 'POST' })
    const body = await picked.json().catch(() => ({}))
    if (picked.ok) {
      if (body.kind === 'cancelled') return
      if (typeof body.path === 'string' && body.path.length > 0) path = body.path
    } else {
      setNote(body.error ?? 'this host has no folder dialog')
      path = prompt('Folder to register as a workspace root')
    }
  } catch (error) {
    // The route is unreachable, which is a host problem rather than a canvas problem: type it instead.
    setNote('could not open a folder dialog: ' + (error && error.message))
    path = prompt('Folder to register as a workspace root')
  }
  if (path === null || path.trim() === '') return
  const response = await fetch('/api/workspaces', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ path: path.trim() }),
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not register that folder')
    return
  }
  setNote('')
  await renderTree()
}

/**
 * The page starts with what the composer needs, in the order it needs it.
 *
 * The endpoint list first, because the model seat can draw nothing without it and a session that arrives with
 * its own recorded model has to be shown against a list that exists. Then the session, then the tree. The queue
 * is drawn last: it is empty at boot, and drawing it once is what gives the submit action its first label.
 */
await loadEndpoints()
await loadStatus()
growComposer()
await refreshSessions()
document.getElementById('session-search').addEventListener('input', applySearch)
renderTree().then(() => applySearch())
renderQueue()
renderComposerState()
/** The panel's first word: a conversation, or an invitation to start one. */
paintEmptyState()
</script>
<script>
/**
 * The team panel, from the same projection the tools read.
 *
 * A separate script so the team view does not touch the conversation's own functions: it polls the session id
 * the page is showing, reads /api/team for it, and renders the roster, the shared board and the mailbox ledger.
 * A session with no team hides the panel, and the interval keeps live status fresh in a quiet log.
 */
let teamShownFor = null
async function refreshTeam() {
  const panel = document.getElementById('team-panel')
  if (panel === null) return
  /**
   * The session the panel is about: an explicit `?session=` (a deep link to one session's team) or the tree's
   * selected row. The deep link exists because a team can be inspected without clicking through the tree.
   */
  const explicit = new URLSearchParams(location.search).get('session')
  const selected = document.querySelector('#tree li[aria-selected="true"]')
  const titled = document.getElementById('session-title') === null ? '' : document.getElementById('session-title').textContent.trim()
  const session =
    explicit !== null && explicit.length > 0
      ? explicit
      : selected !== null && typeof selected.dataset.sessionId === 'string'
        ? selected.dataset.sessionId
        : /^session-/.test(titled)
          ? titled
          : null
  if (session === null) {
    panel.hidden = true
    teamShownFor = null
    return
  }
  let body = null
  try {
    const response = await fetch('/api/team?session=' + encodeURIComponent(session))
    if (response.ok) body = await response.json()
  } catch {
    body = null
  }
  const teammates = body === null ? [] : body.members.filter((member) => member.role === 'teammate')
  const tasks = body === null ? [] : body.tasks.filter((task) => task.status !== 'deleted')
  if (body === null || (teammates.length === 0 && tasks.length === 0 && body.messages.length === 0)) {
    panel.hidden = true
    teamShownFor = session
    return
  }
  panel.hidden = false
  teamShownFor = session
  document.getElementById('team-summary').textContent = teammates.length + ' teammate(s) \u00b7 ' + tasks.length + ' task(s)'
  const roster = document.getElementById('team-roster')
  roster.replaceChildren()
  for (const member of body.members) {
    const item = document.createElement('li')
    item.className = 'team-member'
    item.dataset.status = member.status
    item.dataset.role = member.role
    item.dataset.name = member.name
    item.textContent = member.name + ' \u00b7 ' + member.role + ' \u00b7 ' + member.status
    roster.append(item)
  }
  const board = document.getElementById('team-tasks')
  board.replaceChildren()
  for (const task of tasks) {
    const item = document.createElement('li')
    item.className = 'team-task'
    item.dataset.status = task.status
    item.dataset.taskId = task.id
    const owner = task.ownerName === undefined ? '' : ' \u00b7 ' + task.ownerName
    const ready = task.status === 'pending' && task.ready ? ' \u00b7 ready' : ''
    item.textContent = task.id + ' ' + task.subject + ' \u00b7 ' + task.status + owner + ready
    item.title = task.writeScopeWarnings.join('\n')
    board.append(item)
  }
  const queued = body.messages.filter((message) => !body.delivered.includes(message.id)).length
  document.getElementById('team-mail').textContent = queued + ' queued \u00b7 ' + body.delivered.length + ' delivered'
}
setInterval(() => {
  void refreshTeam()
}, 2000)
setTimeout(() => void refreshTeam(), 300)
</script>
</body>
