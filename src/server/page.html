<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heddle</title>
<!--
  The tab's icon, in DSH's own shape: an SVG, declared as one. DSH ships a **pair** of these, chosen by
  `prefers-color-scheme`, and this project has the files for only one of them — `heddle.svg` is the grey-and-orange
  mark, which reads on a light or a dark tab bar, while `heddle-bw.svg` is all black and would vanish on a dark
  one. A link to an invisible icon is worse than no link, so the pair waits for a light-on-dark variant.
-->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /**
   * The palette, read from this machine's reference tab rather than chosen here.
   *
   * Measured on 2026-10-17 with `getComputedStyle` in the same browser: the canvas is #171717, raised surfaces
   * #222222, the border #353535, ink #ededed with #b3b3b3 for supporting text, and one accent blue. The type is
   * its own stack — `-apple-system` and `BlinkMacSystemFont` before the generic sans — and the figure face
   * names "Optimistic Mono" first, falling back through the platform monospace stack. The page is dark by
   * decision: the reference does not offer a light appearance, so following the system here would be a different
   * product rather than a similar one.
   */
  :root {
    color-scheme: dark;
    --bg: #171717;
    --surface: #222222;
    --surface-2: #242424;
    --sidebar: #1c1c1c;
    /** The composer card's surface, read from DSH's own card (#2c2c2e). */
    --composer: #2c2c2e;
    --hover: #2c2c2c;
    --border: #353535;
    --border-strong: #4a4a4a;
    --text: #ededed;
    --text-2: #b3b3b3;
    --text-3: #8f8f8f;
    --accent: #2694fe;
    --on-accent: #171717;
    --radius: 8px;
    --radius-pill: 999px;
    --shadow-low: 0 1px 1px -1px #0003;
    --shadow-menu: 0 2px 8px -2px #0003;
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "Optimistic Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --code-bg: #232127;
    --line: var(--border);
  }
  * { box-sizing: border-box; }
  /**
   * The page paints its own surface and its own ink, in both appearances.
   *
   * Measured: the body had no background and no colour, so both came from the platform's default — and in a dark
   * system that is white text on black, which happened to match the palette and hid the problem. The palette is
   * written for a dark surface; on a light system the same rules would have put pale text on white. Naming the two
   * values makes the page's appearance the page's own decision, whichever appearance the reader prefers.
   */
  body {
    margin: 0;
    font: 14px/1.5 var(--font);
    display: flex;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
  }
  /**
   * The sidebar's width is one custom property, read by the panel and by nothing else.
   *
   * The default lives here, so a reader without stored preferences gets 22rem, and the script only ever
   * overwrites the property — measurement and layout can therefore never disagree about which width is in
   * force, which is what happens when a script sets `style.width` on the panel and a stylesheet disagrees.
   */
  :root {
    --sidebar-width: 22rem;
    /**
     * The code face, which is DSH's own stack and the reason it matters: a bare `monospace` resolves to whatever the
     * platform picks, and on this machine that is a face with no CJK coverage — so a Chinese comment in a source file
     * fell back per-glyph to a proportional font and the line lost its column. The CJK faces at the end are what keep
     * a mixed line monospaced.
     *
     * Measured here: Menlo and PingFang SC are installed; SF Mono, JetBrains Mono and Fira Code are not, so they are
     * named for the machines that have them and the rest of the stack carries this one.
     */
    --code-font: "Optimistic Mono", "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, "Liberation Mono", Courier, ui-monospace, "PingFang SC", "Microsoft YaHei", monospace;
    /**
     * The size of a code line, from DSH's theme as well: 12px text on a 19px line.
     *
     * Measured before: 12.48px on 18.1px, which is nearly the same size and a **tighter** line — and the owner's
     * report was that the panel felt intrusive to read. The difference between code that welcomes a reader and code
     * that crowds one is mostly the leading and the gutter, not the point size.
     */
    --code-size: 12px;
    --code-leading: 19px;
  }
  #session-search { width: 100%; margin: 0 0 .5rem; padding: .3rem .45rem; font: inherit; font-size: .8rem; color: inherit; background: color-mix(in oklab, currentColor 6%, transparent); border: 1px solid var(--line); border-radius: .3rem; }
  #session-search::placeholder { opacity: .6; }
  aside { width: var(--sidebar-width); flex: none; border-right: 1px solid var(--border); overflow-y: auto; padding: .75rem; color: var(--text-2); background: var(--sidebar); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  /**
   * The divider borrows the sidebar's border so the drag target is where the line already is, and widens its
   * hit area into the content with a transparent border rather than by pushing the layout around.
   */
  #gutter-left {
    flex: none;
    width: 5px;
    margin-left: -3px;
    cursor: col-resize;
    background: transparent;
    border: none;
    padding: 0;
    touch-action: none;
  }
  #gutter-left:hover, #gutter-left:focus-visible, #gutter-left[data-dragging='true'] {
    background: color-mix(in oklab, currentColor 25%, transparent);
    outline: none;
  }
  h1 { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: .25rem 0 .5rem; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: .4rem .5rem; border-radius: var(--radius); cursor: pointer; }
  li:hover { background: var(--surface); }
  li[aria-current] { background: var(--surface); color: var(--text); }
  .meta { opacity: .6; font-size: .78rem; }
  /**
   * The chat rows, laid out and dressed the way DSH's are.
   *
   * DSH's chat is a centred column of rows with a **flow gap of 6px**, widened to 12px after a response and to
   * 16px after a run of process rows — so a turn's reasoning and tool calls stay tight together while the
   * answer they produced has room. Its user message is a right-aligned rounded bubble; its assistant answer is
   * full width and carries no chrome at all; its reasoning and tool rows are compact one-line disclosures that
   * open into their bodies. Those are the four shapes this block is.
   */
  #log { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 24px; }
  #log > * { min-width: 0; }
  .turn { white-space: pre-wrap; overflow-wrap: anywhere; }
  /**
   * The person's own message: a bubble against the right edge, capped at 82% of the column — DSH's
   * `MessageItem` bubble, which is `padding: 10px 16px` at `radius-xl` on the specific-bubble surface.
   */
  .turn.user {
    align-self: flex-end; max-width: min(82%, 34rem); padding: .55rem .9rem;
    border: 1px solid var(--border); border-radius: 1rem;
    background: var(--surface); color: var(--text);
  }
  /** The answer: no border, no bubble, roomier leading — DSH's `AssistantMarkdown` root. */
  .turn.assistant { margin-top: 6px; font-size: 15px; line-height: 24px; color: var(--text); }
  .turn.assistant[data-state='running']::after { content: '▍'; margin-left: .1rem; opacity: .45; }
  /**
   * A drawn answer is a document, so it follows the document's whitespace rather than the row's `pre-wrap`
   * (which would double every newline the markup already carries), and its first and last blocks sit flush.
   */
  .turn.assistant.markdown { white-space: normal; }
  /**
   * The row's own actions, under the answer — DSH's `AssistantMarkdown` action row (`margin-top: 16px`,
   * pulled left so the glyph lines up with the text rather than centring under it). They are quiet until the
   * row is hovered or the button is focused, because an answer is read far more often than it is copied.
   */
  .turn .actions { display: flex; gap: .15rem; margin-top: .3rem; margin-left: -.3rem; }
  .turn .action {
    width: 1.5rem; height: 1.5rem; display: grid; place-items: center; padding: 0;
    font: inherit; font-size: .78rem; color: inherit; background: none; border: none;
    border-radius: .3rem; opacity: 0; cursor: pointer; transition: opacity .12s;
  }
  .turn:hover .action, .turn .action:focus-visible, .turn .action[data-copied='true'] { opacity: .6; }
  .turn .action:hover { opacity: 1; background: color-mix(in oklab, currentColor 10%, transparent); }
  .turn .action[data-copied='true'] { opacity: 1; }
  .turn.assistant.markdown > :first-child { margin-top: 0; }
  .turn.assistant.markdown > :last-child { margin-bottom: 0; }
  /** A refusal or a failure is a sentence, not a bordered quote. */
  .turn.denied { color: #d14343; }
  /** Process rows — reasoning and tool calls — are compact disclosures. */
  details.turn { font-size: 13px; }
  details.turn > summary {
    display: flex; align-items: baseline; gap: .4rem;
    cursor: pointer; list-style: none; padding: .12rem 0; min-width: 0; color: var(--text-2);
  }
  details.turn > summary:hover { color: var(--text); }
  details.turn > summary::-webkit-details-marker { display: none; }
  details.turn > summary::before { content: '▸'; flex: none; font-size: .7em; opacity: .8; }
  details.turn[open] > summary::before { content: '▾'; }
  /**
   * The summary line DSH shows while a row is still arriving: its `data-streaming` summary fades out at the
   * end rather than being clipped, because a truncated live line and a finished one look identical otherwise.
   */
  details.turn[data-state='running'] > summary { mask-image: linear-gradient(90deg, #000 calc(100% - 3rem), transparent); }
  details.turn[data-state='error'] > summary { color: #d14343; opacity: .95; }
  details.turn > [data-body] {
    margin: .2rem 0 .3rem 1.15rem; padding-left: .6rem; border-left: 2px solid var(--line);
    white-space: pre-wrap; font-family: var(--code-font); font-size: 12px; line-height: 19px;
  }
  details.turn.reasoning > [data-body] { font-style: italic; }
  details.turn.tool > [data-body] { border-left-color: color-mix(in oklab, #8b5cf6 45%, var(--line)); }
  details.turn.tool pre { margin: .2rem 0; overflow-x: auto; }
  details.turn.tool [data-result] { opacity: .85; }
  details.turn.tool[data-state='running'] > summary { opacity: .6; }
  nav#views { display: flex; gap: .25rem; padding: .5rem .75rem 0; border-bottom: 1px solid var(--line); }
  nav#views button { font: inherit; font-size: .82rem; padding: .3rem .7rem; background: none; border: 1px solid transparent; border-bottom: none; border-radius: .35rem .35rem 0 0; color: inherit; opacity: .6; cursor: pointer; }
  nav#views button[aria-current='true'] { opacity: 1; border-color: var(--line); background: color-mix(in oklab, currentColor 7%, transparent); }
  /**
   * `hidden` has to win over this file's own display rules.
   *
   * Measured: the Chat rows were still drawn above the ledger in the Trajectory view. `#log` sets
   * `display: flex` with an **id** selector, and the browser's `[hidden] { display: none }` is a type-level
   * default — so the id won, `hidden` did nothing, and both views were on screen at once. A view ring that
   * leaves the previous view visible is worse than no ring: it looks like the ledger has chat in it.
   *
   * `!important` is the honest tool here rather than a specificity race, because the rule's meaning is
   * "hidden means hidden" and every future display rule must lose to it.
   */
  [hidden] { display: none !important; }
  #ledger { flex: 1; overflow-y: auto; padding: .65rem .85rem .85rem; font-size: .79rem; line-height: 1.45; }
  #ledger .summary { font-size: .8rem; opacity: .7; margin-bottom: .6rem; }
  #ledger .turn { border-left: 3px solid var(--line); margin: 0 0 .6rem; padding-left: .6rem; }
  /**
   * The turn header stays at the top of the pane while its records scroll under it.
   *
   * A ledger is long, and after a page of rows the reader no longer knows which turn they are in — which is
   * the same reason the timeline exists above it.
   */
  #ledger .turn > header { font-weight: 600; font-size: .8rem; position: sticky; top: -.75rem; background: canvas; padding: .2rem 0; z-index: 1; }
  #ledger .step { margin: .2rem 0 .3rem .6rem; padding-left: .6rem; border-left: 1px dashed var(--line); }
  #ledger .step > header { font-size: .78rem; opacity: .7; }
  #ledger details.record { margin: .1rem 0; }
  /**
   * A record's row is exactly one line, truncated with an ellipsis, and opens on click.
   *
   * DSH's trajectory rows do this — `text-overflow: ellipsis` with `white-space: nowrap` on the row, and
   * `min-width: 0` on the flexible child — and the last part is the one that is easy to miss: without it a
   * flex item refuses to shrink below its content, so instead of being clipped the row pushes its siblings
   * out of the pane. A ledger of long tool arguments is otherwise unreadable and unnavigable.
   */
  #ledger details.record > summary {
    cursor: pointer;
    font-size: .8rem;
    display: flex;
    gap: .5rem;
    align-items: baseline;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.35;
  }
  /**
   * The row's layout, and the three declarations that had to be right together.
   *
   * Measured in a browser, three times, each failure looking like success:
   *
   * 1. written as a descendant selector the label computed `text-overflow: clip`, so a long label was cut
   *    mid-letter with nothing saying it continued;
   * 2. as a class it computed `ellipsis` but `flex-shrink: 0`, because a sibling rule set `flex: none` on
   *    every child — and an item that may not shrink grows past the row instead of truncating, so the
   *    ellipsis was never needed and never drawn (`label.clientWidth` was 4028px in a 1016px row);
   * 3. with `flex: 1 1 auto` on the label and no `flex` rule on its siblings, the row holds one line and
   *    the label truncates with a visible ellipsis.
   *
   * The three parts are load-bearing together: the label is the only flexible child, it may shrink, and
   * what does not fit ends in an ellipsis.
   */
  #ledger details.record > summary > .label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #ledger details.record[data-inflight='true'] > summary::after { content: ' · running'; color: #b7791f; }
  /**
   * The kind annotation, as DSH's rows carry one: a small, coloured, fixed-width badge so a reader can
   * scan a ledger for "which of these was the tool" without reading the labels.
   */
  #ledger .kind {
    font-family: var(--code-font);
    font-size: .72rem;
    min-width: 5.5rem;
    padding: .05rem .3rem;
    border-radius: .2rem;
    text-align: center;
    background: color-mix(in oklab, currentColor 10%, transparent);
    opacity: .9;
  }
  #ledger details.record[data-kind='user'] > summary > .kind { background: color-mix(in oklab, #4b8bf5 28%, transparent); }
  #ledger details.record[data-kind='assistant'] > summary > .kind { background: color-mix(in oklab, #2fa36b 28%, transparent); }
  #ledger details.record[data-kind='reasoning'] > summary > .kind { background: color-mix(in oklab, #b7791f 28%, transparent); }
  #ledger details.record[data-kind='tool'] > summary > .kind { background: color-mix(in oklab, #8b5cf6 28%, transparent); }
  #ledger details.record[data-kind='compaction'] > summary > .kind { background: color-mix(in oklab, #d14343 24%, transparent); }
  /**
   * The timeline: a proportional band of the session's recorded span, one pickable segment per turn.
   *
   * It is the same idea as the overview above DSH's ledger — real timing projected left to right, and
   * picking an interval takes the reader to it — reduced to what heddle's events support: turns as segments,
   * positioned by their own start and duration, coloured by what they did. A pick scrolls the ledger to that
   * turn, which is the whole point: a long ledger is otherwise navigated by scrolling and hoping.
   */
  /**
   * Rendering a document is **one** thing, so its styles hang off the class the renderer writes.
   *
   * Measured, and it is what the owner saw: clicking a markdown file in the left panel rendered the
   * document through a second path — tables, frontmatter and all — but every one of these rules named
   * `#doc`, the Docs pane's own element, so the file pane received the markup and none of the styling.
   * A table arrived as borderless rows of text and an inline code span showed its backticks. The class
   * is `markdown`, because that is what the server writes in **both** places, and one selector for both is
   * what stops them drifting apart again.
   */
  .markdown { min-width: 0; font-size: .9rem; line-height: 1.5; }
  .markdown h1, .markdown h2, .markdown h3, .markdown h4 { line-height: 1.3; margin: 1.2em 0 .4em; }
  .markdown h1 { font-size: 1.35rem; } .markdown h2 { font-size: 1.15rem; } .markdown h3 { font-size: 1rem; }
  .markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown pre { margin: .6em 0; }
  .markdown ul, .markdown ol { padding-left: 1.3rem; }
  .markdown code { font-family: var(--code-font); font-size: .88em; background: var(--code-bg); padding: .08rem .28rem; border-radius: 4px; }
  .markdown pre { background: var(--code-bg); border: 1px solid var(--border); padding: .7rem .8rem; border-radius: var(--radius); overflow-x: auto; }
  .markdown pre code { background: none; padding: 0; }
  /**
   * The highlighter's own class names, coloured here rather than by shipping its theme file.
   *
   * `highlight.js` styles are a few kilobytes of rules for every class it can emit; a document view shows code in
   * a handful of languages and needs the same dozen meanings coloured — a keyword, a string, a comment, a number,
   * a function name. The class names are the library's, so a theme can replace this wholesale later without
   * touching the renderer.
   */
  /**
   * The highlighter's classes, coloured **wherever the highlighter wrote them**.
   *
   * These rules named `.markdown ...` at first, which coloured a fenced block inside a document and left a source
   * file monochrome — measured: `src/cli.ts` rendered 2702 spans and **every one of them white**, because the file
   * pane is not a markdown pane. A theme belongs to the class the library emits, not to the element it was first
   * used in, so these selectors match a token in a file and in a document alike.
   *
   * The class names are the library's own, so a real theme file can replace this wholesale later.
   */
  /**
   * A palette per colour scheme, because the page follows the system (`color-scheme: light dark`).
   *
   * Measured: the first version was one set of dark-mode pastels, so on a light background a JSON string and a JSON
   * key were two washed-out tints of each other and neither could be read. A highlighter that only works in the theme
   * it was written in is half a highlighter, and the owner's report — that the panel was not welcoming — was partly
   * this.
   *
   * The semantic tokens are named for what a token **is**, so the same markup is themed twice and no rule below has
   * to know which scheme is in force. The tones are muted on purpose: a source file is something a person reads for
   * a while, and saturated colour is what makes code look like a warning.
   */
  :root {
    --tok-keyword: #c9a6f5;
    --tok-string: #8fd3ab;
    --tok-number: #f0a878;
    --tok-comment: #8b96a5;
    --tok-title: #86b4ff;
    --tok-attr: #e6c07b;
    --tok-type: #d7b3f5;
    --tok-meta: #f08a8a;
  }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag { color: var(--tok-keyword); }
  .hljs-string, .hljs-regexp, .hljs-addition { color: var(--tok-string); }
  .hljs-number, .hljs-symbol, .hljs-bullet { color: var(--tok-number); }
  .hljs-comment, .hljs-quote { color: var(--tok-comment); font-style: italic; }
  .hljs-title, .hljs-section, .hljs-name { color: var(--tok-title); }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property { color: var(--tok-attr); }
  .hljs-type, .hljs-built_in, .hljs-class, .hljs-params { color: var(--tok-type); }
  .hljs-meta, .hljs-deletion, .hljs-tag { color: var(--tok-meta); }
  .hljs-punctuation, .hljs-operator { color: inherit; opacity: .7; }
  .markdown blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: .8rem; opacity: .85; }
  .markdown hr { border: none; border-top: 1px solid var(--line); margin: 1.2rem 0; }
  .markdown a { color: #6aa6ff; }
  /**
   * An embedded image fits the pane, and is not drawn larger than its own file.
   *
   * `max-width: 100%` keeps a wide image inside the column; `max-height` keeps a tall one from pushing the rest of
   * the document a screen down — measured on this repository's own icon, which is 560x560 and filled the pane.
   * `height: auto` lets it scale by its own proportions rather than being stretched to a box.
   */
  .markdown img { max-width: 100%; max-height: 340px; height: auto; }
  /**
   * A table is a table: bordered cells, a header rule, and its own horizontal scroll when it is wider than the
   * pane. Measured before this — the markup was right and the cells ran together with no borders, which reads as
   * a paragraph of pipes rather than a table.
   */
  .markdown table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; max-width: 100%; }
  .markdown th, .markdown td { border: 1px solid var(--line); padding: .3rem .55rem; text-align: left; vertical-align: top; }
  .markdown thead th { background: color-mix(in oklab, currentColor 7%, transparent); font-weight: 600; }
  .markdown .frontmatter { border: 1px solid var(--line); border-radius: .35rem; padding: .2rem .7rem .7rem; opacity: .85; margin-bottom: 1rem; }
  .markdown .frontmatter h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
  #timeline { position: relative; height: 1.6rem; margin: .1rem 0 .7rem; border-radius: .25rem; background: color-mix(in oklab, currentColor 7%, transparent); overflow: hidden; }
  #timeline:empty { display: none; }
  #timeline button { position: absolute; top: 0; bottom: 0; padding: 0; border: none; border-right: 1px solid var(--line); background: color-mix(in oklab, #4b8bf5 45%, transparent); cursor: pointer; }
  #timeline button[data-leading='assistant'] { background: color-mix(in oklab, #2fa36b 45%, transparent); }
  #timeline button[data-leading='reasoning'] { background: color-mix(in oklab, #b7791f 45%, transparent); }
  #timeline button[data-leading='tool'] { background: color-mix(in oklab, #8b5cf6 45%, transparent); }
  #timeline button[data-running='true'] { background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, color-mix(in oklab, currentColor 25%, transparent) 4px, color-mix(in oklab, currentColor 25%, transparent) 8px); }
  #timeline button[aria-current='true'] { outline: 2px solid currentColor; outline-offset: -2px; }
  #timeline-legend { display: flex; gap: .75rem; font-size: .72rem; opacity: .6; margin: -.4rem 0 .7rem; }
  #ledger .when, #ledger .usage { opacity: .55; font-size: .76rem; }
  #ledger .usage.provider { color: #2fa36b; opacity: .9; }
  #ledger pre { white-space: pre-wrap; word-break: break-word; background: color-mix(in oklab, currentColor 6%, transparent); padding: .5rem .6rem; border-radius: .3rem; font-size: .8rem; margin: .3rem 0 0; }
  #ledger .loose { margin-top: .8rem; }
  /**
   * The file view: a header that says what was opened and how big it is, then the text.
   *
   * `white-space: pre` with wrapping, because the one thing a viewer must not do is reflow source into
   * unreadable lines; and `tab-size` so an indented file does not walk off the panel.
   */
  /**
   * The file pane is a **column**, so that the frame for an HTML document can fill the space left under the header.
   *
   * Measured: the frame was 300x150 — the size a browser gives an `iframe` with no dimensions — because this was not
   * a flex container, so the frame's own `flex: 1` had nothing to resolve against. The text panes are unaffected:
   * they scroll, and a scroll container as a flex child behaves as it did.
   */
  #file { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0; min-width: 0; }
  #file-body { flex: 1; overflow: auto; min-height: 0; }
  /**
   * The frame for a page fills what the header leaves, and the frame inside it fills that.
   *
   * Measured, and this is the second time the same cascade bit: a container with no height leaves an `iframe` at the
   * 300x150 a browser gives one by default, whatever the frame's own rules say. So the whole chain is stated —
   * container flexes and is a column, frame flexes and stretches.
   */
  #file-html { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #file-html iframe { flex: 1; width: 100%; min-height: 0; border: none; background: #ffffff; }
  #file-head {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: .4rem .8rem;
    font-size: .72rem;
    opacity: .7;
    font-family: var(--code-font);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #file-body {
    margin: 0;
    padding: .9rem 1rem 2rem;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--code-font);
    font-size: var(--code-size);
    line-height: var(--code-leading);
    tab-size: 2;
    /** Nothing in a file is emphasised, so nothing is bolder or larger than the code itself. */
    font-weight: 400;
  }
  /**
   * The left column is the **folder tree**, and the row's layout is what makes it readable: a boxed
   * `+` / `−` disclosure, the kind's icon, the type's badge, the folder's name as the label, and a
   * session marker only where a session actually is.
   *
   * Every list inside it is a layout container, never a list. Measured in a browser, and the owner saw
   * it before I did: the rule here once read `#tree, #tree ol`, while `loadChildren` builds a node's
   * children as a `<ul role="group">`. The `ul` kept the browser's defaults — `list-style-type: circle`
   * and `padding-left: 40px` — so every **nested** row carried a circle marker in a 40px gutter, which
   * reads as a stray dot at the left of each row and pushes the level in. The top level looked right,
   * which is what made it easy to miss.
   */
  #tree, #tree ul, #tree ol { list-style: none; margin: 0; padding: 0; }
  #tree li { display: block; padding: 0; }
  #tree ul[role='group'] { padding-left: .85rem; border-left: 1px solid var(--line); }
  #tree .row { display: flex; align-items: center; gap: .35rem; padding: .16rem .3rem; border-radius: .3rem; cursor: pointer; }
  #tree .row:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  /**
   * The selected row, and it has to be visible *while* the pointer is elsewhere: a tint alone is what
   * hover already draws, so the selection carries a left accent bar and a bolder name as well.
   */
  #tree .row[aria-current='true'] { background: color-mix(in oklab, currentColor 16%, transparent); box-shadow: inset 2px 0 0 currentColor; }
  #tree .row[aria-current='true'] .label { font-weight: 600; opacity: 1; }
  #tree .menu-wrap { position: relative; display: inline-flex; }
  #tree .menu { position: absolute; right: 0; top: 1.35rem; z-index: 5; display: flex; flex-direction: column; min-width: 10rem; padding: .2rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-menu); }
  #tree .menu[hidden] { display: none; }
  #tree .menu button { text-align: left; font: inherit; font-size: .82rem; padding: .3rem .5rem; background: none; border: 0; border-radius: .25rem; color: inherit; cursor: pointer; }
  #tree .menu button:hover { background: color-mix(in oklab, currentColor 10%, transparent); }
  #tree .kind { display: inline-flex; opacity: .8; }
  #tree .badge { font-size: .66rem; letter-spacing: .04em; padding: 0 .25rem; border: 1px solid var(--line); border-radius: .25rem; opacity: .8; }
  #tree .label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tree .turns { font-size: .72rem; opacity: .5; }
  #tree li[data-kind='generated'] .label { opacity: .55; }
  #tree li[data-kind='folder'] .label { opacity: .8; }
  #tree .empty { font-size: .78rem; opacity: .5; padding-left: 1.4rem; }
  #history { margin-top: .9rem; }
  #history > summary { cursor: pointer; font-size: .8rem; opacity: .6; }
  /**
   * The composer: the draft on top, its tool row underneath, and **this rule is load-bearing**.
   *
   * DSH's composer is the same shape — a text surface with a control row below it — and it is a flex
   * **column** here, not a block. Without the rule the form is a block, the textarea is an inline-level box,
   * and the prompt occupies about a sixth of the panel. Measured after it went missing once: form 1046px
   * wide, textarea 181px. It went missing because an edit that inserted the ledger's styles used this block
   * as its anchor and replaced it without restoring it — a regression no test noticed, which is why the
   * check that exists now judges the composer's width. A column keeps that claim while it makes room for the
   * row: the textarea still takes the form's own width.
   */
  /**
   * The composer, drawn as DSH draws it: **one floating card** holding the draft and the control row, with a
   * quiet status line under it.
   *
   * Measured from DSH's own page on 2026-10-17: card 712×98, `border-radius: 28px`, surface `#2c2c2e`, no
   * border but a 0.5px light ring plus two soft shadows; editor inset 4/8/0/14 at 14px on a 24px line,
   * growing to 336px; and the controls *inside* the card — `+`, access mode, model, send. These are those
   * measurements rather than taste, which is the point of copying a renderer instead of describing one.
   */
  #composer { flex: none; padding: 0 1rem .5rem; position: relative; }
  form { display: flex; flex-direction: column; gap: .4rem; padding: 0; border-top: none; background: none; }
  #composer-card {
    width: 100%; max-width: min(100%, 712px); margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--composer); border-radius: 28px; padding: 8px 0 0;
    box-shadow: 0 0 0 .5px color-mix(in oklab, var(--text) 12%, transparent), 0 4px 16px rgba(0, 0, 0, .03), 0 0 24px rgba(0, 0, 0, .03);
  }
  #prompt textarea {
    display: block; width: 100%; box-sizing: border-box;
    border: 0; outline: none; background: transparent; color: var(--text);
    font: 14px/24px var(--font);
    padding: 4px 8px 8px 14px;
    min-height: 36px; max-height: 336px; resize: none; overflow-y: auto;
  }
  #prompt textarea::placeholder { color: var(--text-3); }
  #prompt textarea:focus-visible { outline: none; }
  button { font: inherit; padding: .5rem 1rem; }
  /**
   * The tool row under the draft, in DSH's order: the model seat on the right, the submit action at the end.
   *
   * `margin-left: auto` is what puts the two at the right edge while the row stays a plain flex line, so the
   * left of the row is free for the controls heddle does not have yet — the same space DSH fills with plan
   * and permission controls.
   */
  #prompt-tools { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px; }
  #model-seat { position: relative; margin-left: auto; min-width: 0; }
  /**
   * The seat's trigger: the current model as a label with a chevron, which is DSH's `ModelSelect` trigger.
   *
   * A quiet button rather than a `<select>` on purpose: the list is drawn by the page, so it can show an
   * endpoint a session recorded that the configuration no longer holds — the one row a native select would
   * silently drop, leaving a person unable to see why their session stopped answering.
   */
  #model-trigger {
    display: inline-flex; align-items: center; gap: .3rem; max-width: 22rem;
    height: 28px; font-size: 13px; line-height: 1; padding: 0 .5rem;
    background: none; color: #cfd3d6;
    border: 0; border-radius: var(--radius); cursor: pointer;
  }
  #model-trigger:hover, #model-trigger[aria-expanded='true'], #model-trigger:focus-visible {
    color: var(--text); background: color-mix(in oklab, var(--text) 8%, transparent); outline: none;
  }
  #model-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #model-trigger .chevron { flex: none; }
  /**
   * The menu opens **upward**, because the seat sits at the bottom of the panel: a menu below the trigger
   * would be laid out past the window's edge, which is the one thing a control for switching cannot do.
   */
  #model-menu {
    position: absolute; bottom: calc(100% + .3rem); right: 0; z-index: 5;
    min-width: 17rem; max-height: 18rem; overflow-y: auto; margin: 0; padding: .25rem;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    box-shadow: var(--shadow-menu);
  }
  #model-menu button {
    display: flex; align-items: baseline; gap: .45rem; width: 100%; text-align: left;
    font: inherit; font-size: .8rem; padding: .3rem .45rem; background: none; border: none;
    border-radius: .3rem; color: inherit; cursor: pointer;
  }
  #model-menu button:hover, #model-menu button:focus-visible { background: color-mix(in oklab, currentColor 10%, transparent); outline: none; }
  #model-menu button::before { content: ''; display: inline-block; flex: none; width: .8em; opacity: .7; }
  #model-menu button[aria-checked='true']::before { content: '✓'; }
  #model-menu .model-name { flex: none; }
  #model-menu .model-id { opacity: .5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #model-menu .model-missing { opacity: .55; font-style: italic; }
  /**
   * The submit action: DSH's arrow, in the roundish primary button DSH draws it in.
   *
   * The path is DSH's own (`IconArrowUp`), kept verbatim rather than redrawn: the shape is the one the owner
   * is asking for by name, and an approximation would be a different control wearing the same word.
   */
  #send, #stop {
    flex: none; display: grid; place-items: center; width: 2.125rem; height: 2.125rem; padding: 0;
    border: 0; border-radius: var(--radius-pill);
    background: var(--accent); color: #ffffff; cursor: pointer;
  }
  #send:hover:not(:disabled), #stop:hover { background: color-mix(in oklab, var(--accent) 82%, #ffffff); }
  #send:disabled { background: var(--surface-2); color: var(--text-3); opacity: 1; cursor: default; }
  /** One action at a time: a turn that can be stopped draws Stop in Send's place. */
  #send[hidden], #stop[hidden] { display: none; }
  /** The attach button: DSH's 28px circled `+`. */
  #attach {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    font-size: 18px; line-height: 1; background: #353638; color: var(--text);
    border: 0; border-radius: var(--radius-pill); cursor: pointer;
  }
  #attach:hover, #attach[aria-expanded='true'] { background: color-mix(in oklab, var(--text) 18%, #353638); }
  /** The access chip: read, not chosen — the sandbox mode the server actually runs under. */
  #access {
    flex: none; display: inline-flex; align-items: center; gap: .35rem; height: 28px;
    padding: 0 .5rem; font-size: 13px; line-height: 1; background: none;
    color: #cfd3d6; border: 0; border-radius: var(--radius); cursor: default;
  }
  #access::before { content: ''; width: 11px; height: 11px; border: 1.3px solid currentColor; border-radius: 50%; opacity: .8; }
  /** The status line under the card: only what the page can actually know. */
  #composer-status {
    display: flex; gap: .9rem; max-width: min(100%, 712px); margin: .3rem auto 0;
    padding: 0 14px; font-size: 12px; line-height: 1.4; color: var(--text-3);
  }
  #composer-status:empty { display: none; }
  #composer-status span:empty { display: none; }
  #composer-status span + span::before { content: '·'; margin-right: .9rem; color: var(--text-3); }
  /** The file-path menu opened by `+`, floating above the card on the raised surface. */
  #attach-menu {
    position: absolute; z-index: 6; left: 50%; bottom: calc(100% - .2rem); transform: translateX(-50%);
    width: min(92%, 512px); max-height: 15rem; overflow-y: auto; padding: .25rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-menu);
  }
  #attach-menu[hidden] { display: none; }
  #attach-menu button {
    display: block; width: 100%; text-align: left; font: inherit; font-size: .78rem;
    padding: .3rem .5rem; background: none; border: 0; border-radius: 4px; color: var(--text-2);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #attach-menu button:hover, #attach-menu button:focus-visible { background: var(--hover); color: var(--text); outline: none; }
  #attach-menu .meta { padding: .3rem .5rem; }
  /**
   * The queue dock, above the composer — DSH's `QueueDock`, whose rules these follow.
   *
   * The panel is rounded on **top only** and sits flush against the composer below it, because the two are
   * one stack visually: what is waiting attaches to the thing it is waiting for. A count header appears only
   * for more than one item, and the list is collapsed by default, which is the behaviour that keeps a long
   * queue from pushing the conversation off the screen.
   */
  #queue { flex: none; padding: .5rem .75rem 0; }
  #queue .panel {
    border: 1px solid var(--border); border-bottom: none; border-radius: var(--radius) var(--radius) 0 0;
    background: var(--surface);
  }
  #queue .header {
    display: flex; align-items: center; gap: .4rem; width: 100%; height: 2rem; padding: 0 .6rem;
    font: inherit; font-size: .78rem; color: inherit; text-align: left;
    background: none; border: none; cursor: pointer;
  }
  #queue .header:disabled { cursor: default; }
  #queue .list { list-style: none; margin: 0; padding: 0 0 .2rem; max-height: 10rem; overflow-y: auto; }
  /* The sidebar's own `li` rules are for navigation; a queued message is not a row you click. */
  #queue .row { display: flex; align-items: center; gap: .5rem; padding: .2rem .3rem .2rem .6rem; cursor: default; }
  #queue .row:hover { background: none; }
  #queue .row + .row { border-top: 1px solid var(--line); }
  #queue .preview { flex: 1 1 auto; min-width: 0; font-size: .8rem; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue .row[data-status='sending'] .preview { opacity: .5; }
  #queue .status { flex: none; font-size: .72rem; opacity: .6; }
  #queue .actions { flex: none; display: flex; gap: .1rem; }
  #queue .action {
    display: grid; place-items: center; width: 1.6rem; height: 1.6rem; padding: 0;
    font-size: .78rem; color: inherit; background: none; border: none; border-radius: .3rem;
    opacity: .6; cursor: pointer;
  }
  #queue .action:hover:not(:disabled) { opacity: 1; background: color-mix(in oklab, currentColor 10%, transparent); }
  #queue .action:disabled { opacity: .3; cursor: default; }
  h1 button { font: inherit; padding: 0 .35rem; line-height: 1.2; }
  /**
   * The file pane, by what the server decided to show.
   *
   * Text and source keep their whitespace and their monospace; a document is a document. The line
   * numbers are a non-selectable gutter, so copying the pane copies the source and not the numbers —
   * and the colours are the ones the turn blocks already use, so a reader meets no new palette.
   */
  /**
   * The preview reads smaller than the conversation, on the owner's instruction of 2026-10-11, because a
   * preview is read by the screenful rather than the paragraph: `.78rem` for source, `.88rem` for a
   * rendered document, and a little less sidebar for its list, so more of the file fits on screen.
   */
  #file-body { white-space: pre-wrap; font-family: var(--code-font); font-size: var(--code-size); line-height: var(--code-leading); overflow-wrap: anywhere; }
  #file-body[data-renderer='markdown'] { white-space: normal; font-family: inherit; font-size: .88rem; line-height: 1.5; }
  #file-body .line { display: block; }
  /**
   * The line numbers are a margin note, not part of the code.
   *
   * Measured before: a 3.2em column with .6rem between it and the text — about 50px of the narrowest part of the pane
   * spent on numbers, which is most of why the panel read as heavy. They are narrower, fainter, and there is less
   * air after them, so the code starts closer to the left edge and the eye lands on the code.
   */
  #file-body .ln {
    display: inline-block;
    width: 2.4em;
    margin-right: .55rem;
    text-align: right;
    opacity: .32;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  /**
   * The highlighter's classes, for the **source** renderer.
   *
   * These rules used to name this project's own token classes (`tok-*`), from the hand-written scanner the panel
   * used before it was replaced by the library. The library's names are shared with a fenced block inside a
   * document, so a keyword is coloured the same whether it is in a file or in a document — and the rules for the
   * shared names live with the markdown rules above, on the `.markdown` class both panes carry.
   */
  /**
   * The brand, and the one place in this page that chooses a face rather than inheriting the UI's.
   *
   * A serif, because the name is a word rather than a control and the page's own font is the UI's; a stack rather
   * than a download, because this server answers on loopback and a webfont would either be a new asset to ship or
   * a request to the network. Every family named is one a reader already has: Palatino and Iowan on macOS, Georgia
   * everywhere else.
   */
  #brand { display: flex; align-items: center; gap: .55rem; height: 60px; padding: 0 .75rem; border-bottom: 1px solid var(--line); margin-bottom: .4rem; }
  #brand-mark { width: 24px; height: 24px; display: block; }
  #brand-name { font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 1.06rem; font-weight: 600; letter-spacing: .01em; }
  /**
   * The `…` that opens a row's menu: **no chrome of its own**.
   *
   * Measured, and the owner's report: a `<button>` carries the platform's background and border unless a rule
   * takes them away, so the control read as a raised chip beside rows that are otherwise plain text. It is a
   * quiet affordance — the row is what a person is looking at — so it paints nothing, and only its opacity
   * answers the pointer.
   */
  #tree .pin { display: inline-flex; align-items: center; opacity: .55; }
  #tree .pin svg { width: 11px; height: 11px; }
  /** An archived row is drawn only when asked for, and then quietly: it is not part of the live list. */
  #tree li[data-archived='true'] { opacity: .55; }
  .untwisty { font: inherit; padding: 0 .3rem; opacity: .55; background: none; border: 0; color: inherit; line-height: 1; }
  .untwisty:hover { opacity: 1; }
</style>
</head>
<body>
<aside>
  <!--
    The brand row, above the workspaces — DSH's `logoRow`, and its measurements are why this is shaped the way it
    is: a 60-pixel row with the mark inset 12 pixels from the left, sitting above the nav rather than inside it.
    DSH draws its wordmark as part of the logo; here it is text, in a stack chosen for it, so the name is readable
    and selectable rather than baked into a picture.
  -->
  <header id="brand">
    <img id="brand-mark" src="/favicon.svg" alt="" width="24" height="24">
    <span id="brand-name">Heddle</span>
  </header>
  <h1>Workspaces <button id="add-workspace" type="button" title="register a folder as a workspace root" aria-label="register a folder">+</button></h1>
  <!--
    A search over the names in the tree, which DSH has above its session list and this view had nothing of.
    It filters **rows**: a session that does not match is put away while the query stands, and the branches
    around it stay where they are so the shape of the tree is still readable.
  -->
  <input id="session-search" type="search" placeholder="Search sessions" aria-label="search session names" autocomplete="off">
  <p class="meta" id="search-note" hidden></p>
  <ul id="tree" role="tree" aria-label="workspace folders"></ul>
  <p id="tree-note" class="meta" hidden></p>
  <details id="history">
    <summary>ad hoc</summary>
    <p class="meta" id="adhoc-note" hidden></p>
    <ul id="adhoc" role="tree" aria-label="folders adopted because a session ran in them"></ul>
  </details>
</aside>
<!--
  The divider between the sidebar and the content.

  It is a real separator rather than a styled border: `role="separator"` with `tabindex` makes it keyboard
  operable, and `aria-valuenow` reports the width it sets, so the control is usable without a mouse. The
  width it produces is a CSS custom property, which is what lets one number position the panel and its
  divider without the two drifting apart.
-->
<div id="gutter-left" role="separator" aria-orientation="vertical" aria-label="resize the sidebar" aria-valuemin="12" aria-valuemax="48" aria-valuenow="22" tabindex="0"></div>
<main>
  <nav id="views" aria-label="view">
    <button type="button" data-view="chat" aria-current="true">Chat</button>
    <button type="button" data-view="trajectory">Trajectory</button>
  </nav>
  <div id="log" data-view="chat"></div>
  <!--
    The timeline is a sibling of the ledger, not a child of it.

    Measured: as a child it was deleted by the first `replaceChildren()` the ledger does, so the band was
    cleared and then filled into an element that no longer existed — the ledger rendered and the timeline
    silently did not. A band that scrolls the ledger cannot live inside the thing it scrolls.
  -->
  <div id="timeline" data-view="trajectory" aria-label="timeline" role="navigation" hidden></div>
  <div id="ledger" data-view="trajectory" hidden></div>
  <div id="file" data-view="file" hidden>
    <header id="file-head"></header>
    <!--
      A `div` rather than a `pre`: the pane shows three different things — a document, source with a
      line-number gutter, and text verbatim — and `white-space` is what tells them apart.
    -->
    <div id="file-body" data-renderer="text"></div>
    <!--
      A page is shown in its own frame. `allow-same-origin` lets the frame fetch the document's images and stylesheets
      through this server; every capability that could act is left out, so no script runs and no form submits. The
      frame's own sanitising happens before anything is put inside it.
    -->
    <div id="file-html" hidden><iframe id="html-view" title="the document" sandbox="allow-same-origin"></iframe></div>
  </div>
  <!--
    The queue dock: messages that have been submitted and are waiting for their own turn.

    DSH's `QueueDock`, reduced to what heddle has. DSH's queue is durable and host-owned — the agent runtime
    drains it — while heddle's turns are one HTTP request each, driven by this page, so the queue lives here
    and drains when the running turn's response ends. The **rules** are DSH's rather than invented:

    - an empty queue renders nothing at all, so a person sees no furniture when nothing is waiting;
    - one item renders directly, because a count header for one row is a click that reveals nothing;
    - several items collapse behind a `N queued messages` header, closed by default, so a long queue cannot
      push the conversation off the screen;
    - every row offers the same three actions DSH's does — send now (`steer`), edit, remove.

    The rows are drawn by `renderQueue()`; this element is the dock's slot in the panel, directly above the
    composer, which is where DSH's `conversation.input.dock` sits.
  -->
  <div id="queue" hidden></div>
  <div id="composer">
  <form id="prompt">
    <div id="composer-card">
      <textarea name="prompt" rows="1" placeholder="Message or run a task, / commands, @ files or sessions" autofocus></textarea>
      <!--
        The control row, inside the card and in DSH's order: `+` and the access mode on the left, the model
        seat on the right, then the one action button. The button is Send when nothing runs and Stop while a
        turn does — one action at a time, in one place, which is DSH's own rule.
      -->
      <div id="prompt-tools">
        <button type="button" id="attach" aria-haspopup="menu" aria-expanded="false" aria-label="Add files or run commands" title="Insert a file path">+</button>
        <button type="button" id="access" aria-label="Access mode" title="the sandbox mode this server runs under">Access</button>
        <div id="model-seat">
          <button type="button" id="model-trigger" aria-haspopup="menu" aria-expanded="false" title="the model that answers this session">
            <span id="model-label">model</span>
            <svg class="chevron" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="model-menu" role="menu" aria-label="the model that answers this session" hidden></div>
        </div>
        <button type="button" id="stop" aria-label="Stop generating" title="Stop generating" hidden>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
        <button id="send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8.3125 0.980183C8.66767 1.0531 8.97902 1.20418 9.2627 1.43233C9.48724 1.61297 9.73029 1.85793 9.97949 2.10714L14.707 6.83468L13.293 8.24874L9 3.95577V15.0417H7V3.95577L2.70703 8.24874L1.29297 6.83468L6.02051 2.10714C6.26971 1.85793 6.51277 1.61297 6.7373 1.43233C6.97662 1.23986 7.28445 1.04402 7.6875 0.980183C7.8973 0.947006 8.1031 0.95516 8.3125 0.980183Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </form>
  <div id="composer-status" aria-live="polite"><span data-stat="turns"></span><span data-stat="steps"></span></div>
  <div id="attach-menu" role="menu" aria-label="Insert a file path" hidden></div>
</div>
</main>
<script type="module">
const log = document.getElementById('log')
const ledger = document.getElementById('ledger')
const timeline = document.getElementById('timeline')
const filePane = document.getElementById('file')
const fileHead = document.getElementById('file-head')
const fileBody = document.getElementById('file-body')
/** Where each turn's section is, so picking a segment can take the reader to it. */
const turnAnchors = new Map()

/**
 * Whether the ledger should keep moving to its newest record.
 *
 * The rule DSH states and the reason it exists: the view follows the tail while a session is running, and
 * **stops following when the reader scrolls up**, so arriving records do not move the text being read. A
 * ledger that always jumped to the bottom would be unusable during a long turn, which is exactly when a
 * person wants to read what already happened.
 *
 * It starts true, because opening at the tail is what a reader wants from a view of what just happened.
 */
let followTail = true
/** How close to the bottom still counts as following. A few pixels, because a scrollbar is not exact. */
const FOLLOW_SLACK_PX = 24

ledger.addEventListener('scroll', () => {
  const distance = ledger.scrollHeight - ledger.scrollTop - ledger.clientHeight
  followTail = distance <= FOLLOW_SLACK_PX
})

/**
 * Put the newest record in view, when the reader has not scrolled away from it.
 *
 * Written on the next frame rather than immediately, and that is a fix rather than a flourish: measured, the
 * ledger opened 40px short of its tail because the scroll was written before the legend that sits above the
 * rows had been laid out, so the pane grew underneath the position. Scrolling after layout has settled is
 * what makes "opens at the tail" true rather than nearly true.
 */
function followLedgerTail() {
  if (!followTail || view !== 'trajectory') return
  const place = () => {
    if (followTail && view === 'trajectory') ledger.scrollTop = ledger.scrollHeight
  }
  place()
  requestAnimationFrame(place)
}
/**
 * The bottom group: folders **adopted** because a session ran in them.
 *
 * Not "all sessions": those are already in the tree above, and a second list of the same thing was
 * duplication. What is worth showing apart is ad-hoc work — a folder nobody registered, which exists
 * as a root only because `bootstrap` adopts any folder a session ran in. Registering one (the `+`
 * above, or `heddle workspace add`) promotes it into the tree, sessions and all.
 */
const list = document.getElementById('adhoc')
const adhocNote = document.getElementById('adhoc-note')
let current = null

function add(kind, text, merge = true, label, tool) {
  if (text === '' || text === undefined) return
  const last = log.lastElementChild
  // The merge flag is what the live stream wants: deltas of one answer belong in one block. Passing
  // false is what history wants, where two consecutive entries of the same kind are two turns.
  //
  if (kind === 'assistant' && merge && last && last.tagName === 'DIV' && last.dataset.kind === 'assistant') {
    // Only a plain assistant div is merged into. An earlier version merged on `data-kind` alone, so a
    // reasoning block (a `details` whose data-kind is reasoning) was never the target — but the branch
    // still looked for `[data-body]` on whatever the last child was, and a history render passes
    // merge=false... measured, that path is what threw and left the log holding one turn of nine.
    last.textContent += text
    last.dataset.state = 'running'
    log.scrollTop = log.scrollHeight
    return
  }
  if (kind === 'reasoning' || kind === 'tool') {
    addBlock(kind, text, merge, label, tool)
    return
  }
  const node = document.createElement('div')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  /**
   * Whether this row is still arriving.
   *
   * DSH's assistant row carries a `status` of `running` while deltas are landing and `settled` once the turn
   * ends, and the difference is visible: a running answer shows a caret, a settled one does not. A history
   * render is settled by construction — those events all happened before the page asked for them.
   */
  node.dataset.state = merge ? 'running' : 'settled'
  /**
   * A settled answer is drawn as the document it is — DSH's `AssistantMarkdown`, whose markdown is rendered
   * only once the row is settled (its `finalNode` exists then and not before).
   *
   * History arrives already rendered: the transcript route folds the answer through the server's markdown
   * renderer, so reading a session costs one pass and this page never asks per turn. A **live** answer is
   * plain text until its turn ends, and `renderSettledAnswers()` asks for the one document it needs.
   */
  if (kind === 'assistant' && tool !== undefined && typeof tool.html === 'string') {
    node.classList.add('markdown')
    node.dataset.rendered = 'true'
    node.innerHTML = tool.html
    /**
     * A history row is settled by construction, so it gets its actions here — the same ones the live path
     * attaches; `dataset.copyText` is snapshotted before the button is inside the row.
     */
    node.dataset.copyText = node.innerText
    node.append(messageActions(node))
  } else {
    node.textContent = text
  }
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/**
 * Draw every settled answer that is still plain text.
 *
 * The renderer is the **server's** — `POST /api/markdown`, which is `renderMarkdown` and an allow-list — and
 * that is the repository's rule rather than a shortcut: escaping belongs where the renderer is, and one
 * renderer means the chat and a file preview cannot disagree about what a document is. A row that cannot be
 * rendered keeps its plain text and says so on itself, because an answer that failed to be drawn is still an
 * answer.
 */
/**
 * The actions a settled row offers, which is DSH's `MessageIconActions` reduced to the one this harness has:
 * **copy the answer**.
 *
 * The text is snapshotted onto the row when the row settles rather than read at click time, because the button
 * lives inside the row and a copy that included its own glyph would be copying the wrong thing. What is copied
 * is the answer as it reads — the drawn document's text, not its markdown source — which is what a person
 * pasting it somewhere expects.
 */
function messageActions(row) {
  const bar = document.createElement('div')
  bar.className = 'actions'
  const button = document.createElement('button')
  button.type = 'button'
  button.className = 'action'
  button.textContent = '⧉'
  button.title = 'Copy this answer'
  button.setAttribute('aria-label', 'Copy this answer')
  button.onclick = async () => {
    const text = row.dataset.copyText ?? row.innerText
    try {
      await navigator.clipboard.writeText(text)
      button.dataset.copied = 'true'
      button.textContent = '✓'
      setTimeout(() => {
        delete button.dataset.copied
        button.textContent = '⧉'
      }, 1500)
    } catch (error) {
      /**
       * A clipboard the browser refuses — no permission, or a page not focused — is reported rather than
       * silently doing nothing, because a copy that did not happen is worse than one that says so.
       */
      button.title = `could not copy: ${(error && error.message) || error}`
    }
  }
  bar.append(button)
  return bar
}

async function renderSettledAnswers() {
  for (const row of log.querySelectorAll('.turn.assistant:not([data-rendered])')) {
    const text = row.textContent
    if (text === undefined || text.trim() === '') {
      row.dataset.rendered = 'empty'
      continue
    }
    row.dataset.rendered = 'pending'
    row.dataset.copyText = text
    try {
      const response = await fetch('/api/markdown', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      })
      const body = response.ok ? await response.json() : null
      if (body !== null && typeof body.html === 'string') {
        row.classList.add('markdown')
        row.innerHTML = body.html
        row.dataset.rendered = 'true'
        /** What a copy should yield is the **drawn** answer, so the snapshot is refreshed after drawing. */
        row.dataset.copyText = row.innerText
      } else {
        row.dataset.rendered = 'failed'
      }
    } catch (error) {
      row.dataset.rendered = 'failed'
    }
    if (row.querySelector('.actions') === null) row.append(messageActions(row))
  }
}

/**
 * A turn finished: nothing in the transcript is still arriving. Called from the turn's own `done`.
 *
 * The two vocabularies are DSH's own and they differ, which is why this is not one assignment: an **assistant**
 * row is `running` or `settled` (its `AssistantChatData.status`), while a **tool** row is `running`, `ok` or
 * `error` (its `ToolRow` state). A tool that is still marked running when the turn ends answered nothing, and
 * `ok` is the honest word for it only because the loop records a result for every call it ran.
 */
function settleChat() {
  for (const node of log.querySelectorAll('.turn[data-state="running"]')) {
    node.dataset.state = node.dataset.kind === 'tool' ? 'ok' : 'settled'
  }
}

/**
 * A reasoning or tool block: one line while it is closed, the whole thing when it is opened.
 *
 * A `<details>` rather than a scripted toggle, which is what DSH's client uses too: the disclosure is the
 * browser's, so it works before hydration, keeps its keyboard behaviour, and needs no state. The block is
 * **closed** by default, because reasoning and tool arguments are the two things a reader wants out of the
 * way until asked for, while the answer itself is not.
 */
function addBlock(kind, text, merge, label, tool) {
  const last = log.lastElementChild
  if (merge && last && last.dataset.kind === kind) {
    const body = last.querySelector('[data-body]')
    body.textContent += text
    if (kind === 'reasoning') last.dataset.state = 'running'
    last.querySelector('summary').textContent = oneLiner(kind, body.textContent, label)
    log.scrollTop = log.scrollHeight
    return
  }
  const node = document.createElement('details')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  /**
   * A tool block is one element per **call**, and its result lands inside it.
   *
   * This is what the owner asked for and what DSH does: a call and its answer are one thing a reader can
   * open, not two rows to match up by eye. The call's id is on the element so a live result can find the
   * row it belongs to instead of appending a second one.
   *
   * The **state** is DSH's `ToolRow` state, and it is what the row's dressing answers to: a call that has not
   * come back yet is `running`, a result is `settled`, a refusal or a tool error is `error`.
   */
  if (kind === 'tool') {
    const state = tool && tool.state ? tool.state : 'ok'
    node.dataset.state = state === 'running' ? 'running' : state === 'error' ? 'error' : 'ok'
    if (tool && tool.toolCallId) node.dataset.toolCallId = tool.toolCallId
    if (tool && tool.name) node.dataset.toolName = tool.name
  } else {
    node.dataset.state = merge ? 'running' : 'settled'
  }
  // Named line, not summary: a local called summary shadows the global summary() for the type stripper,
  // which then read the call below as a call on a string. Measured.
  const line = document.createElement('summary')
  line.textContent = oneLiner(kind, text, label)
  const body = document.createElement('div')
  body.setAttribute('data-body', '')
  if (kind === 'tool') {
    const args = document.createElement('pre')
    args.className = 'args'
    args.setAttribute('data-args', '')
    args.textContent = text
    body.append(args)
    if (tool && typeof tool.result === 'string') {
      const answer = document.createElement('pre')
      answer.className = 'result'
      answer.setAttribute('data-result', '')
      answer.textContent = tool.result
      body.append(answer)
    }
  } else {
    body.textContent = text
  }
  node.append(line, body)
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/**
 * Put a tool's result into the element of the call it answers.
 *
 * The live stream delivers the call and its result as two events, which is the transport's shape rather
 * than the reader's. Matching on the call id is what keeps them one element; a result with no call to
 * fill in is shown on its own, because dropping it would lose what the tool said.
 */
function fillToolResult(toolCallId, result, failed) {
  const selector = toolCallId ? '.turn.tool[data-tool-call-id="' + CSS.escape(toolCallId) + '"]' : null
  const open = selector ? log.querySelector(selector) : Array.from(log.querySelectorAll('.turn.tool')).reverse().find((node) => !node.querySelector('[data-result]'))
  if (!open) return false
  let answer = open.querySelector('[data-result]')
  if (!answer) {
    answer = document.createElement('pre')
    answer.className = 'result'
    answer.setAttribute('data-result', '')
    open.querySelector('[data-body]').append(answer)
  }
  answer.textContent += result
  open.dataset.state = failed ? 'error' : 'ok'
  const name = open.dataset.toolName ?? ''
  open.querySelector('summary').textContent = oneLiner('tool', open.querySelector('[data-args]')?.textContent ?? '', name ? '→ ' + name : undefined)
  return true
}

/** The one line a closed block shows: a label and how much there is, which is DSH's title/summary row. */
function oneLiner(kind, text, label) {
  const size = text.length + ' chars'
  if (label) return label + ' · ' + size
  return (kind === 'reasoning' ? 'reasoning' : kind) + ' · ' + size
}

/**
 * Which view is showing.
 *
 * Both views read the **same** route with a different `view` parameter, so they cannot disagree about a
 * session: they are two projections of one read, not two fetches that can drift.
 */
let view = 'chat'

/**
 * Which tabs the ring offers, decided by **what is selected**.
 *
 * The owner's rules of 2026-10-11, and each is a statement about one kind of row:
 *
 * - a **session** row shows `Chat` and `Trajectory` — the two projections of that conversation;
 * - a **file** row shows only its own preview, so the ring holds one tab and none of the session's views
 *   is offered, because none of them has anything to say about a file;
 * - anything else — a folder, or nothing at all — changes **nothing**, so the ring is left as it was. A
 *   folder click is navigation, and navigation does not retarget the panel.
 */
function renderRing(selection) {
  const ring = document.getElementById('views')
  for (const button of ring.querySelectorAll('button[data-view="file"]')) button.remove()
  if (selection === 'file') {
    const button = document.createElement('button')
    button.type = 'button'
    button.dataset.view = 'file'
    button.textContent = 'File'
    ring.prepend(button)
  }
  const offered = selection === 'file' ? ['file'] : ['chat', 'trajectory']
  for (const button of ring.querySelectorAll('button')) button.hidden = !offered.includes(button.dataset.view)
  for (const button of ring.querySelectorAll('button')) {
    if (button.dataset.view === view) button.setAttribute('aria-current', 'true')
    else button.removeAttribute('aria-current')
  }
}

/** Switch views without refetching the session list, and fill the one being shown. */
async function showView(next) {
  view = next
  for (const button of document.querySelectorAll('#views button')) {
    if (button.dataset.view === view) button.setAttribute('aria-current', 'true')
    else button.removeAttribute('aria-current')
  }
  log.hidden = view !== 'chat'
  ledger.hidden = view !== 'trajectory'
  timeline.hidden = view !== 'trajectory'
  filePane.hidden = view !== 'file'
  if (view === 'trajectory' && current !== null) {
    followTail = true
    await showLedger(current)
    followLedgerTail()
  }
}

/** Read the ledger projection for one session and draw it. */
let ledgerFetches = 0
async function showLedger(id) {
  ledger.replaceChildren()
  /**
   * Only the newest request draws. Without this, two overlapping reads can land out of order and the older
   * one paints last, which is the other half of the stacked-draw bug.
   */
  const ticket = ++ledgerFetches
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '?view=ledger')
    if (!response.ok) return
    const body = await response.json()
    if (ticket !== ledgerFetches) return
      renderLedger(body.ledger ?? { turns: [], loose: [], tokens: {}, records: 0, inFlight: 0 }, body.timeline ?? { spans: [], durationMs: 0 })
  } catch (error) {
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read the ledger: ' + (error && error.message)
    ledger.append(note)
  }
}

/** Milliseconds as something a person reads: 12ms, 1.4s, 2m 3s. */
function human(ms) {
  if (ms === undefined) return null
  if (ms < 1000) return ms + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's'
  return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's'
}

/**
 * One line of a record's own text, for the row.
 *
 * The row used to show the record's **label** — which is its kind, or a tool's name — so every assistant row
 * read `assistant` and told a reader nothing about what was said. The label names the kind and the snippet
 * carries the content; a reader scanning a ledger wants both, and the second is the reason they are looking.
 *
 * Newlines and runs of spaces are collapsed, because a summary is one line by construction and a tool's
 * arguments are usually JSON with both.
 */
function snippet(text, limit = 110) {
  const flat = String(text ?? '').replace(/\s+/g, ' ').trim()
  if (flat.length === 0) return ''
  return flat.length > limit ? flat.slice(0, limit) + '…' : flat
}

/** The wall clock a record started at, to the second. */
function clock(at) {
  if (at === undefined) return null
  const date = new Date(at)
  return Number.isNaN(date.getTime()) ? null : date.toISOString().slice(11, 19)
}

/**
 * One record, as a disclosure.
 *
 * The summary is the identity — kind, label, when, how long, what it cost — and the body is the full input
 * or output. Closed by default for the same reason the chat view collapses reason and tool records: the
 * ledger's shape is what a reader scans, and the detail is what they open.
 */
function recordNode(record) {
  const node = document.createElement('details')
  node.className = 'record'
  node.dataset.kind = record.kind
  if (record.inFlight === true) node.dataset.inflight = 'true'
  const line = document.createElement('summary')
  /**
   * The badge carries the kind, and for a call it carries the tool's name too — that is the one thing a
   * reader scans for when asking "which of these was the shell".
   */
  const kind = document.createElement('span')
  kind.className = 'kind'
  kind.textContent = record.kind === 'tool' && record.label.startsWith('→ ') ? 'tool ' + record.label.slice(2) : record.kind
  const label = document.createElement('span')
  label.className = 'label clip'
  label.textContent = snippet(record.text) || record.label
  const when = document.createElement('span')
  when.className = 'when'
  const started = clock(record.startedAt)
  const lasted = human(record.durationMs)
  const ttft = human(record.ttftMs)
  /**
   * An in-flight record shows its start and no duration. Printing a duration for something still running
   * would be invented time, and it is the kind a reader believes.
   */
  when.textContent = [started, lasted === null ? (record.inFlight === true ? 'started' : null) : lasted, ttft === null ? null : 'ttft ' + ttft]
    .filter(Boolean)
    .join(' · ')
  line.append(kind, label, when)
  if (record.usage !== undefined) {
    const usage = document.createElement('span')
    usage.className = 'usage' + (record.usageSource === 'provider' ? ' provider' : '')
    /**
     * Each count is printed only when it is present, and the source is named, because the harness's estimate
     * and a provider's report are different claims. An absent count prints nothing rather than a zero.
     */
    const parts = []
    if (record.usage.inputTokens !== undefined) parts.push('in ' + record.usage.inputTokens)
    if (record.usage.outputTokens !== undefined) parts.push('out ' + record.usage.outputTokens)
    usage.textContent = parts.join(' ') + (record.usageSource === 'provider' ? ' (reported)' : ' (estimated)')
    line.append(usage)
  }
  node.append(line)
  const body = document.createElement('pre')
  body.textContent = record.text.length > 0 ? record.text : '(no text recorded)'
  node.append(body)
  if (record.note !== undefined) {
    const note = document.createElement('div')
    note.className = 'when'
    note.textContent = record.note
    node.append(note)
  }
  return node
}

/** Draw the whole ledger: a totals line, then each turn with its steps. */
/**
 * The timeline band: one button per span, positioned along the session's recorded span.
 *
 * Each button carries its turn number as its text for a screen reader and as a tooltip for a mouse, and
 * picking it scrolls the ledger to that turn. A span whose turn is still running is striped rather than
 * given a width it cannot justify — the same rule the rows follow.
 */
function renderTimeline(timeline_) {
  timeline.replaceChildren()
  const spans = timeline_?.spans ?? []
  if (spans.length === 0) return
  for (const span of spans) {
    const button = document.createElement('button')
    button.type = 'button'
    button.style.left = (span.start * 100).toFixed(3) + '%'
    button.style.width = Math.max((span.end - span.start) * 100, 0.4).toFixed(3) + '%'
    button.dataset.turn = String(span.turn)
    button.dataset.leading = span.kinds[0] ?? 'system'
    if (span.running) button.dataset.running = 'true'
    button.title = 'turn ' + span.turn + ' · ' + span.records + ' record(s)' + (span.running ? ' · running' : '')
    button.setAttribute('aria-label', button.title)
    button.addEventListener('click', () => {
      const anchor = turnAnchors.get(span.turn)
      if (anchor === undefined) return
      for (const other of timeline.querySelectorAll('button')) other.removeAttribute('aria-current')
      button.setAttribute('aria-current', 'true')
      anchor.scrollIntoView({ block: 'start', behavior: 'smooth' })
    })
    timeline.append(button)
  }
  const legend = document.createElement('div')
  legend.id = 'timeline-legend'
  const total = timeline_?.durationMs ?? 0
  legend.textContent = [human(total) + ' recorded', spans.length + ' turn(s)'].filter(Boolean).join(' · ')
  timeline.after(legend)
}

function renderLedger(data, timeline_ = { spans: [], durationMs: 0 }) {
  /**
   * The pane is cleared here, not only in the caller.
   *
   * Measured in a browser: switching view and finishing a live turn at the same moment produced two ledgers
   * stacked in one pane. Both were real renders — the two calls raced — and clearing at the point of drawing
   * is what makes a render idempotent regardless of who called it.
   */
  ledger.replaceChildren()
  turnAnchors.clear()
  for (const stale of document.querySelectorAll('#timeline-legend')) stale.remove()
  renderTimeline(timeline_)
  const summary = document.createElement('div')
  summary.className = 'summary'
  const bits = [data.records + ' record(s)']
  if (data.turns.length > 0) bits.push(data.turns.length + ' turn(s)')
  if (data.inFlight > 0) bits.push(data.inFlight + ' running')
  const tokens = data.tokens ?? {}
  if (tokens.input !== undefined) bits.push('in ' + tokens.input + ' tokens (reported)')
  if (tokens.output !== undefined) bits.push('out ' + tokens.output + ' tokens (reported)')
  if (tokens.estimated !== undefined) bits.push(tokens.estimated + ' tokens estimated')
  summary.textContent = bits.join(' · ')
  ledger.append(summary)

  for (const turn of data.turns) {
    const box = document.createElement('section')
    box.className = 'turn'
    const header = document.createElement('header')
    const when = clock(turn.startedAt)
    header.textContent = ['turn ' + turn.index, when, human(turn.durationMs)].filter(Boolean).join(' · ')
    box.append(header)
    for (const step of turn.steps) {
      const stepBox = document.createElement('div')
      stepBox.className = 'step'
      const stepHeader = document.createElement('div')
      stepHeader.className = 'step > header'
      const bits2 = ['step ' + step.index, step.model, clock(step.startedAt), human(step.durationMs)].filter(Boolean)
      stepHeader.textContent = bits2.join(' · ')
      stepBox.append(stepHeader)
      for (const record of step.records) stepBox.append(recordNode(record))
      box.append(stepBox)
    }
    turnAnchors.set(turn.index, box)
    ledger.append(box)
  }

  /**
   * Records that belong to no turn are shown rather than hidden. A ledger that quietly drops what it does not
   * recognise cannot be trusted to be complete.
   */
  if (data.loose !== undefined && data.loose.length > 0) {
    const box = document.createElement('section')
    box.className = 'turn loose'
    const header = document.createElement('header')
    header.textContent = 'before any turn'
    box.append(header)
    for (const record of data.loose) box.append(recordNode(record))
    ledger.append(box)
  }
}

async function showSession(id) {
  current = id
  /** The composer follows the conversation: its own queue, and the model that session is run with. */
  adoptSession(id)
  await refreshSessions()
  syncSelectionToSession()
  if (view === 'trajectory') await showLedger(id)
  /**
   * The log is cleared and refilled from the session's own history.
   *
   * This is the half that was missing: selecting a session used to leave the right side empty, because
   * the only thing that ever wrote to it was the live stream and those events had already happened.
   */
  log.replaceChildren()
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id))
    if (!response.ok) return
    const body = await response.json()
    /**
     * The session's own model choice, when it has one. A session that has never recorded one leaves the
     * seat where it is, which is what lets a person pick a backend **before** the turn that creates the
     * session: the choice travels with the request and the server records it on the session it made.
     */
    applySessionModel(body.endpoint ?? null, body.model ?? null)
    /**
     * Each turn renders inside its own guard.
     *
     * A history that stops at the first turn it cannot draw is worse than one that skips it: measured, one
     * bad turn left the log holding a single message out of nine, and nothing said why. A skipped turn is
     * recorded in the DOM as a visible note so the failure is not silent.
     */
    for (const turn of body.turns ?? []) {
      try {
        add(turn.kind, turn.text, false, turn.label, turn)
      } catch (error) {
        const note = document.createElement('div')
        note.className = 'turn denied'
        note.textContent = 'could not render a ' + turn.kind + ' turn: ' + (error && error.message)
        log.append(note)
      }
    }
  } catch (error) {
    // A history that cannot be read must not empty the live view as well; the stream keeps appending.
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read this session: ' + (error && error.message)
    log.append(note)
  }
}

async function refreshSessions() {
  const response = await fetch('/api/sessions')
  if (!response.ok) return
  const sessions = await response.json()
  /**
   * The newest session is selected when nothing is yet.
   *
   * Without this the page starts attached to nothing: the tree appears, the log stays empty even though
   * sessions exist, and a prompt sent from that state creates a NEW session instead of continuing the one
   * a person is looking at. Measured: asking a question produced a two-message live view while the session
   * beside it held the whole transcript, because `current` was null and the click that followed selected
   * the session the prompt had just created rather than the one holding history.
   *
   * The list itself is drawn from the tree — this walk only needs to know which session is newest, and it
   * deliberately asks for **every** session rather than only the ad-hoc ones: a page that started with no
   * selection because all its sessions happened to be registered would be the same bug again.
   */
  if (current !== null) return
  const select = sessions[0]?.id ?? null
  if (select !== null) {
    current = select
    await showSession(select)
  }
}

const events = new EventSource('/api/events')
events.addEventListener('session', (message) => {
  const payload = JSON.parse(message.data)
  const event = payload.event
  /**
   * Whether a turn is running, read before the session filter below and for **every** session.
   *
