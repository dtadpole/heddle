  for (const row of log.querySelectorAll('.turn.assistant:not([data-rendered])')) {
    const text = row.textContent
    if (text === undefined || text.trim() === '') {
      row.dataset.rendered = 'empty'
      continue
    }
    row.dataset.rendered = 'pending'
    row.dataset.copyText = text
    try {
      const response = await fetch('/api/markdown', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      })
      const body = response.ok ? await response.json() : null
      if (body !== null && typeof body.html === 'string') {
        row.classList.add('markdown')
        row.innerHTML = body.html
        row.dataset.rendered = 'true'
        /** What a copy should yield is the **drawn** answer, so the snapshot is refreshed after drawing. */
        row.dataset.copyText = row.innerText
      } else {
        row.dataset.rendered = 'failed'
      }
    } catch (error) {
      row.dataset.rendered = 'failed'
    }
    if (row.querySelector('.actions') === null) row.append(messageActions(row))
  }
}

/**
 * A turn finished: nothing in the transcript is still arriving. Called from the turn's own `done`.
 *
 * The two vocabularies are DSH's own and they differ, which is why this is not one assignment: an **assistant**
 * row is `running` or `settled` (its `AssistantChatData.status`), while a **tool** row is `running`, `ok` or
 * `error` (its `ToolRow` state). A tool that is still marked running when the turn ends answered nothing, and
 * `ok` is the honest word for it only because the loop records a result for every call it ran.
 */
function settleChat() {
  for (const node of log.querySelectorAll('.turn[data-state="running"]')) {
    node.dataset.state = node.dataset.kind === 'tool' ? 'ok' : 'settled'
  }
}

/**
 * A reasoning or tool block: one line while it is closed, the whole thing when it is opened.
 *
 * A `<details>` rather than a scripted toggle, which is what DSH's client uses too: the disclosure is the
 * browser's, so it works before hydration, keeps its keyboard behaviour, and needs no state. The block is
 * **closed** by default, because reasoning and tool arguments are the two things a reader wants out of the
 * way until asked for, while the answer itself is not.
 */
/**
 * What a process row says, in DSH's grammar.
 *
 * DSH's tool row is a **phrase**, not a bare name (`Ran commands`, `Ran commands and updated the plan`), with
 * the detail behind it. The tool's own name is kept as the row's one-line hint after a 2px dot separator —
 * the same separator DSH puts between a title and its summary (`lcKema_separator`) — because this is a
 * transcript of the harness's own calls, and the person reading is the one who configured those tools.
 */
/**
 * What a tool call was aimed at: the arguments' most telling string.
 *
 * DSH's per-call row reads `<tool> · <what it acted on>` — measured in its session view: `Bash · See what other
 * sessions have committed`, `Read · ~/.dsh/AGENTS.md`. So the title is the tool's own name and the hint is the
 * command, the path, the pattern — whichever the arguments carry first.
 */
function toolHint(argsText) {
  try {
    const args = JSON.parse(argsText || '{}')
    for (const key of ['command', 'cmd', 'path', 'file_path', 'file', 'pattern', 'query', 'url']) {
      if (typeof args[key] === 'string' && args[key].length > 0) return args[key]
    }
    const first = Object.values(args ?? {}).find((value) => typeof value === 'string' && value.length > 0)
    if (typeof first === 'string') return first
  } catch {
    // Not JSON: the arguments are their own summary.
  }
  return firstLine(argsText)
}

/** The first line of a body, stripped of the markdown emphasis DSH's reasoning summary strips too. */
function firstLine(text) {
  const line = String(text || '').replace(/\r/g, '').split('\n').map((entry) => entry.trim()).find((entry) => entry.length > 0) ?? ''
  const clean = line.replace(/\*\*/g, '').replace(/`/g, '').replace(/^[#>*\-\s]+/, '')
  return clean.length > 80 ? clean.slice(0, 79) + '…' : clean
}

/**
 * The leading glyph: the kind at rest, a chevron once the row is hovered, focused or open.
 *
 * DSH does exactly this swap by opacity in one box (`O_Ebla_activityIcon` → `O_Ebla_chevron`), so the row
 * never changes width and the affordance appears only when a person is looking at it.
 */
function glyph(kind) {
  const box = document.createElement('span')
  box.className = 'glyph'
  box.setAttribute('aria-hidden', 'true')
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('width', '14'); svg.setAttribute('height', '14'); svg.setAttribute('viewBox', '0 0 16 16')
  svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', '1')
  svg.setAttribute('stroke-linejoin', 'round'); svg.setAttribute('stroke-linecap', 'round')
  const path = (d) => { const node = document.createElementNS('http://www.w3.org/2000/svg', 'path'); node.setAttribute('d', d); return node }
  const kindIcon = svg.cloneNode(false)
  kindIcon.setAttribute('class', 'kind')
  // A shell prompt for a tool (DSH's own two paths), a sparkle for a thought.
  if (kind === 'tool') { kindIcon.append(path('M3 4L7 8L3 12'), path('M9 12H13')) }
  else { kindIcon.append(path('M8 2.5 9.3 6.7 13.5 8 9.3 9.3 8 13.5 6.7 9.3 2.5 8 6.7 6.7Z')) }
  const chevron = svg.cloneNode(false)
  chevron.setAttribute('class', 'chevron')
  chevron.append(path('M4 6.5 8 10.5 12 6.5'))
  box.append(kindIcon, chevron)
  return box
}

/** One row line: glyph, title, and the one-line hint a reader sees while it is closed. */
function summaryLine(kind, text, tool, label) {
  const line = document.createElement('summary')
  line.append(glyph(kind))
  const name = tool && tool.name ? tool.name : label ? label.replace(/^→\s*/, '') : ''
  const title = document.createElement('span')
  title.className = 'title'
  title.textContent = kind === 'reasoning' ? 'Think' : name || 'tool'
  line.append(title)
  const hintText = kind === 'reasoning' ? firstLine(text) : toolHint(text)
  if (hintText) {
    const sep = document.createElement('span')
    sep.className = 'sep'
    sep.setAttribute('aria-hidden', 'true')
    const hint = document.createElement('span')
    hint.className = 'hint'
    hint.textContent = hintText
    line.append(sep, hint)
  }
  return line
}

function addBlock(kind, text, merge, label, tool) {
  const last = log.lastElementChild
  if (merge && last && last.dataset.kind === kind) {
    const body = last.querySelector('[data-body]')
    body.textContent += text
    if (kind === 'reasoning') last.dataset.state = 'running'
    const hint = last.querySelector('summary .hint')
    if (hint) hint.textContent = firstLine(body.textContent)
    log.scrollTop = log.scrollHeight
    return
  }
  const node = document.createElement('details')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  /**
   * A tool block is one element per **call**, and its result lands inside it.
   *
   * This is what the owner asked for and what DSH does: a call and its answer are one thing a reader can
   * open, not two rows to match up by eye. The call's id is on the element so a live result can find the
   * row it belongs to instead of appending a second one.
   *
   * The **state** is DSH's `ToolRow` state, and it is what the row's dressing answers to: a call that has not
   * come back yet is `running`, a result is `settled`, a refusal or a tool error is `error`.
   */
  if (kind === 'tool') {
    const state = tool && tool.state ? tool.state : 'ok'
    node.dataset.state = state === 'running' ? 'running' : state === 'error' ? 'error' : 'ok'
    if (tool && tool.toolCallId) node.dataset.toolCallId = tool.toolCallId
    if (tool && tool.name) node.dataset.toolName = tool.name
  } else {
    node.dataset.state = merge ? 'running' : 'settled'
  }
  // Named line, not summary: a local called summary shadows the global summary() for the type stripper,
  // which then read the call below as a call on a string. Measured.
  const line = summaryLine(kind, text, tool, label)
  const body = document.createElement('div')
  body.setAttribute('data-body', '')
  if (kind === 'tool') {
    const args = document.createElement('pre')
    args.className = 'args'
    args.setAttribute('data-args', '')
    args.textContent = text
    body.append(args)
    if (tool && typeof tool.result === 'string') {
      const answer = document.createElement('pre')
      answer.className = 'result'
      answer.setAttribute('data-result', '')
      answer.textContent = tool.result
      body.append(answer)
    }
  } else {
    body.textContent = text
  }
  node.append(line, body)
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/**
 * Put a tool's result into the element of the call it answers.
 *
 * The live stream delivers the call and its result as two events, which is the transport's shape rather
 * than the reader's. Matching on the call id is what keeps them one element; a result with no call to
 * fill in is shown on its own, because dropping it would lose what the tool said.
 */
function fillToolResult(toolCallId, result, failed) {
  const selector = toolCallId ? '.turn.tool[data-tool-call-id="' + CSS.escape(toolCallId) + '"]' : null
  const open = selector ? log.querySelector(selector) : Array.from(log.querySelectorAll('.turn.tool')).reverse().find((node) => !node.querySelector('[data-result]'))
  if (!open) return false
  let answer = open.querySelector('[data-result]')
  if (!answer) {
    answer = document.createElement('pre')
    answer.className = 'result'
    answer.setAttribute('data-result', '')
    open.querySelector('[data-body]').append(answer)
  }
  answer.textContent += result
  open.dataset.state = failed ? 'error' : 'ok'
  return true
}



/**
 * Which view is showing.
 *
 * Both views read the **same** route with a different `view` parameter, so they cannot disagree about a
 * session: they are two projections of one read, not two fetches that can drift.
 */
let view = 'chat'

/**
 * Which tabs the ring offers, decided by **what is selected**.
 *
 * The owner's rules of 2026-10-11, and each is a statement about one kind of row:
 *
 * - a **session** row shows `Chat` and `Trajectory` — the two projections of that conversation;
 * - a **file** row shows only its own preview, so the ring holds one tab and none of the session's views
 *   is offered, because none of them has anything to say about a file;
 * - anything else — a folder, or nothing at all — changes **nothing**, so the ring is left as it was. A
 *   folder click is navigation, and navigation does not retarget the panel.
 */
function renderRing(selection) {
  const ring = document.getElementById('views')
  for (const button of ring.querySelectorAll('button[data-view="file"]')) button.remove()
  if (selection === 'file') {
    const button = document.createElement('button')
    button.type = 'button'
    button.setAttribute('role', 'tab')
    button.id = 'tab-file'
    button.dataset.view = 'file'
    button.setAttribute('aria-selected', 'false')
    button.setAttribute('aria-controls', 'file')
    button.textContent = 'File'
    ring.prepend(button)
  }
  const offered = selection === 'file' ? ['file'] : ['chat', 'trajectory']
  for (const button of ring.querySelectorAll('button')) button.hidden = !offered.includes(button.dataset.view)
  for (const button of ring.querySelectorAll('button')) {
    button.setAttribute('aria-selected', String(button.dataset.view === view))
    /** One tab in the Tab order, the rest reachable by the arrow keys — the pattern `role=tab` describes. */
    button.tabIndex = button.dataset.view === view ? 0 : -1
  }
}

/** Switch views without refetching the session list, and fill the one being shown. */
/**
 * The conversation minimap — the reference's measured behaviour, ported.
 *
 * The numbers are from that UI, read with the browser while it ran: one 12px row per message, a 12px bar whose
 * **thickness encodes the message's size** (its reference bars measured 1.7px for a short prompt and 3.5–5.5px for
 * answers, inside a 12px row), resting opacities of `.33` for the person and `.267` for the answer, the visible
 * window brightened with feathered edges (measured 0.59 / 0.63 / 1.0 / 1.0 / 0.44 across a scrollport edge), and on
 * hover a **neighbourhood swell**: the hovered row reaches opacity 1 and `scaleX` 2.1 / `scaleY` 1.5 with a falloff
 * over ±4 rows (measured 0.45 / 0.55 / 0.72 / 0.84 / 1.0 / 0.84 / 0.72 / 0.58), plus a 300×81 `#242424` preview
 * card at radius 8 to the left of the rail. The rail itself is 30px wide, 4px from the edge, vertically centred.
 *
 * It is derived from the DOM the chat already has — the `.turn` children of `#log` — so no server support is needed:
 * the bars are a second reading of the transcript, not another copy of it.
 */
const minimap = document.getElementById('minimap')
const minimapRows = document.getElementById('minimap-rows')
const minimapHit = document.getElementById('minimap-hit')
const minimapPreview = document.getElementById('minimap-preview')
const MM_ROW_HEIGHT = 12
/** The resting opacity per role, from the reference. Rows the reference does not have get a quieter value. */
const MM_REST = { user: 0.33, assistant: 0.267, tool: 0.2, reasoning: 0.2 }
const MM_HOVER_SPAN = 4
/**
 * The reference's ramp, measured per row on the reference (2026-10-17): the hovered bar is `scaleX` **2.1** and its
 * neighbours are **1.88 / 1.66 / 1.44 / 1.22**, i.e. a **linear** five-row ramp (swell 1.0 / 0.8 / 0.6 / 0.4 / 0.2)
 * with the sixth row back at 1. Heddle used a floored, non-linear falloff (0.42 + …) that stayed at **1.53** in the
 * fourth row — a wider, softer band than the reference's. Scale opacity uses the same swell, not a second ramp.
 */
const MM_HOVER_RAMP = (distance) => Math.max(0, (MM_HOVER_SPAN + 1 - distance) / (MM_HOVER_SPAN + 1))

let mmEntries = []
let mmHover = -1
let mmKeyboardIndex = -1
let mmFrame = null
let mmBuildTimer = null

function mmReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches
}

function mmRoleOf(turn) {
  const kind = turn.dataset.kind
  return kind === 'user' || kind === 'assistant' || kind === 'tool' || kind === 'reasoning' ? kind : 'assistant'
}

/** The first meaningful text of a turn, which is what the preview card shows. */
function mmTextOf(turn) {
  const body = turn.querySelector('[data-body]') ?? turn
  return (body.textContent || '').replace(/\s+/g, ' ').trim()
}

function mmIndexAt(clientY) {
  const box = minimapRows.getBoundingClientRect()
  const rowHeight = (box.height - 8) / Math.max(1, mmEntries.length)
  const index = Math.floor((clientY - box.top - 4) / rowHeight)
  return Math.max(0, Math.min(mmEntries.length - 1, index))
}

function hideMinimapPreview() {
  minimapPreview.hidden = true
  minimapPreview.dataset.visible = 'false'
}

function showMinimapPreview(index) {
  const entry = mmEntries[index]
  if (entry === undefined) return hideMinimapPreview()
  /**
   * The card is the message's own text, as the reference's is: measured on the reference, its preview showed only
   * "explain CER again" at 300×81 — no role heading. The rail already says who spoke through the bar's ink.
   */
  const body = document.createElement('span')
  body.textContent = entry.text.slice(0, 220) || '(empty)'
  minimapPreview.replaceChildren(body)
  const rowBox = entry.row.getBoundingClientRect()
  const navBox = minimap.getBoundingClientRect()
  const top = rowBox.top - navBox.top
  minimapPreview.style.top = Math.max(0, Math.min(top, navBox.height - 24)) + 'px'
  minimapPreview.hidden = false
  minimapPreview.dataset.visible = 'true'
}

/** Paint every bar: the resting ink, the scroll window's light, and the hover neighbourhood's swell. */
function paintMinimap() {
  const height = mmEntries.length > 0 ? Math.min(log.clientHeight - 32, mmEntries.length * MM_ROW_HEIGHT + 8) : 0
  if (height > 0) {
    minimap.style.height = `${height}px`
    minimapRows.style.height = `${height}px`
  }
  const rowHeight = mmEntries.length > 0 ? Math.max(4, (height - 8) / mmEntries.length) : MM_ROW_HEIGHT
  mmEntries.forEach((entry, index) => {
    const scale = rowHeight / MM_ROW_HEIGHT
    entry.row.style.height = `${rowHeight}px`
    entry.bar.style.height = `${(entry.barThickness * scale).toFixed(2)}px`
    const light = Math.max(0, Math.min(1, entry.light ?? 0))
    let opacity = entry.rest + (1 - entry.rest) * light
    /**
     * No hover means **no fat bars at all**. The sentinel used to be `MM_HOVER_SPAN + 1`, which made the "no hover"
     * case indistinguishable from a hover at row 5 — so a fresh page painted a permanent fat band around the middle
     * of the rail that never moved with the scroll. The owner saw exactly that. The reference only scales the row
     * under the pointer (measured: reload its page, scroll 0/25/50/75/100% with no pointer on the rail and every
     * bar's `scaleX` stays 1), so this is the parity fix, not a style choice.
     */
    let swell = 0
    if (mmHover >= 0) {
      const distance = Math.abs(index - mmHover)
      if (distance <= MM_HOVER_SPAN) swell = MM_HOVER_RAMP(distance)
    }
    opacity = Math.max(opacity, swell)
    entry.bar.style.opacity = opacity.toFixed(3)
    entry.bar.style.transform = swell > 0 ? `scaleX(${(1 + 1.1 * swell).toFixed(3)}) scaleY(${(1 + 0.5 * swell).toFixed(3)})` : ''
  })
}

/** Which turns are on screen, feathered over their neighbours — the reference's bright window. */
function refreshMinimapLight() {
  if (mmEntries.length === 0) return
  const logBox = log.getBoundingClientRect()
  const viewport = Math.max(1, logBox.height)
  const shares = mmEntries.map((entry) => {
    const box = entry.el.getBoundingClientRect()
    const visible = Math.max(0, Math.min(box.bottom, logBox.bottom) - Math.max(box.top, logBox.top))
    return Math.min(1, visible / Math.max(1, Math.min(box.height, viewport)))
  })
  mmEntries.forEach((entry, index) => {
    let best = 0
    for (let offset = -2; offset <= 2; offset += 1) {
      const share = shares[index + offset] ?? 0
      best = Math.max(best, share * (1 - Math.abs(offset) / 3))
    }
    entry.light = best
  })
  paintMinimap()
}

/** Read the transcript again: rows, thickness, text and the rail's height. */
/**
 * The reference's rail is **section level**, measured on the reference: its 27-row conversation held 5 user and 5
 * assistant messages with **no rows for tool or reasoning segments**, so its unit is the person's message and the
 * answer — never a tool call. Heddle built one row per `.turn`, which gave four rows for an exchange that used a
 * tool (user, reasoning, tool, assistant) and read as a tool-grained structure. The sections are therefore the
 * user and assistant turns only; the reasoning and tool rows stay in the transcript where they belong.
 */
function syncMinimap() {
  const turns = [...log.querySelectorAll(':scope > .turn')].filter((turn) => {
    const kind = turn.dataset.kind
    return kind === 'user' || kind === 'assistant'
  })
  const wanted = view === 'chat' && turns.length >= 3
  minimap.hidden = !wanted
  if (!wanted) {
    mmEntries = []
    mmHover = -1
    mmKeyboardIndex = -1
    minimap.dataset.visible = 'false'
    hideMinimapPreview()
    return
  }
  const heights = turns.map((turn) => Math.max(1, turn.getBoundingClientRect().height))
  const tallest = Math.max(1, ...heights)
  const sameTurns = mmEntries.length === turns.length && mmEntries.every((entry, index) => entry.el === turns[index])
  if (!sameTurns) {
    const rows = turns.map((turn) => {
      const row = document.createElement('div')
      row.className = 'mm-row'
      const bar = document.createElement('span')
      bar.className = 'mm-bar'
      bar.dataset.role = mmRoleOf(turn)
      row.append(bar)
      return row
    })
    minimapRows.replaceChildren(...rows)
    mmEntries = turns.map((el, index) => ({ el, row: rows[index], bar: rows[index].firstElementChild }))
    mmHover = -1
    mmKeyboardIndex = -1
  }
  mmEntries.forEach((entry, index) => {
    entry.role = mmRoleOf(entry.el)
    entry.bar.dataset.role = entry.role
    /** The reference's thickness rule: a short prompt is ~1.7px, a long answer up to ~6px, inside a 12px row. */
    entry.barThickness = Math.max(1.6, Math.min(6, 1.6 + 4.4 * (heights[index] / tallest)))
    entry.rest = MM_REST[entry.role] ?? 0.22
    entry.text = mmTextOf(entry.el)
  })
  minimapHit.setAttribute('aria-label', `Conversation minimap, ${mmEntries.length} messages. Use arrow keys to preview nearby messages, Enter to jump.`)
  minimap.dataset.visible = 'true'
  if (mmHover < 0) hideMinimapPreview()
  refreshMinimapLight()
}

function scheduleMinimap() {
  if (mmBuildTimer !== null) return
  mmBuildTimer = setTimeout(() => {
    mmBuildTimer = null
    syncMinimap()
  }, 120)
}

/** Jump the transcript so a turn sits at the top of the log, smoothly unless motion is reduced. */
function jumpToMinimap(index) {
  const entry = mmEntries[index]
  if (entry === undefined) return
  const top = entry.el.getBoundingClientRect().top - log.getBoundingClientRect().top + log.scrollTop - 8
  log.scrollTo({ top: Math.max(0, top), behavior: mmReducedMotion() ? 'auto' : 'smooth' })
}

/**
 * Scrubbing, as the reference does it: moving the pointer over the rail **scrolls the transcript**, continuously.
 *
 * Measured on the reference, and this is the part that a per-row guess gets wrong: it is not snapped to message
 * positions. Two points **inside one 12px row** (y 506 / 510 / 515) gave 3443 / 3552 / 3689 — about 27.3 scroll
 * pixels per rail pixel — and `maxScroll / railHeight` is 9072 / 332 = 27.3, so the mapping is
 * `scrollTop = ((y − railTop) / railHeight) × maxScroll`. It is applied on **pointermove only** (a `pointerover`
 * with no move left the scroller untouched), the value is final in the same tick (no easing), and it stays where
 * the pointer left it. The preview and the bar swell remain per row; only the scroll is continuous.
 */
function scrubMinimap(clientY) {
  const box = minimapRows.getBoundingClientRect()
  if (box.height <= 0) return
  const max = log.scrollHeight - log.clientHeight
  if (max <= 0) return
  const fraction = (clientY - box.top) / box.height
  log.scrollTop = Math.max(0, Math.min(max, fraction * max))
}

/**
 * The reference expands on **movement**, not on presence: measured on the reference, a `pointerover` + `pointerenter`
 * with no `pointermove` leaves every bar at scale 1, and the swell appears with the first move. Heddle painted on
 * entry for a while; that was a deviation, so the pointermove handler below is the single trigger.
 */
minimapHit.addEventListener('pointermove', (event) => {
  const index = mmIndexAt(event.clientY)
  if (index !== mmHover) {
    mmHover = index
    mmKeyboardIndex = index
    showMinimapPreview(index)
    paintMinimap()
  }
  /** Every move, not only row changes: the reference's scroll mapping is continuous in the pointer's Y. */
  scrubMinimap(event.clientY)
})
minimapHit.addEventListener('pointerleave', () => {
  mmHover = -1
  hideMinimapPreview()
  paintMinimap()
})
minimapHit.addEventListener('click', (event) => {
  jumpToMinimap(mmIndexAt(event.clientY))
})
minimapHit.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault()
    const step = event.key === 'ArrowDown' ? 1 : -1
    const from = mmKeyboardIndex < 0 ? (step > 0 ? -1 : 0) : mmKeyboardIndex
    mmKeyboardIndex = Math.max(0, Math.min(mmEntries.length - 1, from + step))
    mmHover = mmKeyboardIndex
    showMinimapPreview(mmKeyboardIndex)
    paintMinimap()
    mmEntries[mmKeyboardIndex]?.row.scrollIntoView({ block: 'nearest' })
    return
  }
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault()
    jumpToMinimap(mmKeyboardIndex < 0 ? 0 : mmKeyboardIndex)
    return
  }
  if (event.key === 'Escape') {
    mmHover = -1
    mmKeyboardIndex = -1
    hideMinimapPreview()
    paintMinimap()
  }
})

/** The transcript is a live log, so the minimap follows mutations rather than being rebuilt by every caller. */
new MutationObserver(scheduleMinimap).observe(log, { childList: true, subtree: true, characterData: true })
log.addEventListener(
  'scroll',
  () => {
    if (mmFrame !== null) return
    mmFrame = requestAnimationFrame(() => {
      mmFrame = null
      refreshMinimapLight()
    })
  },
  { passive: true },
)
window.addEventListener('resize', scheduleMinimap)

/**
 * Show the empty state when the panel has **nothing to show**, and put it away the moment there is something.
 *
 * The condition is the panel's own state rather than a flag someone has to remember to set: a conversation open, a file
 * being read, or a turn being drawn are all reasons not to invite the reader to start. `current` is the session the
 * composer will write to; `view` is which panel the ring is showing. The empty state belongs to the chat view with no
 * session in it, which is the state a first visit actually lands in.
 */
function paintEmptyState() {
  const empty = document.getElementById('empty-state')
  if (empty === null) return
  const nothingOpen = view === 'chat' && current === null
  empty.hidden = !nothingOpen
  /** The conversation's own column is hidden under the invitation rather than left to draw an empty box. */
  if (log !== null) log.hidden = nothingOpen || view !== 'chat'
}

async function showView(next) {
  view = next
  for (const button of document.querySelectorAll('#views button')) {
    button.setAttribute('aria-selected', String(button.dataset.view === view))
    /** A tab stops being reachable by Tab once it is selected; the arrow keys are how the tablist is crossed. */
    button.tabIndex = button.dataset.view === view ? 0 : -1
  }
  log.hidden = view !== 'chat'
  scheduleMinimap()
  ledger.hidden = view !== 'trajectory'
  timeline.hidden = view !== 'trajectory'
  filePane.hidden = view !== 'file'
  const toolbar = document.getElementById('tr-toolbar')
  if (toolbar !== null) toolbar.hidden = view !== 'trajectory'
  if (view === 'trajectory' && current !== null) {
    followTail = true
    await showLedger(current)
    followLedgerTail()
  }
  paintEmptyState()
}

/** Read the ledger projection for one session and draw it. */
let ledgerFetches = 0
async function showLedger(id) {
  ledger.replaceChildren()
  /**
   * Only the newest request draws. Without this, two overlapping reads can land out of order and the older
   * one paints last, which is the other half of the stacked-draw bug.
   */
  const ticket = ++ledgerFetches
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '?view=ledger')
    if (!response.ok) return
    const body = await response.json()
    if (ticket !== ledgerFetches) return
      renderLedger(body, body.timeline ?? { spans: [], durationMs: 0 })
  } catch (error) {
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read the ledger: ' + (error && error.message)
    ledger.append(note)
  }
}

/** Milliseconds as something a person reads: 12ms, 1.4s, 2m 3s. */
function human(ms) {
  if (ms === undefined) return null
  if (ms < 1000) return ms + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's'
  return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's'
}

/**
 * One line of a record's own text, for the row.
 *
 * The row used to show the record's **label** — which is its kind, or a tool's name — so every assistant row
 * read `assistant` and told a reader nothing about what was said. The label names the kind and the snippet
 * carries the content; a reader scanning a ledger wants both, and the second is the reason they are looking.
 *
 * Newlines and runs of spaces are collapsed, because a summary is one line by construction and a tool's
 * arguments are usually JSON with both.
 */
function snippet(text, limit = 110) {
  const flat = String(text ?? '').replace(/\s+/g, ' ').trim()
  if (flat.length === 0) return ''
  return flat.length > limit ? flat.slice(0, limit) + '…' : flat
}

/** The wall clock a record started at, to the second. */
function clock(at) {
  if (at === undefined) return null
  const date = new Date(at)
  return Number.isNaN(date.getTime()) ? null : date.toISOString().slice(11, 19)
}

/**
 * One record, as a disclosure.
 *
 * The summary is the identity — kind, label, when, how long, what it cost — and the body is the full input
 * or output. Closed by default for the same reason the chat view collapses reason and tool records: the
 * ledger's shape is what a reader scans, and the detail is what they open.
 */
function recordNode(record) {
  const node = document.createElement('details')
  node.className = 'record'
  node.dataset.kind = record.kind
  if (record.inFlight === true) node.dataset.inflight = 'true'
  const line = document.createElement('summary')
  /**
   * The badge carries the kind, and for a call it carries the tool's name too — that is the one thing a
   * reader scans for when asking "which of these was the shell".
   */
  const kind = document.createElement('span')
  kind.className = 'kind'
  kind.textContent = record.kind === 'tool' && record.label.startsWith('→ ') ? 'tool ' + record.label.slice(2) : record.kind
  const label = document.createElement('span')
  label.className = 'label clip'
  label.textContent = snippet(record.text) || record.label
  const when = document.createElement('span')
  when.className = 'when'
  const started = clock(record.startedAt)
  const lasted = human(record.durationMs)
  const ttft = human(record.ttftMs)
  /**
   * An in-flight record shows its start and no duration. Printing a duration for something still running
   * would be invented time, and it is the kind a reader believes.
   */
  when.textContent = [started, lasted === null ? (record.inFlight === true ? 'started' : null) : lasted, ttft === null ? null : 'ttft ' + ttft]
    .filter(Boolean)
    .join(' · ')
  line.append(kind, label, when)
  if (record.usage !== undefined) {
    const usage = document.createElement('span')
    usage.className = 'usage' + (record.usageSource === 'provider' ? ' provider' : '')
    /**
     * Each count is printed only when it is present, and the source is named, because the harness's estimate
     * and a provider's report are different claims. An absent count prints nothing rather than a zero.
     */
    const parts = []
    if (record.usage.inputTokens !== undefined) parts.push('in ' + record.usage.inputTokens)
    if (record.usage.outputTokens !== undefined) parts.push('out ' + record.usage.outputTokens)
    usage.textContent = parts.join(' ') + (record.usageSource === 'provider' ? ' (reported)' : ' (estimated)')
    line.append(usage)
  }
  node.append(line)
  const body = document.createElement('pre')
  body.textContent = record.text.length > 0 ? record.text : '(no text recorded)'
  node.append(body)
  if (record.note !== undefined) {
    const note = document.createElement('div')
    note.className = 'when'
    note.textContent = record.note
    node.append(note)
  }
  return node
}

/** Draw the whole ledger: a totals line, then each turn with its steps. */
/**
 * The timeline band: one button per span, positioned along the session's recorded span.
 *
 * Each button carries its turn number as its text for a screen reader and as a tooltip for a mouse, and
 * picking it scrolls the ledger to that turn. A span whose turn is still running is striped rather than
 * given a width it cannot justify — the same rule the rows follow.
 */
/** The Trajectory area's state: the rows, the selection, and the toolbar's three modes. */
const trajectory = {
  rows: [],
  turns: new Map(),
  counts: new Map(),
  timeline: { spans: [], durationMs: 0 },
  data: {},
  selected: -1,
  durationActual: false,
  collapsedTurns: false,
  collapsedCalls: false,
  expanded: new Set(),
  search: '',
  focus: null,
  domainStart: undefined,
  domainEnd: undefined,
}

/** DSH's kind vocabulary, which the table's tags speak. */
const KIND_LABEL = { user: 'USER', assistant: 'ASSISTANT', reasoning: 'THINK', tool: 'TOOL', context: 'CONTEXT', system: 'SYSTEM', compaction: 'COMPACTED' }

/** A record's one-line body: its first line, or what the row is when it has none. */
function previewOf(record) {
  const text = String(record.text ?? '').split('\n')[0] ?? ''
  if (text !== '') return text
  if (record.kind === 'assistant') return '(tool call only)'
  if (record.kind === 'tool') return record.name ?? record.label ?? 'tool'
  return record.label ?? record.kind
}

/** The ledger flattened into table rows, with turn and step boundaries on the rows themselves. */
function rowsOf(data) {
  if (Array.isArray(data.rows)) return data.rows
  /** A server that does not send the projection still gets a table: flatten it here, the same way. */
  const rows = []
  for (const turn of data.turns ?? []) {
    for (const step of turn.steps ?? []) {
      ;(step.records ?? []).forEach((record, index) => {
        rows.push({
          turn: turn.index,
          step: step.index,
          kind: record.kind,
          record,
          turnStart: rows.length === 0 || rows[rows.length - 1].turn !== turn.index,
          stepStart: index === 0,
          loose: false,
        })
      })
    }
  }
  for (const record of data.loose ?? []) rows.push({ turn: 0, kind: record.kind, record, turnStart: false, stepStart: false, loose: true })
  return rows
}

function renderLedger(data, timeline_ = { spans: [], durationMs: 0 }) {
  /**
   * The pane is cleared here, not only in the caller: switching view and finishing a live turn at the
   * same moment used to stack two ledgers in one pane, and clearing at the point of drawing makes a
   * render idempotent whoever called it.
   */
  turnAnchors.clear()
  trajectory.rows = rowsOf(data)
  trajectory.turns = new Map((data.ledger?.turns ?? []).map((turn) => [turn.index, turn]))
  trajectory.timeline = timeline_
  trajectory.data = data
  trajectory.tools = Array.isArray(data.tools) ? data.tools : []
  trajectory.selected = -1
  trajectory.expanded.clear()
  trajectory.focus = null
  const times = trajectory.rows
    .map((row) => row.record?.startedAt)
    .filter((at) => typeof at === 'string')
    .map((at) => Date.parse(at))
    .filter((at) => !Number.isNaN(at))
  trajectory.domainStart = times.length > 0 ? Math.min(...times) : undefined
  trajectory.domainEnd = times.length > 0 ? Math.max(...times) : undefined

  /** DSH's shape: a scroll pane holding one table, and a details pane on the right. */
  const split = document.createElement('div')
  split.className = 'tr-split'
  const pane = document.createElement('div')
  pane.className = 'tr-pane'
  const table = document.createElement('table')
  table.id = 'tr-table'
  const head = document.createElement('thead')
  const headRow = document.createElement('tr')
  const eventHead = document.createElement('th')
  eventHead.className = 'tr-th-event'
  eventHead.textContent = 'Event'
  const contentHead = document.createElement('th')
  contentHead.textContent = 'Content'
  headRow.append(eventHead, contentHead)
  head.append(headRow)
  table.append(head, document.createElement('tbody'))
  pane.append(table)
  const details = document.createElement('aside')
  details.id = 'tr-details'
  details.hidden = true
  const resize = document.createElement('div')
  resize.className = 'tr-d-resize'
  resize.setAttribute('role', 'separator')
  resize.setAttribute('aria-orientation', 'vertical')
  resize.setAttribute('aria-label', 'resize the details pane')
  const setWidth = (width) => {
    const bounds = split.getBoundingClientRect()
    const clamped = Math.max(280, Math.min(width, Math.max(320, bounds.width - 280)))
    details.style.width = clamped + 'px'
    resize.setAttribute('aria-valuenow', String(Math.round(clamped)))
  }
  // DSH's separator says "Drag to resize. Double-click to reset." — a gesture a reader can discover.
  resize.title = 'Drag to resize. Double-click to reset.'
  resize.addEventListener('dblclick', () => {
    details.style.width = ''
    resize.removeAttribute('aria-valuenow')
  })
  resize.addEventListener('pointerdown', (pointerEvent) => {
    pointerEvent.preventDefault()
    const startX = pointerEvent.clientX
    const startWidth = details.getBoundingClientRect().width
    const move = (event) => setWidth(startWidth - (event.clientX - startX))
    const stop = () => {
      window.removeEventListener('pointermove', move)
      window.removeEventListener('pointerup', stop)
    }
    window.addEventListener('pointermove', move)
    window.addEventListener('pointerup', stop)
  })
  split.append(pane, resize, details)
  ledger.replaceChildren(split)

  const status = document.getElementById('tr-status')
  if (status !== null) {
    const ledgerData = data.ledger ?? {}
    const bits = [ledgerData.records ?? trajectory.rows.length, 'records']
    if ((ledgerData.turns?.length ?? 0) > 0) bits.push(ledgerData.turns.length + ' turns')
    const tokens = ledgerData.tokens ?? {}
    if (tokens.input !== undefined) bits.push('in ' + tokens.input)
    if (tokens.output !== undefined) bits.push('out ' + tokens.output)
    if (tokens.estimated !== undefined) bits.push(tokens.estimated + ' estimated')
    status.textContent = bits.join(' · ')
  }
  renderTimeline(timeline_, data)
  renderRows()
}

/** Re-draw the table body from the rows and the current modes. */
function renderRows() {
  const body = document.querySelector('#tr-table tbody')
  if (body === null) return
  turnAnchors.clear()
  trajectory.counts = new Map()
  for (const row of trajectory.rows) trajectory.counts.set(row.turn, (trajectory.counts.get(row.turn) ?? 0) + 1)
  const query = trajectory.search.trim().toLowerCase()
  const shown = []
  for (let index = 0; index < trajectory.rows.length; index += 1) {
    const row = trajectory.rows[index]
    const record = row.record ?? {}
    if (query !== '') {
      const haystack = [row.kind, record.name ?? '', record.text ?? '', record.result ?? '', record.label ?? ''].join('\n').toLowerCase()
      if (!haystack.includes(query)) continue
    }
    if (trajectory.collapsedTurns && !row.turnStart && !trajectory.expanded.has(row.turn)) continue
    shown.push([row, index])
  }
  body.replaceChildren(...shown.map(([row, index]) => rowNode(row, index)))
}

function rowNode(row, index) {
  const record = row.record ?? {}
  const tr = document.createElement('tr')
  tr.dataset.kind = row.kind
  tr.dataset.index = String(index)
  tr.dataset.turn = String(row.turn)
  if (row.step !== undefined) tr.dataset.step = String(row.step)
  if (row.turnStart) tr.dataset.turnStart = 'true'
  if (row.stepStart) tr.dataset.stepStart = 'true'
  if (record.inFlight === true) tr.dataset.inflight = 'true'
  if (record.state === 'error') tr.dataset.error = 'true'
  if (trajectory.collapsedCalls && row.kind === 'tool') tr.classList.add('tr-compact')
  if (trajectory.selected === index) tr.dataset.selected = 'true'
  if (trajectory.focus !== null && record.startedAt !== undefined) {
    const at = Date.parse(record.startedAt)
    if (!Number.isNaN(at) && (at < trajectory.focus.from || at > trajectory.focus.to)) tr.dataset.focus = 'outside'
  }
  const event = document.createElement('td')
  event.className = 'tr-event'
  if (row.turnStart) {
    const rail = document.createElement('span')
    rail.className = 'tr-rail'
    const label = document.createElement('span')
    label.className = 'tr-turn-label'
    label.textContent = row.loose ? 'between turns' : 'Turn ' + row.turn
    event.append(rail, label)
  }
  const tag = document.createElement('span')
  tag.className = 'tr-kind'
  tag.dataset.kind = row.kind
  tag.textContent = KIND_LABEL[row.kind] ?? String(row.kind).toUpperCase()
  const when = document.createElement('span')
  when.className = 'tr-when'
  when.textContent = clock(record.startedAt) ?? ''
  event.append(tag, when)
  const content = document.createElement('td')
  content.className = 'tr-content'
  const collapsed = trajectory.collapsedTurns && row.turnStart && !trajectory.expanded.has(row.turn)
  if (collapsed) {
    const summary = document.createElement('span')
    summary.className = 'tr-text'
    summary.textContent = '▸ ' + (trajectory.counts.get(row.turn) ?? 0) + ' records — click to expand'
    content.append(summary)
  } else if (row.kind === 'tool') {
    content.append(toolRowNode(record))
  } else {
    const text = document.createElement('span')
    text.className = 'tr-text'
    text.textContent = (row.preview ?? previewOf(record)) + (record.inFlight === true ? ' · running' : '')
    content.append(text)
  }
  tr.append(event, content)
  tr.tabIndex = 0
  tr.setAttribute('role', 'row')
  if (row.turnStart) turnAnchors.set(row.turn, tr)
  tr.addEventListener('click', () => {
    if (collapsed) {
      trajectory.expanded.add(row.turn)
      renderRows()
      return
    }
    selectRow(index)
  })
  tr.addEventListener('keydown', (keyEvent) => {
    if (keyEvent.key === 'Enter' || keyEvent.key === ' ') {
      keyEvent.preventDefault()
      tr.click()
    }
  })
  return tr
}

/** One row for one tool call: the request on the left, the result on the right, one element. */
function toolRowNode(record) {
  const wrap = document.createElement('div')
  wrap.className = 'tr-tool'
  const call = document.createElement('span')
  call.className = 'tr-call'
  const name = document.createElement('span')
  name.className = 'tr-name'
  name.textContent = record.name ?? String(record.label ?? 'tool').replace(/^→ /, '')
  const args = document.createElement('span')
  args.className = 'tr-args'
  args.textContent = String(record.text ?? '').replace(/\s+/g, ' ')
  call.append(name, args)
  const arrow = document.createElement('span')
  arrow.className = 'tr-arrow'
  arrow.textContent = '→'
  const result = document.createElement('span')
  result.className = 'tr-result'
  const out = String(record.result ?? '')
  result.textContent = out === '' ? 'no output' : out.split('\n')[0] ?? ''
  if (out === '') result.classList.add('tr-no-output')
  /** The arrow rides in the result cell: as a third grid item it wrapped the row onto a second line. */
  const answer = document.createElement('span')
  answer.className = 'tr-inline-result'
  answer.append(arrow, result)
  wrap.append(call, answer)
  return wrap
}

/** Select a row and show it in the details pane. */
function selectRow(index) {
  const row = trajectory.rows[index]
  if (row === undefined) return
  trajectory.selected = index
  for (const tr of ledger.querySelectorAll('#tr-table tbody tr')) tr.removeAttribute('data-selected')
  const node = ledger.querySelector('#tr-table tbody tr[data-index="' + index + '"]')
  if (node !== null) node.setAttribute('data-selected', 'true')
  renderDetails(row)
}

function trRows(pairs) {
  const list = document.createElement('dl')
  list.className = 'tr-d-rows'
  for (const [key, value] of pairs) {
    if (value === undefined || value === null || value === '') continue
    const term = document.createElement('dt')
    term.textContent = key
    const definition = document.createElement('dd')
    definition.textContent = String(value)
    list.append(term, definition)
  }
  return list
}

function trPre(text) {
  const pre = document.createElement('pre')
  pre.textContent = text
  return pre
}

function trSection(title) {
  const heading = document.createElement('div')
  heading.className = 'tr-d-section'
  heading.textContent = title
  return heading
}

function trEmpty(text) {
  const empty = document.createElement('p')
  empty.className = 'tr-d-empty'
  empty.textContent = text
  return empty
}

/** The right pane: Summary, Payload, Result and Timing, as DSH's tabs. */
function renderDetails(row) {
  const details = document.getElementById('tr-details')
  if (details === null) return
  const record = row.record ?? {}
  const turn = trajectory.turns.get(row.turn)
  const step = (turn?.steps ?? []).find((entry) => entry.index === row.step)
  details.hidden = false
  details.replaceChildren()
  const head = document.createElement('div')
  head.className = 'tr-d-head'
  const tag = document.createElement('span')
  tag.className = 'tr-kind'
  tag.dataset.kind = row.kind
  tag.textContent = KIND_LABEL[row.kind] ?? String(row.kind).toUpperCase()
  const where = document.createElement('span')
  where.className = 'tr-d-where'
  where.textContent = [row.loose ? 'before any turn' : 'Turn ' + row.turn, row.step !== undefined ? 'Step ' + row.step : null].filter(Boolean).join(' · ')
  const close = document.createElement('button')
  close.type = 'button'
  close.className = 'tr-d-close'
  close.textContent = '×'
  close.setAttribute('aria-label', 'close details')
  close.addEventListener('click', () => {
    details.hidden = true
    trajectory.selected = -1
    for (const tr of ledger.querySelectorAll('#tr-table tbody tr')) tr.removeAttribute('data-selected')
  })
  head.append(tag, where, close)
  const tabs = document.createElement('div')
  tabs.className = 'tr-d-tabs'
  const bodyBox = document.createElement('div')
  bodyBox.className = 'tr-d-body'
  /**
   * DSH's five tabs: Summary, Payload, Result, **Schema** and Timing. Schema is the tool's own definition —
   * the name, what it says it does, and the JSON Schema its arguments must satisfy — which is what turns
   * "it ran this" into "this is what running it means".
   */
  const sections = [
    ['Summary', () => summarySection(row, record, step)],
    ['Payload', () => (row.inspection?.payload !== undefined ? htmlBlock(row.inspection.payload) : String(record.text ?? '') === '' ? trEmpty('nothing was recorded as a payload') : trPre(String(record.text)))],
    ['Result', () => (row.inspection?.result !== undefined ? htmlBlock(row.inspection.result) : String(record.result ?? '') === '' ? trEmpty('no result recorded') : trPre(String(record.result)))],
    ...(row.kind === 'tool' ? [['Schema', () => schemaSection(row, record)]] : []),
    ['Timing', () => timingSection(record, turn, step)],
  ]
  const show = (index) => {
    tabs.querySelectorAll('.tr-d-tab').forEach((tab, at) => tab.setAttribute('aria-selected', at === index ? 'true' : 'false'))
    bodyBox.replaceChildren(sections[index][1]())
  }
  sections.forEach(([label], index) => {
    const tab = document.createElement('button')
    tab.type = 'button'
    tab.className = 'tr-d-tab'
    tab.textContent = label
    tab.setAttribute('role', 'tab')
    tab.addEventListener('click', () => show(index))
    tabs.append(tab)
  })
  details.append(head, tabs, bodyBox)
  show(0)
}

function summarySection(row, record, step) {
  /**
   * DSH's Summary is an **accordion**: Hierarchy, Status, Payload, Result, Schema and Timing, each an
   * `h3`-and-chevron heading that collapses, open by default. A `<details open>` is the native version of
   * that control: it collapses without script and keeps its keyboard behaviour.
   */
  const box = document.createElement('div')
  box.append(
    accOpen('Hierarchy', trRows([['Turn', row.loose ? 'none' : row.turn], ['Step', row.step], ['Model', step?.model]])),
    accOpen('Status', trRows([['Status', record.inFlight === true ? 'Running' : record.state === 'error' ? 'Failed' : 'Completed']])),
  )
  if (row.kind === 'tool') {
    box.append(
      accOpen('Payload', row.inspection?.payload !== undefined ? htmlBlock(row.inspection.payload) : trPre(String(record.text ?? ''))),
      accOpen('Result', row.inspection?.result !== undefined ? htmlBlock(row.inspection.result) : trPre(String(record.result ?? '(no result recorded)'))),
      accOpen('Schema', schemaSection(row, record)),
    )
  } else if (record.text !== undefined && String(record.text) !== '') {
    box.append(accOpen('Content', trPre(String(record.text))))
  }
  box.append(accOpen('Timing', timingSection(record, trajectory.turns.get(row.turn), step)))
  if (record.note !== undefined) box.append(trEmpty(String(record.note)))
  return box
}

/** A Summary section: a native disclosure, open by default, with a chevron in its summary. */
function accOpen(title, content) {
  const details = document.createElement('details')
  details.className = 'tr-d-acc'
  details.open = true
  const summary = document.createElement('summary')
  summary.textContent = title
  details.append(summary, content)
  return details
}

/** Markup the **server** rendered with the tested, escaping renderer. */
function htmlBlock(html) {
  const box = document.createElement('div')
  box.className = 'tr-html'
  box.innerHTML = html
  return box
}

/** The tool's own definition, as the profile declared it. */
function schemaSection(row, record) {
  const box = document.createElement('div')
  const rendered = row.inspection?.schema
  const name = record.name ?? String(record.label ?? '').replace(/^→ /, '')
  if (rendered !== undefined) {
    const heading = document.createElement('div')
    heading.className = 'tr-d-where'
    heading.textContent = rendered.name
    box.append(heading, trPre(rendered.description ?? ''))
    box.append(trSection('Parameters'), htmlBlock(rendered.parameters))
    return box
  }
  const tool = (trajectory.tools ?? []).find((entry) => entry.name === name)
  if (tool === undefined) {
    box.append(trEmpty('this profile does not describe that tool'))
    return box
  }
  const heading = document.createElement('div')
  heading.className = 'tr-d-where'
  heading.textContent = tool.name
  box.append(heading, trPre(tool.description ?? ''))
  box.append(trSection('Parameters'), trPre(JSON.stringify(tool.parameters ?? {}, null, 2)))
  return box
}

function timingSection(record, turn, step) {
  return trRows([
    ['Started', clock(record.startedAt)],
    ['Duration', human(record.durationMs)],
    ['TTFT', human(record.ttftMs)],
    ['Turn duration', human(turn?.durationMs)],
    ['Step duration', human(step?.durationMs)],
    ['Input tokens', record.usage?.inputTokens],
    ['Output tokens', record.usage?.outputTokens],
    ['Token source', record.usageSource],
  ])
}

/** The lane strip: Input / Model / Tools, with drag-to-focus like DSH's overview. */
function renderTimeline(timeline_, data = {}) {
  timeline.replaceChildren()
  const spans = timeline_?.spans ?? []
  if (spans.length === 0) return
  const total = timeline_?.durationMs ?? 0
  const lanes = ['input', 'model', 'tools']
  const wrapper = document.createElement('div')
  wrapper.className = 'tr-lanes'
  const focusBox = document.createElement('div')
  focusBox.className = 'tr-focus'
  wrapper.append(focusBox)
  const equal = 1 / spans.length
  for (const lane of lanes) {
    const laneBox = document.createElement('div')
    laneBox.className = 'tr-lane'
    laneBox.dataset.lane = lane
    const label = document.createElement('span')
    label.className = 'tr-lane-label'
    label.textContent = lane
    const track = document.createElement('div')
    track.className = 'tr-lane-track'
    spans.forEach((span, index) => {
      const kinds = span.kinds ?? []
      if (!(span.lanes ?? []).includes(lane)) return
      const tick = document.createElement('button')
      tick.type = 'button'
      tick.className = 'tr-tick'
      tick.dataset.lane = lane
      const left = trajectory.durationActual ? span.start : index * equal
      const width = trajectory.durationActual ? Math.max(span.end - span.start, 0.004) : equal * 0.9
      tick.style.left = (left * 100).toFixed(3) + '%'
      tick.style.width = (width * 100).toFixed(3) + '%'
      if (span.running) tick.dataset.running = 'true'
      tick.title = 'turn ' + span.turn + ' · ' + (kinds.join(', ') || 'records')
      tick.setAttribute('aria-label', tick.title)
      tick.addEventListener('click', (clickEvent) => {
        clickEvent.stopPropagation()
        const anchor = turnAnchors.get(span.turn)
        if (anchor !== undefined) anchor.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
      })
      track.append(tick)
    })
    laneBox.append(label, track)
    wrapper.append(laneBox)
  }
  timeline.append(wrapper)
  /** Drag across the strip to focus a time window; rows outside it dim, as DSH does. */
  let dragging = false
  let startX = 0
  const fractionAt = (clientX) => {
    const bounds = timeline.getBoundingClientRect()
    return Math.min(Math.max((clientX - bounds.left) / Math.max(bounds.width, 1), 0), 1)
  }
  const setWindow = (from, to) => {
    if (to - from < 0.01) {
      focusBox.style.display = 'none'
      trajectory.focus = null
    } else {
      focusBox.style.display = 'block'
      focusBox.style.left = (from * 100).toFixed(2) + '%'
      focusBox.style.width = ((to - from) * 100).toFixed(2) + '%'
      const start = trajectory.domainStart
      const end = trajectory.domainEnd
      trajectory.focus = start !== undefined && end !== undefined && end > start ? { from: start + from * (end - start), to: start + to * (end - start) } : null
    }
    renderRows()
  }
  timeline.onpointerdown = (pointerEvent) => {
    if (pointerEvent.target.closest('.tr-tick') !== null) return
    dragging = true
    startX = fractionAt(pointerEvent.clientX)
    focusBox.style.display = 'block'
    focusBox.style.left = (startX * 100).toFixed(2) + '%'
    focusBox.style.width = '0%'
    try {
      timeline.setPointerCapture?.(pointerEvent.pointerId)
    } catch {
      // A synthetic pointer cannot be captured; the drag still works from the listeners below.
    }
  }
  timeline.onpointermove = (pointerEvent) => {
    if (!dragging) return
    const x = fractionAt(pointerEvent.clientX)
    setWindow(Math.min(startX, x), Math.max(startX, x))
  }
  timeline.onpointerup = (pointerEvent) => {
    if (!dragging) return
    dragging = false
    const x = fractionAt(pointerEvent.clientX)
    setWindow(Math.min(startX, x), Math.max(startX, x))
  }
  const legend = document.createElement('div')
  legend.id = 'timeline-legend'
  legend.textContent = [human(total) + ' recorded', spans.length + ' turn(s)'].filter(Boolean).join(' · ')
  timeline.append(legend)
}

/** DSH's toolbar: the duration mode, the two collapse switches, and search. */
function wireTrajectoryToolbar() {
  for (const [id, key] of [
    ['tr-duration', 'durationActual'],
    ['tr-turns', 'collapsedTurns'],
    ['tr-calls', 'collapsedCalls'],
  ]) {
    const button = document.getElementById(id)
    if (button === null) continue
    button.addEventListener('click', () => {
      trajectory[key] = !trajectory[key]
      button.setAttribute('aria-pressed', trajectory[key] ? 'true' : 'false')
      if (key === 'durationActual') renderTimeline(trajectory.timeline, trajectory.data)
      else renderRows()
    })
  }
  const search = document.getElementById('tr-search-input')
  if (search !== null) {
    search.addEventListener('input', () => {
      trajectory.search = search.value
      renderRows()
    })
  }
}
wireTrajectoryToolbar()

async function refreshGoal() {
  const bar = document.getElementById('goal-bar')
  if (bar === null) return
  if (current === null) {
    bar.hidden = true
    goalView = null
    return
  }
  try {
    const response = await fetch('/api/goal?session=' + encodeURIComponent(current))
    const body = await response.json()
    goalView = response.ok ? (body.goal ?? null) : null
  } catch {
    goalView = null
  }
  if (goalView === null) {
    bar.hidden = true
    return
  }
  bar.hidden = false
  bar.dataset.phase = goalView.phase
  bar.dataset.activation = goalView.activation
  document.getElementById('goal-phase').textContent = goalView.phase + (goalView.phase === 'active' && goalView.activation === 'disarmed' ? ' (disarmed)' : '')
  document.getElementById('goal-objective').textContent = goalView.objective
  document.getElementById('goal-rounds').textContent = 'round ' + goalView.roundsStarted + '/' + goalView.maxGoalRounds
  const actions = document.getElementById('goal-actions')
  actions.replaceChildren()
  const verbs = []
  if (goalView.phase === 'active') verbs.push(['pause', 'pause'])
  if (goalView.phase === 'paused' || goalView.phase === 'blocked' || (goalView.phase === 'active' && goalView.activation === 'disarmed')) verbs.push(['resume', 'resume'])
  if (goalView.phase !== 'complete') verbs.push(['complete', 'complete'])
  if (goalView.phase !== 'complete') verbs.push(['edit', 'edit'])
  verbs.push(['clear', 'clear'])
  for (const [action, label] of verbs) {
    const button = document.createElement('button')
    button.type = 'button'
    button.dataset.goalAction = action
    button.textContent = label
    button.onclick = async () => {
      let body = { session: current, action, goal_id: goalView.id, revision: goalView.revision }
      if (action === 'edit') {
        const objective = prompt('The goal objective', goalView.objective)
        if (objective === null || objective.trim() === '') return
        body = { ...body, objective: objective.trim() }
      }
      const response = await fetch('/api/goal', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      })
      if (!response.ok) {
        const answer = await response.json().catch(() => ({}))
        setNote(answer.error ?? 'could not update the goal')
      }
      await refreshGoal()
    }
    actions.append(button)
  }
}

async function showSession(id) {
  lastTurnUsage = null
  lastTurnSeconds = 0
  current = id
  paintEmptyState()
  /** The composer follows the conversation: its own queue, and the model that session is run with. */
  adoptSession(id)
  await refreshSessions()
  syncSelectionToSession()
  if (view === 'trajectory') await showLedger(id)
  /**
   * The log is cleared and refilled from the session's own history.
   *
   * This is the half that was missing: selecting a session used to leave the right side empty, because
   * the only thing that ever wrote to it was the live stream and those events had already happened.
   */
  log.replaceChildren()
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id))
    if (!response.ok) {
      /**
       * A session that is no longer there is **not** the session being shown.
       *
       * Measured: a remembered id whose log had been removed left `current` pointing at nothing — the header said
       * "No session", the conversation column was empty, and the empty state stayed hidden because `current` still
       * held an id. Giving the pointer back is what lets the panel say the truth: there is nothing open here.
       */
      current = null
      const title = document.getElementById('session-title')
      if (title !== null) title.textContent = 'No session'
      const branch = document.getElementById('session-branch')
      if (branch !== null) branch.textContent = ''
      paintEmptyState()
      return
    }
    const body = await response.json()
    /**
     * The session's own model choice, when it has one. A session that has never recorded one leaves the
     * seat where it is, which is what lets a person pick a backend **before** the turn that creates the
     * session: the choice travels with the request and the server records it on the session it made.
     */
    applySessionModel(body.endpoint ?? null, body.model ?? null)
    /** The header follows the conversation, the way DSH's does. */
    const titleCell = document.getElementById('session-title')
    const branchCell = document.getElementById('session-branch')
    if (titleCell !== null) titleCell.textContent = typeof body.title === 'string' && body.title.length > 0 ? body.title : id
    if (branchCell !== null) branchCell.textContent = typeof body.cwd === 'string' ? body.cwd : ''
    /**
     * Each turn renders inside its own guard.
     *
     * A history that stops at the first turn it cannot draw is worse than one that skips it: measured, one
     * bad turn left the log holding a single message out of nine, and nothing said why. A skipped turn is
     * recorded in the DOM as a visible note so the failure is not silent.
     */
    for (const turn of body.turns ?? []) {
      try {
        add(turn.kind, turn.text, false, turn.label, turn)
      } catch (error) {
        const note = document.createElement('div')
        note.className = 'turn denied'
        note.textContent = 'could not render a ' + turn.kind + ' turn: ' + (error && error.message)
        log.append(note)
      }
    }
  } catch (error) {
    // A history that cannot be read must not empty the live view as well; the stream keeps appending.
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read this session: ' + (error && error.message)
    log.append(note)
  }
  await refreshGoal()
}

async function refreshSessions() {
  /** The search index is a cache of this answer, so this is where it goes stale. */
  searchIndex = null
  const response = await fetch('/api/sessions')
  if (!response.ok) return
  const sessions = await response.json()
  /**
   * The newest session is selected when nothing is yet.
   *
   * Without this the page starts attached to nothing: the tree appears, the log stays empty even though
   * sessions exist, and a prompt sent from that state creates a NEW session instead of continuing the one
   * a person is looking at. Measured: asking a question produced a two-message live view while the session
   * beside it held the whole transcript, because `current` was null and the click that followed selected
   * the session the prompt had just created rather than the one holding history.
   *
   * The list itself is drawn from the tree — this walk only needs to know which session is newest, and it
   * deliberately asks for **every** session rather than only the ad-hoc ones: a page that started with no
   * selection because all its sessions happened to be registered would be the same bug again.
   */
  if (current !== null) return
  const select = sessions[0]?.id ?? null
  if (select !== null) {
    current = select
    await showSession(select)
  }
}

const events = new EventSource('/api/events')
events.addEventListener('session', (message) => {
  const payload = JSON.parse(message.data)
  const event = payload.event
  /**
   * Whether a turn is running, read before the session filter below and for **every** session.
   *
   * The composer needs it for the session it is attached to, and this stream is the only place a turn this
   * page did not start becomes visible — another window's, or the CLI's. `model/request` is appended once
   * per round and `turn/completed` once per turn, so the pair is a start and an end rather than a guess.
   */
  if (event.type === 'model/request') {
    runningSessions.add(payload.session)
    paintRunningMarks()
  }
  else if (event.type === 'turn/completed') {
    runningSessions.delete(payload.session)
    paintRunningMarks()
    /**
     * A turn just ended, which is exactly when a queued message becomes sendable — including one that was
     * waiting on a turn this page never started. The pump refuses to run twice for one queue, so this can
     * never double-send.
     */
    if (payload.session === composerKey) void pumpQueue()
    renderComposerState()
    /**
     * And it is when the answer stops arriving, so the rows settle and the document is drawn.
     *
     * Driven from the **event** rather than only from the page's own response, because a turn posted by
     * anything else — the CLI, another window — settles here and nowhere else, and the reader should not be
     * able to tell whose turn it was by how the answer looks.
     */
    /**
     * The same "is this the panel's session" test the rows below use, including the case where the panel has
     * adopted nothing yet: a page that has only ever watched a turn — the CLI's, another window's — is showing
     * that session, and its answer settles here like anyone else's.
     */
    if (current === null || payload.session === current) {
      settleChat()
      void renderSettledAnswers()
    }
  }
  if (current && payload.session !== current) return
  if (event.type === 'assistant/chunk' && event.chunk.type === 'text-delta') add('assistant', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'reasoning-delta') add('reasoning', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'tool-call') {
    add('tool', event.chunk.arguments ?? '{}', false, '→ ' + event.chunk.name, {
      name: event.chunk.name,
      toolCallId: event.chunk.id,
      state: 'running',
    })
  } else if (event.type === 'message' && event.message.role === 'user') add('user', event.message.content.map((part) => part.text ?? '').join(''))
  else if (event.type === 'message' && event.message.role === 'tool') {
    const text = event.message.content.map((part) => part.text ?? '').join('')
    const failed = event.message.content.some((part) => part.text?.startsWith('error'))
    if (!fillToolResult(event.message.toolCallId, text, failed)) {
      // No call to fill in: the result is still the truth about what happened, so it is shown.
      add(failed ? 'denied' : 'tool', text, false, undefined, { state: failed ? 'error' : 'ok', result: text })
    }
  }
  /**
   * The ledger is a projection and is refetched rather than appended to, so following it means asking for it
   * again — and only when the reader has not scrolled away.
   */
  if (view === 'trajectory' && followTail && current !== null) {
    if (ledgerRefetchTimer !== null) clearTimeout(ledgerRefetchTimer)
    ledgerRefetchTimer = setTimeout(() => {
      ledgerRefetchTimer = null
      void showLedger(current)
    }, 500)
  }
})

/** Coalesces the burst of events one turn produces into a single ledger refetch. */
let ledgerRefetchTimer = null

/**
 * The sidebar is resizable, and the width survives a reload.
 *
 * The bounds are in `rem` and expressed in the same unit as the layout, so a reader who has enlarged their
 * default text size gets a proportionally wider panel rather than one measured in pixels that no longer
 * fits its contents. The upper bound also respects the window: a sidebar wider than four fifths of the
 * viewport leaves nothing to work in, which reads as the app being broken rather than as a choice.
 */
const SIDEBAR_KEY = 'heddle.layout.sidebar.v1'
const SIDEBAR_MIN_REM = 12
const SIDEBAR_MAX_REM = 48

/** The root font size, so rem bounds can be compared with pixel measurements from the window. */
function remPx() {
  return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16
}

/** How wide the sidebar may be right now: its own bounds, and the window's. */
function sidebarBounds() {
  const root = remPx()
  const byWindow = (window.innerWidth * 0.8) / root
  return { min: SIDEBAR_MIN_REM, max: Math.max(SIDEBAR_MIN_REM, Math.min(SIDEBAR_MAX_REM, byWindow)) }
}

function clampSidebar(rem) {
  const bounds = sidebarBounds()
  return Math.min(Math.max(rem, bounds.min), bounds.max)
}

/** Apply a width, and report it so assistive technology can read the control's value. */
function setSidebarWidth(rem, options = {}) {
  const width = clampSidebar(rem)
  document.documentElement.style.setProperty('--sidebar-width', width + 'rem')
  gutterLeft.setAttribute('aria-valuenow', String(Math.round(width)))
  if (options.persist !== false) {
    try {
      localStorage.setItem(SIDEBAR_KEY, String(width))
    } catch {
      // A browser that refuses storage still gets a working divider; only the memory is lost.
    }
  }
  return width
}

/** The stored width, when it is a number this layout can use. */
function storedSidebarWidth() {
  try {
    const value = Number(localStorage.getItem(SIDEBAR_KEY))
    return Number.isFinite(value) && value > 0 ? value : null
  } catch {
    return null
  }
}

const gutterLeft = document.getElementById('gutter-left')

/**
 * Drag the divider.
 *
 * Pointer capture is what keeps the drag attached to the divider when the pointer leaves it — without it a
 * quick drag across the content drops the gesture and the panel stops following, which feels like the
 * control is broken. The width is computed from the pointer's distance to the sidebar's own left edge
 * rather than from a stored offset, so the result cannot drift if the window is resized mid-drag.
 */
gutterLeft.addEventListener('pointerdown', (downEvent) => {
  downEvent.preventDefault()
  /**
   * Capture is attempted, not required.
   *
   * It is what keeps a drag attached when the pointer leaves the divider — without it a quick drag across
   * the content drops the gesture and the panel stops following. But it throws for a pointer the browser is
   * not tracking, which is exactly what a synthetic event is: measured, an automated drag dispatched
   * `pointerdown`/`pointermove`/`pointerup` and the panel never moved, because the throw aborted the handler
   * before the listeners were bound. Guarding it means the control works for real pointers and can still be
   * exercised, and judged, by a script.
   */
  try {
    gutterLeft.setPointerCapture(downEvent.pointerId)
  } catch {
    // A pointer the browser is not tracking still drags; it simply is not captured.
  }
  gutterLeft.dataset.dragging = 'true'
  const left = document.querySelector('aside').getBoundingClientRect().left

  const move = (moveEvent) => setSidebarWidth((moveEvent.clientX - left) / remPx())
  const stop = () => {
    delete gutterLeft.dataset.dragging
    gutterLeft.removeEventListener('pointermove', move)
    gutterLeft.removeEventListener('pointerup', stop)
    gutterLeft.removeEventListener('pointercancel', stop)
  }
  gutterLeft.addEventListener('pointermove', move)
  gutterLeft.addEventListener('pointerup', stop)
  gutterLeft.addEventListener('pointercancel', stop)
})

/** The width a double-click returns to: the layout's own default, not whatever was last dragged. */
const DEFAULT_SIDEBAR_REM = 22

/** A double-click on the divider restores the default width, a conventional escape from a bad drag. */
gutterLeft.addEventListener('dblclick', () => {
  setSidebarWidth(DEFAULT_SIDEBAR_REM)
})

/** Keyboard: a separator with focus is a control, and a control responds to the arrow keys. */
gutterLeft.addEventListener('keydown', (keyEvent) => {
  const step = keyEvent.shiftKey ? 4 : 1
  const current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 22
  if (keyEvent.key === 'ArrowLeft') setSidebarWidth(current - step)
  else if (keyEvent.key === 'ArrowRight') setSidebarWidth(current + step)
  else if (keyEvent.key === 'Home') setSidebarWidth(SIDEBAR_MIN_REM)
  else if (keyEvent.key === 'End') setSidebarWidth(SIDEBAR_MAX_REM)
  else return
  keyEvent.preventDefault()
})

/** A window narrowed past the stored width must not leave the sidebar wider than the space for it. */
window.addEventListener('resize', () => setSidebarWidth(
  parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 22,
  { persist: false },
))

const rememberedSidebar = storedSidebarWidth()
if (rememberedSidebar !== null) setSidebarWidth(rememberedSidebar, { persist: false })

/**
 * The sidebar **collapses to a rail**, which is DSH's gesture and the one thing this panel could not do.
 *
 * Measured from DSH on 2026-10-17: its sidebar is 280 pixels wide and 56 when collapsed, the control sits at the top
 * of the panel, its chord is `Alt+Meta+B`, and the state is **not** remembered — a reload brings the wide panel back.
 *
 * That last part is copied rather than improved, and the reason is a report from the owner: the collapsed state was
 * remembered here, so a reader who put the panel away once found a reload bring back a rail and **no tree**, with
 * nothing on screen to say the tree had been put away rather than lost. A collapse is a look at the content, not a
 * preference about the workspace; the width is the preference, and that is what survives.
 *
 * Collapsed, `body[data-sidebar='collapsed']` is what the stylesheet reads, so there is one source of truth for the
 * state and no class list to keep in step with an attribute.
 */
const sidebarToggle = document.getElementById('sidebar-toggle')

/** Whether the sidebar is collapsed, read from the document rather than tracked twice. */
function sidebarCollapsed() {
  return document.body.dataset.sidebar === 'collapsed'
}

/**
 * Apply the collapsed state and name the control for it.
 *
 * The control's **accessible name changes with the state** — "Collapse sidebar" / "Open sidebar" — because the name
 * of a toggle is the action, and a reader who hears "Collapse sidebar" while it is collapsed is being told to do
 * something that is already done.
 *
 * Nothing is written to storage: DSH does not remember this either, and a rail that outlives its reload hides the
 * tree from a reader who has forgotten the click that put it away.
 */
function setSidebarCollapsed(collapsed) {
  document.body.dataset.sidebar = collapsed ? 'collapsed' : 'expanded'
  sidebarToggle.setAttribute('aria-expanded', String(!collapsed))
  const label = collapsed ? 'Open sidebar' : 'Collapse sidebar'
  sidebarToggle.setAttribute('aria-label', label)
  sidebarToggle.title = `${label} (⌥⌘B)`
}

sidebarToggle.addEventListener('click', () => {
  setSidebarCollapsed(!sidebarCollapsed())
  sidebarToggle.focus()
})

/**
 * The rail's search control: put the panel back and hand the field the focus.
 *
 * A search control that only focuses a field the reader cannot see does nothing, so opening the panel is part of the
 * gesture rather than a separate step.
 */
document.getElementById('sidebar-search').addEventListener('click', () => {
  setSidebarCollapsed(false)
  const field = document.getElementById('session-search')
  field.focus()
  field.select()
})

/** Every visit starts wide: a collapse is a look at the content, and DSH does not carry it across a reload either. */
setSidebarCollapsed(false)

/**
 * The composer: the draft, the queue it feeds, and the model seat — DSH's input bar, reduced to heddle's parts.
 *
 * DSH's rules are followed rather than re-invented, because they are the behaviour the owner asked for by
 * reference and each one answers a question this page would otherwise guess at:
 *
 * - **Plain Enter submits; Shift+Enter is a newline.** DSH registers Enter on its editor's command layer and
 *   leaves Shift+Enter to the editor's own line break.
 * - **While a turn is running, plain Enter queues the message** — DSH's `busyEnter` preference, which
 *   defaults to `queue` — and **Ctrl/Cmd+Enter is the accelerated gesture**, resolved to the opposite
 *   delivery mode, so it goes next rather than last. DSH calls that delivery `steer` and injects into the
 *   running turn; heddle's turns are one HTTP request each and its log takes one writer, so the honest
 *   stand-in is "send this one next", which is what the mode means here and what a row's `Send now` does.
 * - **An empty draft with Ctrl/Cmd+Enter steers everything still waiting, in FIFO order** — DSH's
 *   `steerQueue`, and the reason the chord reads as "send the queued message".
 * - **A submit while nothing is running starts its turn immediately.** `resolveSubmitMode` answers `queue`
 *   when the agent is idle, and DSH's host drains a queue it can start at once; so does this page.
 * - **The queue renders nothing when it is empty, one row when it holds one, and a collapsed count header
 *   when it holds several** — DSH's `QueueDock`. A row offers send-now, edit and remove, which is DSH's
 *   `QueueAction` set.
 *
 * Two differences are heddle's rather than DSH's, and both are forced rather than chosen: the queue lives in
 * this page instead of on the host, because heddle has no agent runtime holding a delivery loop, and the
 * `busyEnter` preference is the constant DSH defaults to rather than a setting, because heddle has no
 * settings surface for it.
 */

/** The session the composer belongs to: the id on screen, or the empty string while a turn will start one. */
const QUEUE_KEY_NONE = ''
let composerKey = QUEUE_KEY_NONE
/** One array per session, so switching conversations can never send one session's message into another. */
const queues = new Map()
/**
 * Sessions a turn is running in **without this page driving it** — another window, or the CLI.
 *
 * DSH reads one host fact, `running`. This page has to reconstruct it from the two facts it can see: its own
 * turn, known exactly from the queue item being sent, and a turn another client started, visible only in the
 * event stream, which is what feeds this set. Only the page's own turn gates the pump — a stale "someone
 * else is running" must never stall a queue that is ready to go.
 */
const runningSessions = new Set()

const composer = document.getElementById('prompt')
const field = composer.elements.prompt
const sendButton = document.getElementById('send')
const stopButton = document.getElementById('stop')
const attachButton = document.getElementById('attach')
const attachMenu = document.getElementById('attach-menu')
const accessButton = document.getElementById('access')
const statusBar = document.getElementById('composer-status')

/**
 * One conversation column, shared by the transcript and the composer, and a handle that widens both.
 *
 * Measured from DSH's page on 2026-10-17: its text column is 680px and its composer card 712px — the card is
 * 32px wider, 16px on each side — and a 10px `col-resize` grip changes the column. The width is written as a
 * pixel custom property on `main`, which is what makes the transcript padding, the card, the status line and
 * the queue dock all follow one number instead of four that can disagree.
 */
const chatMain = document.querySelector('main')
const columnGrips = [...document.querySelectorAll('.column-grip')]
/** DSH's `CONTENT_MIN`, the floor of a dragged width. */
const COLUMN_MIN = 640
/**
 * The room the two grips and their safe edges need beside the column: **116px**.
 *
 * It is DSH's own sum, not a guess: on each side a 24px offset outside the column, a 10px grip, and a 24px safe
 * edge — 58px a side, 116 for the pair. DSH's number is 176 because its centre region is ~1018px wide; heddle's
 * is ~878px, and this is the same rule measured against it. The budget also has to be ≥116 or the grips narrow
 * (the CSS width is `min(10px, (area − column)/2 − 48px)`), and a grip that shrinks as the column grows is a grip
 * that cannot be caught.
 */
const COLUMN_EDGE_BUDGET = 116
const COLUMN_STORAGE = 'heddle.chatColumn'

/**
 * The minimap's own gutter: the rail is 30px wide and sits 4px from the chat's edge, so at the column's
 * **maximum** the text would otherwise come within ~26px of it (measured) and the right side reads crowded.
 * 48px is that rail plus breathing room, and it is reserved in {@link columnMax} so the transcript and the
 * composer both stop short of it.
 */
const COLUMN_RAIL_GUTTER = 48

/** The widest column the view area can hold: the grips' edge budget and the minimap's gutter, both reserved. */
function columnMax() {
