async function openAttachLevel(node) {
  attachMenu.hidden = false
  attachButton.setAttribute('aria-expanded', 'true')
  if (node === null) {
    attachTrail = []
    try {
      const response = await fetch('/api/tree')
      const body = await response.json()
      attachMenu.replaceChildren()
      renderAttachMenu(body)
    } catch {
      renderAttachMenu(null)
    }
    return
  }
  try {
    const response = await fetch(`/api/tree?path=${encodeURIComponent(node.path)}`)
    renderAttachMenu(await response.json())
  } catch {
    renderAttachMenu(null)
  }
}
attachButton.addEventListener('click', () => {
  if (attachMenu.hidden) void openAttachLevel(null)
  else closeAttachMenu()
})
document.addEventListener('click', (clickEvent) => {
  if (attachMenu.hidden) return
  if (attachMenu.contains(clickEvent.target)) return
  if (clickEvent.target === attachButton) return
  closeAttachMenu()
})
document.addEventListener('keydown', (keyEvent) => {
  if (keyEvent.key === 'Escape' && !attachMenu.hidden) closeAttachMenu()
})

/**
 * The access chip: the sandbox mode the server runs under, read from `/api/status`.
 *
 * The mode is fixed when the server constructs its sandbox, so this is a read-out rather than a control —
 * which is exactly why it is worth showing: a person should not have to guess whether the agent can write.
 */
function accessTitle(mode) {
  if (mode === 'read-only') return 'Read only'
  if (mode === 'danger-full-access') return 'Full access'
  return 'Workspace write'
}
async function loadStatus() {
  try {
    const response = await fetch('/api/status')
    if (!response.ok) return
    const body = await response.json()
    const mode = body?.sandbox?.mode
    if (typeof mode !== 'string') return
    accessButton.textContent = accessTitle(mode)
    accessButton.title = `the sandbox mode this server runs under: ${mode}`
  } catch {
    // A status the page cannot read must not stop the composer from being one.
  }
}

/**
 * The model seat: which backend answers this session.
 *
 * DSH's `conversation.input.model` seat in the composer's tool row, and its `/api/endpoints` counterpart rather
 * than DSH's provider catalogue: heddle's configuration names **endpoints**, each already carrying the model it
 * answers with, so the menu is one level where DSH's is two. Everything else follows DSH — the trigger shows
 * the current selection, choosing one applies to **this session** rather than to the harness, and the choice is
 * recorded so a reload comes back to it.
 *
 * The list comes from the server rather than from the configuration file, because an endpoint is resolved from
 * several layers and a page that read one file would miss the environment overrides and the repository's own
 * defaults.
 */

/** The endpoints the server offers, in its order, and the one it nominates. */
let endpointOptions = []
let endpointDefault = null
/** What this page will ask with. `null` means "whatever the server defaults to". */
let chosenEndpoint = null
let chosenModel = null

/** The name a person reads: the endpoint, and the model it answers with when it names one. */
function endpointTitle(name) {
  const found = endpointOptions.find((option) => option.name === name)
  if (found === undefined) return `${name} (not configured)`
  return typeof found.model === 'string' && found.model.length > 0 ? `${name} · ${found.model}` : name
}

/**
 * What this turn will ask with, checked against the endpoints the run actually has.
 *
 * A page can be older than the server it is talking to: a tab left open across a configuration change, or a
 * daemon restarted with a different endpoint list. The stale name it holds is then a name the run does not
 * have, and sending it refuses **every** message with a complaint about a backend nobody chose — measured on
 * 2026-10-12, after this machine's own configuration renamed an endpoint under an open tab.
 *
 * So the name is checked here. The run's nominated default answers instead, and the transcript says so rather
 * than letting a different backend take over in silence; a model override belonged to the endpoint that is
 * gone, so it goes with it.
 */
let staleEndpointNoted = null
function selectionForTurn() {
  const names = endpointOptions.map((option) => option.name)
  if (chosenEndpoint === null) return chosenModel !== null ? { model: chosenModel } : {}
  if (names.includes(chosenEndpoint)) {
    return { endpoint: chosenEndpoint, ...(chosenModel !== null ? { model: chosenModel } : {}) }
  }
  const fallback = endpointDefault ?? names[0] ?? null
  if (fallback === null) return {}
  if (staleEndpointNoted !== chosenEndpoint) {
    staleEndpointNoted = chosenEndpoint
    add('denied', `this session is set to '${chosenEndpoint}', which this run does not have; '${fallback}' answers instead`)
  }
  return { endpoint: fallback }
}

/**
 * Draw the seat and its menu.
 *
 * An endpoint the configuration no longer holds is **kept in the list**, as the session's own recorded value.
 * That is the reason this is a menu the page draws rather than a native `<select>`: a session switched to an
 * endpoint that was later removed still has to say what it is set to, or the first symptom is a turn that
 * refuses and a control that looks perfectly fine.
 */
function renderModelSeat() {
  const names = endpointOptions.map((option) => option.name)
  const wanted = chosenEndpoint ?? endpointDefault ?? names[0] ?? null
  chosenEndpoint = wanted
  modelLabel.textContent =
    wanted === null ? 'no model' : chosenModel !== null ? `${wanted} · ${chosenModel}` : endpointTitle(wanted)
  modelTrigger.disabled = names.length === 0
  const offered = wanted !== null && !names.includes(wanted) ? [wanted, ...names] : names
  modelMenu.replaceChildren()
  for (const name of offered) {
    const option = endpointOptions.find((entry) => entry.name === name)
    const item = document.createElement('button')
    item.type = 'button'
    item.setAttribute('role', 'menuitemradio')
    item.setAttribute('aria-checked', name === wanted ? 'true' : 'false')
    const label = document.createElement('span')
    label.className = 'model-name'
    label.textContent = name
    const model = document.createElement('span')
    model.className = 'model-id'
    if (option === undefined) {
      model.classList.add('model-missing')
      model.textContent = 'not configured'
    } else {
      model.textContent = typeof option.model === 'string' ? option.model : ''
    }
    item.append(label, model)
    item.onclick = () => {
      closeModelMenu()
      void chooseEndpoint(name)
    }
    modelMenu.append(item)
  }
}

function closeModelMenu() {
  modelMenu.hidden = true
  modelTrigger.setAttribute('aria-expanded', 'false')
}

/**
 * Choose the endpoint that answers this session.
 *
 * The choice is local **and** recorded. Local, because the next turn names it — which is what makes a choice
 * made before a session exists travel with the turn that creates one. Recorded, because the server writes it
 * to the session's own metadata, which is what makes a reload come back to it. A failure is reported rather
 * than swallowed: a switch that silently did nothing would leave a person talking to the backend they thought
 * they had left.
 */
async function chooseEndpoint(name, model) {
  chosenEndpoint = name
  chosenModel = model ?? null
  renderModelSeat()
  if (current === null) return
  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(current)}/model`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ endpoint: name, ...(model !== undefined ? { model } : {}) }),
    })
    if (!response.ok) {
      const body = await response.json().catch(() => ({}))
      setNote(body.error ?? `could not switch this session onto ${name}`)
    } else setNote('')
  } catch (error) {
    setNote(`could not switch this session onto ${name}: ${(error && error.message) || error}`)
  }
}

/** The model a session is recorded with, when it has one; a session with none keeps the page's own choice. */
function applySessionModel(endpoint, model) {
  if (typeof endpoint !== 'string' || endpoint.length === 0) return
  chosenEndpoint = endpoint
  chosenModel = typeof model === 'string' && model.length > 0 ? model : null
  renderModelSeat()
}

/** The endpoint list, which is what the seat needs before it can offer anything. */
async function loadEndpoints() {
  try {
    const response = await fetch('/api/endpoints')
    if (!response.ok) {
      setNote(`the endpoint list answered ${response.status}`)
      return
    }
    const body = await response.json()
    endpointOptions = Array.isArray(body.endpoints) ? body.endpoints : []
    endpointDefault = typeof body.default === 'string' ? body.default : null
  } catch (error) {
    setNote(`could not read the endpoint list: ${(error && error.message) || error}`)
  }
  renderModelSeat()
}

modelTrigger.addEventListener('click', (clickEvent) => {
  clickEvent.stopPropagation()
  const open = modelMenu.hidden
  modelMenu.hidden = !open
  modelTrigger.setAttribute('aria-expanded', String(open))
})

/** Any click outside the seat dismisses the menu, which is what DSH's popup shell does. */
document.addEventListener('click', (clickEvent) => {
  if (modelMenu.hidden) return
  if (!modelMenu.contains(clickEvent.target) && clickEvent.target !== modelTrigger) closeModelMenu()
})

document.addEventListener('keydown', (keyEvent) => {
  if (keyEvent.key === 'Escape' && !modelMenu.hidden) {
    closeModelMenu()
    modelTrigger.focus()
  }
})

/**
 * The left column: the folder tree of every registered workspace.
 *
 * Three rules are the owner's, and this renderer follows them rather than re-deriving them:
 *
 * - **A type folder is the boundary, and a session row exists only for an instance of one.** The
 *   server decides that and sends `session: null` everywhere else, so the page never guesses; a
 *   folder without a session is still navigable, it is simply not a place to work.
 * - **`+` and `−` are the disclosure**, in a boxed hit target, with the state on the row and the
 *   children inside a `role="group"` — the shape the owner asked for by name.
 * - **One level at a time.** A node's children are fetched when it is opened, and the expanded set is
 *   kept in `localStorage` so a reload comes back to the same shape.
 */
const treeList = document.getElementById('tree')
const treeNote = document.getElementById('tree-note')
const EXPANDED_KEY = 'heddle.tree.expanded.v1'

/** Where each drawn node is, so a remembered path can be opened without walking the DOM by label. */
const rowIndex = new Map()

/** The folder the prompt box belongs to, so a run continues the folder a person selected. */
let activeFolder = null

function readExpanded() {
  try {
    return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY) ?? '[]'))
  } catch (error) {
    return new Set()
  }
}

const expanded = readExpanded()

/**
 * Whether sessions the owner archived are drawn.
 *
 * A reading preference, so it persists like the expansion set; `off` is the default because a row a person put
 * away is not one they asked to see. The alternative — a session that disappears with no way back — is what
 * archiving would be if this did not exist.
 */
const ARCHIVED_KEY = 'heddle.tree.archived.v1'
let showingArchived = (() => {
  try {
    return localStorage.getItem(ARCHIVED_KEY) === 'true'
  } catch (error) {
    return false
  }
})()

function rememberArchived() {
  try {
    localStorage.setItem(ARCHIVED_KEY, String(showingArchived))
  } catch (error) {
    /* A browser with no storage still draws the tree; the preference is what is lost. */
  }
}

function rememberExpanded() {
  try {
    localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expanded]))
  } catch (error) {
    // A browser that refuses storage still gets the tree; only the memory of its shape is lost.
  }
}

function setNote(text) {
  treeNote.textContent = text ?? ''
  treeNote.hidden = text === undefined || text === null || text === ''
}

const FOLDER_PATH = 'M2 4.6A1.6 1.6 0 0 1 3.6 3h2.6l1.6 2h4.6A1.6 1.6 0 0 1 14 6.6v4.8A1.6 1.6 0 0 1 12.4 13H3.6A1.6 1.6 0 0 1 2 11.4z'
/** The one mark that distinguishes a type folder from a plain one: the braces around its name. */
const TYPE_MARK = 'M6.3 7.4 5 9.5l1.3 2.1M9.7 7.4 11 9.5l-1.3 2.1'
/** The front panel of an open folder, drawn as if the flap had fallen forward inside the same box. */
const FOLDER_OPEN_FRONT = 'M4.6 7.9h8.9l-1.4 4.6H3.2z'

function svgPath(d) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  path.setAttribute('d', d)
  return path
}

/**
 * One inline SVG per kind of node, drawn in `currentColor` so it follows the theme.
 *
 * A folder's glyph carries the one bit a reader needs before clicking: **open or closed**. The closed
 * folder is the outline, and the open one adds the tilted front panel inside the same 16px box, so the
 * state is visible without moving any other row — the owner's rule of 2026-10-11.
 */
/** How long ago, in the compact form a list uses: `now`, `12min`, `3h`, `4d`. */
function relativeAge(created) {
  const then = Date.parse(created)
  if (!Number.isFinite(then)) return ''
  const seconds = Math.max(0, Math.round((Date.now() - then) / 1000))
  if (seconds < 60) return 'now'
  const minutes = Math.round(seconds / 60)
  if (minutes < 60) return minutes + 'min'
  const hours = Math.round(minutes / 60)
  if (hours < 24) return hours + 'h'
  return Math.round(hours / 24) + 'd'
}

function kindIcon(kind, open = false) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', '0 0 16 16')
  svg.setAttribute('width', '14')
  svg.setAttribute('height', '14')
  svg.setAttribute('fill', 'none')
  svg.setAttribute('stroke', 'currentColor')
  svg.setAttribute('stroke-width', '1.2')
  svg.setAttribute('stroke-linejoin', 'round')
  svg.setAttribute('aria-hidden', 'true')
  svg.setAttribute('data-state', kind === 'file' ? 'file' : open ? 'open' : 'closed')
  if (kind === 'generated') svg.setAttribute('stroke-dasharray', '2 1.5')
  if (kind === 'file') {
    /**
     * A page rather than a folder: the same body with the corner turned down, which is the one mark
     * that says "you can open this and read it" next to a row that says "you can go into this".
     */
    svg.append(svgPath('M4 2h5l3 3v9H4z'), svgPath('M9 2v3h3'))
    return svg
  }
  if (kind === 'pin') {
    /** A pin, drawn rather than borrowed from the emoji font, which renders in a different style on every machine. */
    svg.append(svgPath('M6 2.2h4v1.1l-.9.5v3l1.4 1.3H3.5l1.4-1.3v-3L4 3.3z'), svgPath('M8 8.2v4.4'))
    return svg
  }
  if (kind === 'session') {
    /**
     * A conversation, not a folder: two speech lines in the same box. A session's `_sessions_` folder is
     * not drawn at all (the server hoists its instances into the branch), so this glyph is the only thing
     * that says a row is a session rather than something to walk into.
     */
    svg.append(svgPath('M3.2 3.6h9.6v6.2H8.4L5.6 12v-2.2H3.2z'), svgPath('M5.6 6.3h4.8M5.6 8.2h3.2'))
    return svg
  }
  svg.append(svgPath(FOLDER_PATH))
  if (open) svg.append(svgPath(FOLDER_OPEN_FRONT))
  if (kind === 'type') svg.append(svgPath(TYPE_MARK))
  if (kind === 'instance') {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
    dot.setAttribute('cx', '8')
    dot.setAttribute('cy', '9.9')
    dot.setAttribute('r', '1.5')
    dot.setAttribute('fill', 'currentColor')
    dot.setAttribute('stroke', 'none')
    svg.append(dot)
  }
  return svg
}

/** How big a file is, in the units a person reads without counting digits. */
function humanBytes(bytes) {
  if (bytes < 1024) return bytes + ' B'
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10 * 1024 ? 1 : 0) + ' KB'
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB'
}

/**
 * Show one file in the right panel.
 *
 * The fetch is the whole mechanism, and the refusals are shown rather than swallowed: a file the server
 * will not read — outside every root, a directory, a binary — arrives as a status and a sentence, and a
 * panel that went blank instead would look like an empty file. The path is the row's canonical path, so
 * what is read is what was clicked.
 */
let fileFetches = 0
async function showFile(node) {
  const ticket = ++fileFetches
  chooseSelected(node.path)
  /**
   * A file is shown in the panel **on its own**: the ring holds the file's tab and nothing else, because
   * Chat, Trajectory and Docs are all statements about a session and a file has none of them (owner's rule).
   */
  renderRing('file')
  fileHead.textContent = node.path
  fileBody.textContent = 'reading…'
  await showView('file')
  try {
    const response = await fetch('/api/file?path=' + encodeURIComponent(node.path))
    const body = await response.json()
    if (ticket !== fileFetches) return
    if (!response.ok) {
      fileBody.textContent = body.error ?? `the server answered ${response.status}`
      return
    }
    const bits = [humanBytes(body.bytes), body.lines + (body.lines === 1 ? ' line' : ' lines')]
    if (body.truncated) bits.push(`showing the first ${humanBytes(body.text.length)}`)
    fileHead.textContent = `${body.path}  ·  ${bits.join('  ·  ')}`
    /**
     * The server decided how to show this file and, for a document or source, produced the markup.
     * Handing it over is the whole client-side renderer: nothing here parses, escapes or highlights,
     * which is what keeps one escaping rule in the project rather than two that can disagree.
     */
    fileBody.dataset.renderer = body.renderer ?? 'text'
    /**
     * A page is fetched and framed; everything else is markup the server already produced.
     *
     * The two are separate requests on purpose: the file route answers JSON about a file, while the HTML route answers
     * the document itself with its resources rewritten, and mixing them would mean one route deciding whether its
     * answer is data or a program.
     */
    if (body.renderer === 'html') {
      fileHead.textContent = `${body.path}  ·  ${bits.join('  ·  ')}  ·  preview`
      await showHtml(body.path, await (await fetch('/api/html?path=' + encodeURIComponent(body.path))).json())
      return
    }
    fileHtml.hidden = true
    fileBody.hidden = false
    if (typeof body.html === 'string') {
      fileBody.innerHTML = body.html
    } else {
      fileBody.textContent = body.text
    }
  } catch (error) {
    if (ticket !== fileFetches) return
    fileBody.textContent = 'could not read this file: ' + (error && error.message)
  }
}

/**
 * The two panes a file can occupy: the text pane, and the frame an HTML document is shown in.
 *
 * A page cannot live in the text pane, because the text pane's rules are written for this project's own markup and a
 * document's own CSS would repaint the harness around it. The frame is a separate document, so a page looks like a
 * page and nothing it says can reach this one.
 */
const fileHtml = document.getElementById('file-html')
const htmlView = document.getElementById('html-view')

/** What a preview is allowed to contain, and it is **narrower** than DOMPurify's default rather than wider. */
const PREVIEW_TAGS = [
  'a', 'abbr', 'article', 'aside', 'b', 'blockquote', 'br', 'caption', 'cite', 'code', 'col', 'colgroup', 'dd',
  'del', 'details', 'dfn', 'div', 'dl', 'dt', 'em', 'figcaption', 'figure', 'footer', 'h1', 'h2', 'h3', 'h4',
  'h5', 'h6', 'header', 'hgroup', 'hr', 'i', 'img', 'ins', 'kbd', 'label', 'legend', 'li', 'main', 'mark', 'nav',
  'ol', 'p', 'picture', 'pre', 'q', 's', 'samp', 'section', 'small', 'source', 'span', 'strong', 'sub', 'summary',
  'sup', 'table', 'tbody', 'td', 'tfoot', 'th', 'thead', 'time', 'tr', 'u', 'ul', 'var', 'wbr', 'link', 'style',
]
const PREVIEW_ATTRS = [
  'abbr', 'align', 'alt', 'class', 'colspan', 'dir', 'height', 'href', 'hreflang', 'id', 'lang', 'media', 'name',
  'rel', 'role', 'sizes', 'span', 'src', 'srcset', 'start', 'style', 'summary', 'title', 'type', 'valign', 'width',
]

/**
 * Show an HTML document as a page.
 *
 * The order matters and is the whole safety argument: the sanitiser runs **before** anything is put in the frame, the
 * frame allows no scripts, and the document carries a policy the browser enforces. If the sanitiser has a bug, the
 * frame still cannot run a script; if both failed, the policy is what the browser reads. Three things have to fail
 * for a document in a workspace to run code in this app, and none of them is the only one.
 */
/**
 * The sanitiser, loaded on first use from this server's own copy of the package.
 *
 * Loaded here rather than by a `<script>` in the page's head, and the reason is a measurement: the first attempt
 * inserted the tag before the **first** `</head>` in the file, which is inside this page's own documentation comment
 * — so the tag never loaded, `DOMPurify` was undefined, and the whole module stopped at that point while the server
 * was answering correctly. Loading it lazily means a document that is not HTML never pays for it either.
 */
let purifierPromise = null
function loadPurifier() {
  if (globalThis.DOMPurify !== undefined) return Promise.resolve(globalThis.DOMPurify)
  if (purifierPromise === null) {
    purifierPromise = new Promise((resolve, reject) => {
      const element = document.createElement('script')
      element.src = '/vendor/purify.js'
      element.onload = () => resolve(globalThis.DOMPurify)
      element.onerror = () => reject(new Error('the sanitiser did not load'))
      document.head.append(element)
    })
  }
  return purifierPromise
}

async function showHtml(path, body) {
  let purifier = globalThis.DOMPurify
  if (purifier === undefined) {
    try {
      purifier = await loadPurifier()
    } catch {
      purifier = undefined
    }
  }
  if (purifier === undefined) {
    fileHtml.hidden = true
    fileBody.hidden = false
    fileBody.dataset.renderer = 'text'
    fileBody.textContent = 'the sanitiser did not load, so this document is shown as its source instead'
    return
  }
  const clean = purifier.sanitize(body.html ?? '', {
    ALLOWED_TAGS: PREVIEW_TAGS,
    ALLOWED_ATTR: PREVIEW_ATTRS,
    /** A style or a link element is kept for the document's own presentation, and `srcset` describes an image. */
    ADD_ATTR: ['srcset', 'sizes', 'media'],
    /** Nothing may be framed, and no URL may be followed that is not a resource. */
    FORBID_TAGS: ['script', 'iframe', 'object', 'embed', 'form', 'input', 'button', 'textarea', 'select', 'base'],
    FORBID_ATTR: ['onerror', 'onload', 'onclick', 'srcdoc', 'formaction', 'ping'],
    WHOLE_DOCUMENT: true,
    RETURN_DOM: false,
  })
  /**
   * The policy goes in as the first thing in the document, and `base` after it, so a relative reference the browser
   * resolves itself — a `url()` inside a stylesheet, which the rewrite cannot see — still lands beside the document.
   */
  const base = path.slice(0, path.lastIndexOf('/') + 1)
  const framed = clean.replace(
    /<head([^>]*)>/i,
    `<head$1><meta http-equiv="Content-Security-Policy" content="${body.csp ?? ''}"><base href="${base}">`,
  )
  htmlView.setAttribute('sandbox', 'allow-same-origin')
  /**
   * The sanitiser is asked for a whole document, so there is no branch that rebuilds one around a fragment.
   *
   * Measured, and it is why this is a sentence rather than code: the first version had such a fallback, and writing the
   * closing document tag inside its template literal **closed this page** — the browser ended the harness document at
   * that line, the body came out empty, and the server was answering correctly the whole time. The same trap caught the
   * comment that explained it, which is why this paragraph names no tag. A fallback that cannot be reached is not worth
   * a second way to write the document.
   */
  htmlView.srcdoc = framed
  fileBody.hidden = true
  fileHtml.hidden = false
}

/**
 * Follow a link inside a document, **in the panel**, rather than navigating the page away from it.
 *
 * Measured: a markdown link to a sibling file asked the browser for `/DEPLOY.md`, which answered `404`, so the reader
 * lost the document they were reading to reach a blank page. The server marks a link that names a file with
 * `data-heddle-path`, and a plain click on one opens that file here. A modified click is left alone, so
 * open-in-new-tab still does what it says.
 */
fileBody.addEventListener('click', async (clickEvent) => {
  const anchor = clickEvent.target instanceof Element ? clickEvent.target.closest('a') : null
  if (anchor === null) return
  /** A remote link, or one already marked to open beside the document, is left to the browser. */
  if (anchor.getAttribute('target') !== null) return
  if (clickEvent.metaKey || clickEvent.ctrlKey || clickEvent.shiftKey || clickEvent.button !== 0) return
  /**
   * Two shapes mean "a file in this workspace": the attribute a markdown link carries, and the address a raw HTML one
   * is given. Measured: a hand-written `<a href="README.md">` arrives only as the address, because the sanitizer
   * answers for an attribute's **value** and cannot add one to the tag — so a handler that read only the attribute
   * followed markdown links and navigated away on HTML ones.
   */
  const attribute = anchor.getAttribute('data-heddle-path')
  const addressed = anchor.getAttribute('href') ?? ''
  const path = attribute !== null && attribute.length > 0 ? attribute : decodeRawPath(addressed)
  if (path === null || path.length === 0) return
  clickEvent.preventDefault()
  const at = (anchor.getAttribute('href') ?? '').split('#')[1] ?? ''
  await openPath(path)
  if (at.length > 0) scrollToHeading(at)
  else fileBody.scrollTop = 0
})

/**
 * The file a raw address names, or `null` when the address is not this server's raw route.
 *
 * The page reads the path out of the address rather than being told it, which is the only way a raw HTML link can be
 * followed: the sanitizer decides one attribute's value and cannot add a second to the tag.
 */
function decodeRawPath(href) {
  const at = href.indexOf('/api/raw?path=')
  if (at === -1) return null
  const encoded = href.slice(at + '/api/raw?path='.length).split('#')[0]
  try {
    return decodeURIComponent(encoded)
  } catch {
    return null
  }
}

/** Open a file by its path, which is what a link names and what a tree row carries. */
async function openPath(path) {
  await showFile({ path, label: path.split('/').pop() ?? path, kind: 'file' })
}

/**
 * Take the reader to the heading a link's `#fragment` names.
 *
 * The fragments are matched by their text rather than by an `id`, because the renderer does not write ids and a
 * document written for GitHub relies on GitHub's own heading slugs. A reference that matches nothing does nothing,
 * which is the honest outcome: a jump to the top would be a lie about where the fragment is.
 */
function scrollToHeading(fragment) {
  const wanted = slug(fragment)
  const heading = [...fileBody.querySelectorAll('h1, h2, h3, h4, h5, h6')].find((element) => slug(element.textContent ?? '') === wanted)
  if (heading === undefined) return
  heading.scrollIntoView({ block: 'start' })
}

/** The same shape a heading's slug takes: lowercase, punctuation dropped, spaces as dashes. */
function slug(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
}

/**
 * Select a session row: show its conversation, and offer its two views.
 *
 * The prompt box keeps working because the session's **branch** — the folder its definition sits under — is
 * what work goes to. It is derived rather than stored, since the row's path is the definition and the branch
 * is always its grandparent: `<branch>/_sessions_/<session>`.
 */
async function selectSession(node) {
  activeFolder = node.path.replace(/\/_sessions_\/[^/]+$/, '')
  setNote('')
  if (view !== 'chat' && view !== 'trajectory') await showView('chat')
  renderRing('session')
  await showSession(node.session.id)
  /**
   * The mark is put on the row that was **clicked**, and last, because `showSession` resynchronises the
   * selection to whichever row claims the session. Before the tree stopped showing a captured conversation
   * twice, that moved the mark to the instance row — the session was shown once but claimed by two rows.
   */
  chooseSelected(node.path)
}

/**
 * What the right panel is showing, as a path in the tree.
 *
 * One idea rather than two: the panel shows a conversation or a file, and the tree marks the row that
 * is being shown. That is why the mark follows a session change *and* a file click, and why switching
 * back to Chat moves it to the conversation again — a mark that meant something else would be a second
 * thing to keep in step.
 */
let selectedPath = null

/** Paint the selection, and only the selection: called after every change that redraws or adds rows. */
function markSelection() {
  for (const row of treeList.querySelectorAll('.row')) {
    if (row.dataset.path === selectedPath) row.setAttribute('aria-current', 'true')
    else row.removeAttribute('aria-current')
  }
}

function chooseSelected(path) {
  selectedPath = path
  markSelection()
}

/** Move the mark to the row whose session is the one now shown, when that row is drawn at all. */
function syncSelectionToSession() {
  if (current === null) return
  for (const [path, entry] of rowIndex) {
    if (entry.node.session?.id === current) {
      chooseSelected(path)
      return
    }
  }
}

/** Close every open row menu; any click outside one is a dismissal. */
function closeMenus() {
  for (const list of document.querySelectorAll('#tree .menu')) list.hidden = true
  for (const button of document.querySelectorAll('#tree [aria-haspopup="true"]')) button.setAttribute('aria-expanded', 'false')
}

/**
 * What a row offers, as `{label, run}` pairs. An empty list means no `…` is drawn at all.
 *
 * The owner's rule of 2026-10-11: actions live behind the menu rather than on the row, because a control
 * that removes something should not sit one pixel from the control that navigates. A workspace can be
 * renamed and unregistered; an instance can start a session and retitle the one it has. A file, a type
 * folder and a plain folder offer nothing yet, so they show no menu rather than an empty one.
 */
function menuItemsFor(node) {
  const items = []
  if (node.kind === 'workspace') {
    /**
     * The owner's rule of 2026-10-11: a session can be started at the **top-level workspace** as well as
     * inside an instance, so a session that belongs to the whole repository has a home. It writes the
     * session's definition into that branch and leaves the log where logs live.
     */
    items.push({
      label: 'New session',
      run: () => startSessionAt(node),
    })
    items.push({
      label: 'Rename…',
      run: async () => {
        const title = window.prompt('Rename this workspace', node.label)
        if (title === null) return
        const response = await fetch('/api/workspaces/' + encodeURIComponent(node.path), {
          method: 'PATCH',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ title }),
        })
        const body = await response.json().catch(() => ({}))
        if (!response.ok) {
          setNote(body.error ?? 'could not rename that workspace')
          return
        }
        setNote('')
        await renderTree()
      },
    })
    /**
     * A refusal is shown rather than swallowed: `bootstrap` re-registers any folder that still has
     * sessions and no root above it, so "removed" and "gone" are different answers and the second one is
     * not available.
     */
    items.push({
      label: showingArchived ? 'Hide archived' : 'Show archived',
      run: async () => {
        showingArchived = !showingArchived
        rememberArchived()
        await renderTree()
      },
    })
    items.push({
      label: 'Unregister',
      run: async () => {
        const response = await fetch('/api/workspaces/' + encodeURIComponent(node.path), { method: 'DELETE' })
        if (!response.ok) {
          const body = await response.json().catch(() => ({}))
          setNote(body.error ?? 'could not unregister that workspace')
          return
        }
        setNote('')
        await renderTree()
      },
    })
  }
  if (node.kind === 'session') {
    /**
     * A session's row offers what DSH's own session menu offers — pin, rename, archive — because that is the set a
     * person expects from this control. Two of them are missing on purpose: **delete**, because this store's log is
     * append-only and archiving is the reversible act, and **duplicate**, because a session is a record of a run
     * rather than a document.
     *
     * The name is the **title**, not the folder — the folder is the identity the conventions require, while the
     * title is what a person reads — so renaming writes the title and the row shows it.
     */
    items.push({
      label: node.pinned ? 'Unpin' : 'Pin',
      run: () => setSessionFlags(node, { pinned: !node.pinned }),
    })
    items.push({
      label: 'Rename…',
      run: async () => {
        const title = window.prompt('Rename this session', node.session?.title ?? '')
        if (title === null) return
        const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/title', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ title, folder: node.path }),
        })
        const body = await response.json().catch(() => ({}))
        if (!response.ok) {
          setNote(body.error ?? 'could not rename that session')
          return
        }
        setNote('')
        await renderTree()
        await refreshSessions()
      },
    })
    items.push({
      /**
       * DSH's item and DSH's naming: the fork is `<title> (1)`, it appears beside its parent, and the view does
       * not move — a fork is a branch, not a departure.
       */
      label: 'Fork',
      run: async () => {
        const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/fork', { method: 'POST' })
        const body = await response.json().catch(() => ({}))
        if (!response.ok) {
          setNote(body.error ?? 'could not fork that session')
          return
        }
        setNote('')
        await renderTree()
        await refreshSessions()
      },
    })
    items.push({
      label: node.archived ? 'Unarchive' : 'Archive',
      run: () => setSessionFlags(node, { archived: !node.archived }),
    })
  }
  if (node.kind === 'instance') {
    /**
     * `New session here` is the branch case, not a special one: it goes through the same route as the
     * workspace row's item, because what makes a session findable is its **definition** and a store session
     * without one is invisible to the tree. Measured: the first version called `/api/folders/session`, which
     * only starts a transcript — so the menu item created a session nobody could see, which is precisely
     * what "make sure it works" found.
     */
    items.push({
      label: 'New session here',
      run: () => startSessionAt(node),
    })
    if (node.session) {
      items.push({
        label: 'Rename conversation…',
        run: async () => {
          const title = window.prompt('Rename this conversation', node.session.title ?? '')
          if (title === null) return
          const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/title', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ title }),
          })
          const body = await response.json().catch(() => ({}))
          if (!response.ok) {
            setNote(body.error ?? 'could not rename that conversation')
            return
          }
          setNote('')
          await renderTree()
          await refreshSessions()
        },
      })
    }
  }
  return items
}

/**
 * Pin, unpin, archive or unarchive a session, then redraw what the change affects.
 *
 * One function for both flags because the route is one: the record and the definition are written together, and
 * a row's menu only decides which of the two it is changing.
 */
async function setSessionFlags(node, patch) {
  const response = await fetch('/api/sessions/' + encodeURIComponent(node.session.id) + '/flags', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ...patch, folder: node.path }),
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not change that session')
    return
  }
  setNote('')
  await renderTree()
  await refreshSessions()
}

/**
 * Start a session at a branch, and make the act **visible**.
 *
 * Measured: the first version created the session correctly and then re-rendered the tree, and the owner
 * reported that nothing happened — because the branch the session appeared in was **closed**, so the new row
 * was inside a closed folder. Three things follow from that, and they are what this does: the branch is
 * opened, the new session's own row is selected so the eye lands on it, and only then is the tree redrawn.
 */
async function startSessionAt(node) {
  const response = await fetch('/api/sessions', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ branch: node.path }),
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not start a session there')
    return
  }
  setNote('')
  activeFolder = node.path
  expanded.add(node.path)
  rememberExpanded()
  if (typeof body.definition === 'string') chooseSelected(body.definition.replace(/\/session\.json$/, ''))
  await showSession(body.session)
  await renderTree()
}

/** The `…` control: a button, and the one list it opens. */
function menuButton(node, items) {
  const wrap = document.createElement('span')
  wrap.className = 'menu-wrap'
  const button = document.createElement('button')
  button.type = 'button'
  button.className = 'untwisty'
  button.textContent = '…'
  button.title = 'actions for ' + node.label
  button.setAttribute('aria-label', 'actions for ' + node.label)
  button.setAttribute('aria-haspopup', 'true')
  button.setAttribute('aria-expanded', 'false')
  const list = document.createElement('div')
  list.className = 'menu'
  list.setAttribute('role', 'menu')
  list.hidden = true
  for (const item of items) {
    const entry = document.createElement('button')
    entry.type = 'button'
    entry.setAttribute('role', 'menuitem')
    entry.textContent = item.label
    entry.onclick = async (event) => {
      event.stopPropagation()
      closeMenus()
      await item.run()
    }
    list.append(entry)
  }
  button.onclick = (event) => {
    event.stopPropagation()
    const wasOpen = list.hidden === false
    closeMenus()
    list.hidden = wasOpen
    button.setAttribute('aria-expanded', String(!wasOpen))
  }
  wrap.append(button, list)
  return wrap
}

document.addEventListener('click', closeMenus)

function nodeRow(node) {
  const li = document.createElement('li')
  li.setAttribute('role', 'treeitem')
  li.dataset.kind = node.kind
  li.dataset.open = 'false'
  if (node.kind !== 'file') {
    // The state lives on the tree item, where a reader is told about it, and on the control's label.
    li.setAttribute('aria-expanded', 'false')
  }

  const row = document.createElement('div')
  row.className = 'row'
  row.dataset.path = node.path
  row.tabIndex = 0
  if (node.path === selectedPath) row.setAttribute('aria-current', 'true')

  /** The left of the row is what it **is**: its kind, a type's badge, and its name. */
  const icon = document.createElement('span')
  icon.className = 'icon'
  icon.append(kindIcon(node.kind, false))
  row.append(icon)
  if (node.badge) {
    const badge = document.createElement('span')
    badge.className = 'badge'
    badge.textContent = node.badge
    row.append(badge)
  }
  /**
   * A pinned session says so on the row, because a pin that only reorders rows is a rule a reader has to know;
   * this is the same mark DSH puts beside a session it holds at the top.
   */
  if (node.pinned) {
    const pin = document.createElement('span')
    pin.className = 'pin'
    pin.title = 'pinned'
    pin.setAttribute('aria-label', 'pinned')
    pin.append(kindIcon('pin'))
    row.append(pin)
  }
  if (node.archived) li.dataset.archived = 'true'
  const label = document.createElement('span')
  label.className = 'label'
  /**
   * A session row shows the name a person gave it; everything else shows the folder's name.
   *
   * This is what makes `Rename…` mean something: the title was already carried by the node and written by the
   * route, and the row ignored it — measured, renaming succeeded and the label did not move. The folder stays
   * reachable as the row's tooltip, because it is still the identity.
   */
  label.textContent = node.kind === 'session' && node.session?.title ? node.session.title : node.label
  if (node.kind === 'session') row.title = node.path
  row.append(label)

  /**
   * The dot that used to sit here said whether an instance held a session: hollow when none, filled when one.
   *
   * It is gone, by the owner's decision of 2026-10-11 — **one dot per folder is noise, not information**. What
   * it reported is already reported twice: the row's own `turns` count appears only when there is a session,
   * and the folder glyph changes when one is opened. Nothing is lost by removing a third statement of it.
   */
  if (node.session) {
    /**
     * The row says **how long ago**, and the turn count moves to the tooltip.
     *
     * DSH's list reads `context-mgmt 4d` and `Running Heddle browser tool 24min`: the age is what tells a reader
     * which conversations are live, while a count of turns says how long one was. Both are here, in the order a
     * person asks for them — the age on the row, the count on hover.
     */
    const age = document.createElement('span')
    age.className = 'age'
    age.textContent = relativeAge(node.session.created)
    row.append(age)
    if (node.session.turns > 0) row.title = row.title.length > 0 ? row.title : `${node.session.turns} turn${node.session.turns === 1 ? '' : 's'}`
  }

  /**
   * The right of the row is what can be **done** with it, and the row is now clicked to open and close — so the
   * only control at the right edge is the menu.
   *
   * The `+` / `−` box that used to sit here is gone, by the owner's decision of 2026-10-11: the folder glyph on
   * the left already reports the state, and clicking the row performs the act, so the box was a second way to
   * do one thing and the eye had to find it before it could be used.
   */
  const actions = menuItemsFor(node)
  if (actions.length > 0) row.append(menuButton(node, actions))

  row.onclick = async () => {
    /**
     * Three kinds of row, three different acts — the owner's rules of 2026-10-11.
     *
     * A **file** is selected and shown in the panel, on its own. A **session** is selected and its
     * conversation is shown, with its trajectory a tab away. Everything else is a **folder**, and clicking
     * one only opens or closes it: navigation does not change what the panel is showing, so a person can
     * read a file and open three folders to look for another one without losing their place.
     */
    if (node.kind === 'file') {
      await showFile(node)
      return
    }
    if (node.kind === 'session') {
      await selectSession(node)
      return
    }
    await toggle(node, li)
  }
  row.onkeydown = (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault()
      row.onclick()
    }
  }

  li.append(row)
  rowIndex.set(node.path, { node, li, icon })
  return li
}

/** Draw a node's children, fetching them when they were not part of the answer that drew the node. */
async function loadChildren(node, li) {
  const group = document.createElement('ul')
  group.setAttribute('role', 'group')
  li.append(group)
  let children = node.children
  if (children === null) {
    try {
      /**
       * The same filter the roots were read with. Measured: expanding a branch re-read it **without** the
       * archived flag, so after toggling `Show archived` the roots came back with the archived session and
       * every reopened branch replaced it with the unfiltered list — the row existed and could not be seen.
       */
      const response = await fetch('/api/tree?path=' + encodeURIComponent(node.path) + (showingArchived ? '&archived=1' : ''))
      if (!response.ok) throw new Error('the tree answered ' + response.status)
      children = (await response.json()).children ?? []
    } catch (error) {
      setNote('could not read ' + node.label + ': ' + (error && error.message))
      children = []
    }
  }
  if (children.length === 0) {
    /**
     * A folder with nothing inside still opens **and closes**.
     *
     * The first version disabled the disclosure here and turned it into `·`, which the owner hit at
     * once: a leaf could be opened and then had no way back, because the only control that closed a
     * node was the one just disabled. Whether a folder is empty is only known after asking, so the
     * control cannot be the thing that reports it — the note below does, and `+` / `−` keep meaning
     * what they say.
     */
    const empty = document.createElement('div')
    empty.className = 'empty'
    empty.textContent = 'nothing inside'
    group.append(empty)
    return
  }
  for (const child of children) group.append(nodeRow(child))
  markSelection()
}

async function toggle(node, li) {
  const open = li.dataset.open === 'true'
  const entry = rowIndex.get(node.path)
  /**
   * The signs of one state: the **folder glyph on the left**, and the list item's own `aria-expanded` — which is
   * what tells a screen reader, and is why removing the `+` / `−` box lost no accessibility: the state was
   * always on the row as well as on the control.
   */
  const paint = (isOpen) => {
    li.dataset.open = isOpen ? 'true' : 'false'
    li.setAttribute('aria-expanded', isOpen ? 'true' : 'false')
    if (entry !== undefined && entry.icon !== undefined) entry.icon.replaceChildren(kindIcon(node.kind, isOpen))
  }
  if (open) {
    paint(false)
    li.querySelector('ul[role=group]')?.remove()
    expanded.delete(node.path)
    rememberExpanded()
    return
  }
  paint(true)
  expanded.add(node.path)
  rememberExpanded()
  await loadChildren(node, li)
  applySearch()
}

/**
 * Filter the tree by name, without asking the server.
 *
 * A session's name is on its row already, so the filter is a walk over the drawn rows rather than another
 * request — which is also why it can run on every keystroke. Only rows are put away: the branches stay, so the
 * answer still shows *where* the matching sessions are.
 */
function applySearch() {
  const query = document.getElementById('session-search').value.trim().toLowerCase()
  const note = document.getElementById('search-note')
  let hidden = 0
  let shown = 0
  for (const li of treeList.querySelectorAll('li')) {
    const label = li.querySelector(':scope > .row > .label')?.textContent ?? ''
    const isSession = li.dataset.kind === 'session'
    if (!isSession) continue
    const matches = query.length === 0 || label.toLowerCase().includes(query)
    li.hidden = !matches
    if (matches) shown += 1
    else hidden += 1
  }
  note.hidden = query.length === 0
  note.textContent = query.length === 0 ? '' : shown === 0 ? `no session matches “${query}”` : `${shown} session${shown === 1 ? '' : 's'} match${shown === 1 ? 'es' : ''}`
}

async function renderTree() {
  rowIndex.clear()
  let body
  try {
    const response = await fetch('/api/tree' + (showingArchived ? '?archived=1' : ''))
    if (!response.ok) {
      treeList.replaceChildren()
      setNote(
        response.status === 503
          ? 'this profile does not load the workspace plugin'
          : 'the tree answered ' + response.status,
      )
      return
    }
    body = await response.json()
  } catch (error) {
    setNote('could not read the tree: ' + (error && error.message))
    return
  }
  const tops = body.children ?? []
  if (tops.length === 0) setNote('no workspace root yet — register one with the + above')
  else setNote(activeFolder === null ? '' : 'a new conversation in ' + activeFolder.split('/').filter(Boolean).pop())
  treeList.replaceChildren(...tops.map(nodeRow))

  /**
   * The adopted folders, drawn with the same rows as the tree.
   *
   * They are the sessions nobody chose a project for: a folder that exists as a root only because a
   * session ran there. Same component, same lazy expansion, one level at a time — the difference is
   * a heading a person can act on.
   */
  const adhoc = body.adHoc ?? []
  list.replaceChildren(...adhoc.map(nodeRow))
  adhocNote.hidden = adhoc.length > 0
  adhocNote.textContent = 'nothing ad hoc — every session is under a workspace you registered'
  /**
   * A reload comes back to the shape a person left: the remembered nodes are opened again shallowest
   * first, so a deeper one is drawn by the time its turn comes, and each level is re-read rather than
   * remembered, because a cached level is a level that can be stale.
   */
  for (const path of [...expanded].sort((left, right) => left.split('/').length - right.split('/').length)) {
    const entry = rowIndex.get(path)
    // A file is never in `expanded`; skipping it keeps a stray key from asking for a disclosure it has.
    if (entry === undefined || entry.node.kind === 'file' || entry.li.dataset.open === 'true') continue
    await toggle(entry.node, entry.li)
  }
  if (selectedPath === null) syncSelectionToSession()
  markSelection()
}

document.getElementById('views').addEventListener('click', (clickEvent) => {
  const button = clickEvent.target.closest('button[data-view]')
  if (button) showView(button.dataset.view)
})

/**
 * The `+` opens the **platform's** folder chooser and mounts what it returns.
 *
 * The dialog is opened by the server, not by this page, and that is not a shortcut: a page runs
 * sandboxed, so a file input yields relative paths and `showDirectoryPicker` yields an opaque handle —
 * neither carries the absolute path a mount needs. The server runs on the machine the folder is on, so
 * it can ask the platform and hand the answer back.
 *
 * A cancel is nothing to do. A host with no usable dialog answers `501` with the reason, and this falls
 * back to typing a path rather than leaving a person with a button that does nothing.
 */
document.getElementById('add-workspace').onclick = async () => {
  let path = null
  try {
    const picked = await fetch('/api/workspaces/pick', { method: 'POST' })
    const body = await picked.json().catch(() => ({}))
    if (picked.ok) {
      if (body.kind === 'cancelled') return
      if (typeof body.path === 'string' && body.path.length > 0) path = body.path
    } else {
      setNote(body.error ?? 'this host has no folder dialog')
      path = prompt('Folder to register as a workspace root')
    }
  } catch (error) {
    // The route is unreachable, which is a host problem rather than a canvas problem: type it instead.
    setNote('could not open a folder dialog: ' + (error && error.message))
    path = prompt('Folder to register as a workspace root')
  }
  if (path === null || path.trim() === '') return
  const response = await fetch('/api/workspaces', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ path: path.trim() }),
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) {
    setNote(body.error ?? 'could not register that folder')
    return
  }
  setNote('')
  await renderTree()
}

/**
 * The page starts with what the composer needs, in the order it needs it.
 *
 * The endpoint list first, because the model seat can draw nothing without it and a session that arrives with
 * its own recorded model has to be shown against a list that exists. Then the session, then the tree. The queue
 * is drawn last: it is empty at boot, and drawing it once is what gives the submit action its first label.
 */
await loadEndpoints()
await loadStatus()
growComposer()
await refreshSessions()
document.getElementById('session-search').addEventListener('input', applySearch)
renderTree().then(() => applySearch())
renderQueue()
renderComposerState()
</script>
</body>
</html>
