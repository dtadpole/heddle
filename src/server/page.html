   * The composer needs it for the session it is attached to, and this stream is the only place a turn this
   * page did not start becomes visible — another window's, or the CLI's. `model/request` is appended once
   * per round and `turn/completed` once per turn, so the pair is a start and an end rather than a guess.
   */
  if (event.type === 'model/request') runningSessions.add(payload.session)
  else if (event.type === 'turn/completed') {
    runningSessions.delete(payload.session)
    /**
     * A turn just ended, which is exactly when a queued message becomes sendable — including one that was
     * waiting on a turn this page never started. The pump refuses to run twice for one queue, so this can
     * never double-send.
     */
    if (payload.session === composerKey) void pumpQueue()
    renderComposerState()
    /**
     * And it is when the answer stops arriving, so the rows settle and the document is drawn.
     *
     * Driven from the **event** rather than only from the page's own response, because a turn posted by
     * anything else — the CLI, another window — settles here and nowhere else, and the reader should not be
     * able to tell whose turn it was by how the answer looks.
     */
    /**
     * The same "is this the panel's session" test the rows below use, including the case where the panel has
     * adopted nothing yet: a page that has only ever watched a turn — the CLI's, another window's — is showing
     * that session, and its answer settles here like anyone else's.
     */
    if (current === null || payload.session === current) {
      settleChat()
      void renderSettledAnswers()
    }
  }
  if (current && payload.session !== current) return
  if (event.type === 'assistant/chunk' && event.chunk.type === 'text-delta') add('assistant', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'reasoning-delta') add('reasoning', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'tool-call') {
    add('tool', event.chunk.arguments ?? '{}', false, '→ ' + event.chunk.name, {
      name: event.chunk.name,
      toolCallId: event.chunk.id,
      state: 'running',
    })
  } else if (event.type === 'message' && event.message.role === 'user') add('user', event.message.content.map((part) => part.text ?? '').join(''))
  else if (event.type === 'message' && event.message.role === 'tool') {
    const text = event.message.content.map((part) => part.text ?? '').join('')
    const failed = event.message.content.some((part) => part.text?.startsWith('error'))
    if (!fillToolResult(event.message.toolCallId, text, failed)) {
      // No call to fill in: the result is still the truth about what happened, so it is shown.
      add(failed ? 'denied' : 'tool', text, false, undefined, { state: failed ? 'error' : 'ok', result: text })
    }
  }
  /**
   * The ledger is a projection and is refetched rather than appended to, so following it means asking for it
   * again — and only when the reader has not scrolled away.
   */
  if (view === 'trajectory' && followTail && current !== null) {
    if (ledgerRefetchTimer !== null) clearTimeout(ledgerRefetchTimer)
    ledgerRefetchTimer = setTimeout(() => {
      ledgerRefetchTimer = null
      void showLedger(current)
    }, 500)
  }
})

/** Coalesces the burst of events one turn produces into a single ledger refetch. */
let ledgerRefetchTimer = null

/**
 * The sidebar is resizable, and the width survives a reload.
 *
 * The bounds are in `rem` and expressed in the same unit as the layout, so a reader who has enlarged their
 * default text size gets a proportionally wider panel rather than one measured in pixels that no longer
 * fits its contents. The upper bound also respects the window: a sidebar wider than four fifths of the
 * viewport leaves nothing to work in, which reads as the app being broken rather than as a choice.
 */
const SIDEBAR_KEY = 'heddle.layout.sidebar.v1'
const SIDEBAR_MIN_REM = 12
const SIDEBAR_MAX_REM = 48

/** The root font size, so rem bounds can be compared with pixel measurements from the window. */
function remPx() {
  return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16
}

/** How wide the sidebar may be right now: its own bounds, and the window's. */
function sidebarBounds() {
  const root = remPx()
  const byWindow = (window.innerWidth * 0.8) / root
  return { min: SIDEBAR_MIN_REM, max: Math.max(SIDEBAR_MIN_REM, Math.min(SIDEBAR_MAX_REM, byWindow)) }
}

function clampSidebar(rem) {
  const bounds = sidebarBounds()
  return Math.min(Math.max(rem, bounds.min), bounds.max)
}

/** Apply a width, and report it so assistive technology can read the control's value. */
function setSidebarWidth(rem, options = {}) {
  const width = clampSidebar(rem)
  document.documentElement.style.setProperty('--sidebar-width', width + 'rem')
  gutterLeft.setAttribute('aria-valuenow', String(Math.round(width)))
  if (options.persist !== false) {
    try {
      localStorage.setItem(SIDEBAR_KEY, String(width))
    } catch {
      // A browser that refuses storage still gets a working divider; only the memory is lost.
    }
  }
  return width
}

/** The stored width, when it is a number this layout can use. */
function storedSidebarWidth() {
  try {
    const value = Number(localStorage.getItem(SIDEBAR_KEY))
    return Number.isFinite(value) && value > 0 ? value : null
  } catch {
    return null
  }
}

const gutterLeft = document.getElementById('gutter-left')

/**
 * Drag the divider.
 *
 * Pointer capture is what keeps the drag attached to the divider when the pointer leaves it — without it a
 * quick drag across the content drops the gesture and the panel stops following, which feels like the
 * control is broken. The width is computed from the pointer's distance to the sidebar's own left edge
 * rather than from a stored offset, so the result cannot drift if the window is resized mid-drag.
 */
gutterLeft.addEventListener('pointerdown', (downEvent) => {
  downEvent.preventDefault()
  /**
   * Capture is attempted, not required.
   *
   * It is what keeps a drag attached when the pointer leaves the divider — without it a quick drag across
   * the content drops the gesture and the panel stops following. But it throws for a pointer the browser is
   * not tracking, which is exactly what a synthetic event is: measured, an automated drag dispatched
   * `pointerdown`/`pointermove`/`pointerup` and the panel never moved, because the throw aborted the handler
   * before the listeners were bound. Guarding it means the control works for real pointers and can still be
   * exercised, and judged, by a script.
   */
  try {
    gutterLeft.setPointerCapture(downEvent.pointerId)
  } catch {
    // A pointer the browser is not tracking still drags; it simply is not captured.
  }
  gutterLeft.dataset.dragging = 'true'
  const left = document.querySelector('aside').getBoundingClientRect().left

  const move = (moveEvent) => setSidebarWidth((moveEvent.clientX - left) / remPx())
  const stop = () => {
    delete gutterLeft.dataset.dragging
    gutterLeft.removeEventListener('pointermove', move)
    gutterLeft.removeEventListener('pointerup', stop)
    gutterLeft.removeEventListener('pointercancel', stop)
  }
  gutterLeft.addEventListener('pointermove', move)
  gutterLeft.addEventListener('pointerup', stop)
  gutterLeft.addEventListener('pointercancel', stop)
})

/** Keyboard: a separator with focus is a control, and a control responds to the arrow keys. */
gutterLeft.addEventListener('keydown', (keyEvent) => {
  const step = keyEvent.shiftKey ? 4 : 1
  const current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 22
  if (keyEvent.key === 'ArrowLeft') setSidebarWidth(current - step)
  else if (keyEvent.key === 'ArrowRight') setSidebarWidth(current + step)
  else if (keyEvent.key === 'Home') setSidebarWidth(SIDEBAR_MIN_REM)
  else if (keyEvent.key === 'End') setSidebarWidth(SIDEBAR_MAX_REM)
  else return
  keyEvent.preventDefault()
})

/** A window narrowed past the stored width must not leave the sidebar wider than the space for it. */
window.addEventListener('resize', () => setSidebarWidth(
  parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 22,
  { persist: false },
))

const rememberedSidebar = storedSidebarWidth()
if (rememberedSidebar !== null) setSidebarWidth(rememberedSidebar, { persist: false })

/**
 * The composer: the draft, the queue it feeds, and the model seat — DSH's input bar, reduced to heddle's parts.
 *
 * DSH's rules are followed rather than re-invented, because they are the behaviour the owner asked for by
 * reference and each one answers a question this page would otherwise guess at:
 *
 * - **Plain Enter submits; Shift+Enter is a newline.** DSH registers Enter on its editor's command layer and
 *   leaves Shift+Enter to the editor's own line break.
 * - **While a turn is running, plain Enter queues the message** — DSH's `busyEnter` preference, which
 *   defaults to `queue` — and **Ctrl/Cmd+Enter is the accelerated gesture**, resolved to the opposite
 *   delivery mode, so it goes next rather than last. DSH calls that delivery `steer` and injects into the
 *   running turn; heddle's turns are one HTTP request each and its log takes one writer, so the honest
 *   stand-in is "send this one next", which is what the mode means here and what a row's `Send now` does.
 * - **An empty draft with Ctrl/Cmd+Enter steers everything still waiting, in FIFO order** — DSH's
 *   `steerQueue`, and the reason the chord reads as "send the queued message".
 * - **A submit while nothing is running starts its turn immediately.** `resolveSubmitMode` answers `queue`
 *   when the agent is idle, and DSH's host drains a queue it can start at once; so does this page.
 * - **The queue renders nothing when it is empty, one row when it holds one, and a collapsed count header
 *   when it holds several** — DSH's `QueueDock`. A row offers send-now, edit and remove, which is DSH's
 *   `QueueAction` set.
 *
 * Two differences are heddle's rather than DSH's, and both are forced rather than chosen: the queue lives in
 * this page instead of on the host, because heddle has no agent runtime holding a delivery loop, and the
 * `busyEnter` preference is the constant DSH defaults to rather than a setting, because heddle has no
 * settings surface for it.
 */

/** The session the composer belongs to: the id on screen, or the empty string while a turn will start one. */
const QUEUE_KEY_NONE = ''
let composerKey = QUEUE_KEY_NONE
/** One array per session, so switching conversations can never send one session's message into another. */
const queues = new Map()
/**
 * Sessions a turn is running in **without this page driving it** — another window, or the CLI.
 *
 * DSH reads one host fact, `running`. This page has to reconstruct it from the two facts it can see: its own
 * turn, known exactly from the queue item being sent, and a turn another client started, visible only in the
 * event stream, which is what feeds this set. Only the page's own turn gates the pump — a stale "someone
 * else is running" must never stall a queue that is ready to go.
 */
const runningSessions = new Set()

const composer = document.getElementById('prompt')
const field = composer.elements.prompt
const sendButton = document.getElementById('send')
const stopButton = document.getElementById('stop')
const attachButton = document.getElementById('attach')
const attachMenu = document.getElementById('attach-menu')
const accessButton = document.getElementById('access')
const statusBar = document.getElementById('composer-status')
const queueDock = document.getElementById('queue')
const modelTrigger = document.getElementById('model-trigger')
const modelMenu = document.getElementById('model-menu')
const modelLabel = document.getElementById('model-label')

/** DSH's `DEFAULT_BUSY_ENTER_BEHAVIOR`: plain Enter queues while the agent is busy. */
const BUSY_ENTER = 'queue'

function queueOf(key = composerKey) {
  let queue = queues.get(key)
  if (queue === undefined) {
    queue = []
    queues.set(key, queue)
  }
  return queue
}

/**
 * Follow the session the panel shows, carrying anything queued before that session existed.
 *
 * The first turn of a fresh panel starts a session, and a message queued while that turn ran belongs to the
 * session it created rather than to "no session" — so the loose queue moves with the id as the **same array**,
 * which is what keeps the pump already holding it working on the right list.
 */
function adoptSession(id) {
  if (typeof id !== 'string' || id.length === 0 || id === composerKey) return
  if (composerKey === QUEUE_KEY_NONE) {
    const loose = queues.get(QUEUE_KEY_NONE)
    if (loose !== undefined) {
      const existing = queues.get(id)
      if (existing === undefined) queues.set(id, loose)
      else existing.unshift(...loose.splice(0, loose.length))
      queues.delete(QUEUE_KEY_NONE)
    }
  }
  composerKey = id
  renderQueue()
}

function sessionRunning() {
  return runningSessions.has(composerKey)
}
function turnInFlight() {
  return queueOf().some((item) => item.status === 'sending')
}
function anyRunning() {
  return turnInFlight() || sessionRunning()
}

/**
 * Resolve a submission gesture into a delivery mode — DSH's `resolveSubmitMode`.
 *
 * Written as DSH writes it — `if (!running) return 'queue'; if (gesture === 'enter') return preferred;
 * return preferred === 'queue' ? 'steer' : 'queue'` — minus its `steeringAvailable` test, which is what
 * refuses the accelerated gesture on a transport that cannot steer. heddle's `steer` means "send this next"
 * rather than "inject into the running turn", so the gesture is always available and does something visible.
 */
function resolveSubmitMode(preferred, running, gesture) {
  if (!running) return 'queue'
  if (gesture === 'enter') return preferred
  return preferred === 'queue' ? 'steer' : 'queue'
}

/** How much of a queued message a closed row shows, in characters — DSH's own preview length. */
const QUEUE_PREVIEW_CHARS = 200
let queueSeq = 0
let queueExpanded = false
let editing = null

function previewOf(text) {
  const flat = text.replace(/\s+/g, ' ').trim()
  const chars = Array.from(flat)
  return chars.length > QUEUE_PREVIEW_CHARS ? `${chars.slice(0, QUEUE_PREVIEW_CHARS).join('')}…` : flat
}

/** Submit the draft, or steer what is waiting when there is nothing to submit. */
function submitDraft(gesture) {
  const text = field.value.trim()
  if (text === '') {
    if (gesture === 'accelerated') void steerQueue()
    return
  }
  field.value = ''
  growComposer()
  updateSendDisabled()
  const mode = resolveSubmitMode(BUSY_ENTER, anyRunning(), gesture)
  if (mode === 'steer') {
    void deliverSteered(text)
    return
  }
  enqueue(text, 'queue')
}

/** Add one message to the wait: at the end for an ordinary submit, at the front for a steer that could not land. */
function enqueue(text, where) {
  const item = { id: `queued-${++queueSeq}`, text, status: 'pending' }
  const queue = queueOf()
  if (where === 'steer') queue.unshift(item)
  else queue.push(item)
  renderQueue()
  void pumpQueue()
}

/**
 * Deliver a message into the running turn, or queue it when there is no turn to steer into.
 *
 * DSH's host refuses a steer whose turn has ended (`session/steer-unavailable`), and the composer's answer to
 * that refusal is a **queue** — the same thing DSH's own loop does with a submission that arrives after the
 * window closed. So a refusal falls back rather than failing: the message is not lost, it is next in the wait.
 */
async function deliverSteered(text) {
  if (await steerNow(text)) return
  enqueue(text, 'steer')
}

/** One steer attempt. `true` means the message is in the running turn; `false` means it was refused. */
async function steerNow(text) {
  if (composerKey === QUEUE_KEY_NONE) return false
  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(composerKey)}/steer`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ prompt: text }),
    })
    if (response.ok) return true
    if (response.status === 409) return false
    const detail = await response.text().catch(() => '')
    add('denied', `could not steer: ${detail.trim().replace(/\s+/g, ' ').slice(0, 200) || response.status}`)
    return false
  } catch (error) {
    add('denied', `could not steer: ${(error && error.message) || error}`)
    return false
  }
}

/**
 * Send now: the row a person pointed at is delivered into the running turn, or — with no turn to steer into —
 * moved to the front of the wait.
 *
 * This is DSH's `QueueAction` of kind `steer`, which is the same operation the accelerated chord performs on
 * whatever the composer holds; a row is that operation on a row.
 */
async function steerItem(id) {
  const queue = queueOf()
  const at = queue.findIndex((item) => item.id === id)
  if (at === -1) return
  const item = queue[at]
  if (item !== undefined && item.status !== 'sending' && (await steerNow(item.text))) {
    const landed = queue.findIndex((entry) => entry.id === id)
    if (landed !== -1) queue.splice(landed, 1)
    renderQueue()
    void pumpQueue()
    return
  }
  const [moved] = queue.splice(at, 1)
  if (moved !== undefined && moved.status === 'failed') moved.status = 'pending'
  if (moved !== undefined) queue.unshift(moved)
  renderQueue()
  void pumpQueue()
}

/**
 * Steer everything still waiting, in FIFO order — DSH's `steerQueue`, which its empty-draft chord calls.
 *
 * DSH submits every pending item through `steer` and **stops at the first refusal**, because a refusal means
 * the turn has ended and the rest are then the loop's own next-turn work rather than the chord's. The order is
 * the queue's, so this walks it and does not reorder anything; whatever it could not deliver is pumped by the
 * ordinary drain, which is what turns a closed window back into a queue.
 */
async function steerQueue() {
  const queue = queueOf()
  for (const item of queue) if (item.status === 'failed') item.status = 'pending'
  renderQueue()
  for (const item of [...queue]) {
    if (item.status === 'sending') continue
    if (!(await steerNow(item.text))) break
    const at = queue.findIndex((entry) => entry.id === item.id)
    if (at !== -1) queue.splice(at, 1)
    renderQueue()
  }
  void pumpQueue()
}

function removeItem(id) {
  const queue = queueOf()
  const at = queue.findIndex((item) => item.id === id)
  if (at === -1) return
  queue.splice(at, 1)
  if (editing !== null && editing.id === id) editing = null
  renderQueue()
}

/** One row's action buttons. A row being sent refuses all three, which is DSH's rule. */
function queueActions(item, isEditing) {
  const wrap = document.createElement('div')
  wrap.className = 'actions'
  const sending = item.status === 'sending'
  const action = (glyph, label, disabled, run) => {
    const button = document.createElement('button')
    button.type = 'button'
    button.className = 'action'
    button.textContent = glyph
    button.title = label
    button.setAttribute('aria-label', label)
    button.disabled = disabled
    button.onclick = run
    wrap.append(button)
  }
  if (isEditing) {
    action('✓', 'Save queued message', false, () => {
      const text = editing.text.trim()
      if (text === '') return
      item.text = text
      editing = null
      renderQueue()
    })
    action('✕', 'Cancel edit', false, () => {
      editing = null
      renderQueue()
    })
    return wrap
  }
  action('↥', 'Steer queued message', sending, () => void steerItem(item.id))
  action('✎', 'Edit queued message', sending, () => {
    editing = { id: item.id, text: item.text }
    renderQueue()
  })
  action('✕', 'Remove queued message', sending, () => removeItem(item.id))
  return wrap
}

function queueRow(item) {
  const row = document.createElement('li')
  row.className = 'row'
  row.dataset.status = item.status
  row.dataset.id = item.id
  if (editing !== null && editing.id === item.id) {
    const editor = document.createElement('textarea')
    editor.className = 'editor'
    editor.value = editing.text
    editor.setAttribute('aria-label', 'Edit queued message')
    editor.oninput = () => {
      editing.text = editor.value
    }
    row.append(editor, queueActions(item, true))
    return row
  }
  const preview = document.createElement('span')
  preview.className = 'preview'
  preview.textContent = previewOf(item.text)
  preview.title = item.text
  row.append(preview)
  if (item.status === 'sending' || item.status === 'failed') {
    const status = document.createElement('span')
    status.className = 'status'
    status.textContent = item.status === 'sending' ? 'Sending…' : 'Not sent'
    row.append(status)
  }
  row.append(queueActions(item, false))
  return row
}

/** The queue dock: nothing, one row, or a count header over the rows — DSH's `QueueDock` exactly. */
function renderQueue() {
  renderComposerState()
  const queue = queueOf()
  if (queue.length === 0) {
    queueDock.hidden = true
    queueDock.replaceChildren()
    return
  }
  queueDock.hidden = false
  const panel = document.createElement('div')
  panel.className = 'panel'
  /** One item is drawn directly; several fold behind the header, which starts closed. */
  const visible = queue.length === 1 || queueExpanded
  if (queue.length > 1) {
    const header = document.createElement('button')
    header.type = 'button'
    header.className = 'header'
    header.setAttribute('aria-expanded', String(visible))
    header.textContent = `${queue.length} queued messages ${visible ? '▾' : '▸'}`
    header.onclick = () => {
      queueExpanded = !queueExpanded
      renderQueue()
    }
    panel.append(header)
  }
  const list = document.createElement('ul')
  list.className = 'list'
  list.hidden = !visible
  if (visible) for (const item of queue) list.append(queueRow(item))
  panel.append(list)
  queueDock.replaceChildren(panel)
}

/**
 * Send what is waiting, one message at a time.
 *
 * One at a time is not a simplification: a session's log takes one writer, and the store's sequence number is
 * derived from what has already been written, so two turns interleaved on one session would record two events
 * with one seq. DSH's host drains its inbox at a turn boundary for the same reason.
 *
 * The guard is on the **queue array**, not on the session key, and that is a correction rather than a detail:
 * the first turn of a fresh panel starts a session, `adoptSession` moves the loose queue onto the id it
 * created — the same array — and a key-based guard then let a second pump start on the queue the first pump
 * was already draining. Measured in `_verifiers_/80-web-ui/check-composer.mjs`: two messages went out
 * concurrently and the rest of the queue stopped moving.
 *
 * A message the pump cannot send **stays** in the dock marked `Not sent`, where a person can steer it again or
 * remove it — rather than being dropped or retried forever.
 */
const pumping = new WeakSet()
async function pumpQueue(key = composerKey) {
  const queue = queueOf(key)
  if (pumping.has(queue)) return
  pumping.add(queue)
  try {
    for (;;) {
      const item = queue.find((entry) => entry.status === 'pending')
      if (item === undefined) break
      item.status = 'sending'
      renderQueue()
      /**
       * The session is resolved **when the message is sent**, not when it was queued.
       *
       * Measured on 2026-10-12, and it was the queue's worst failure: a message queued behind the very first
       * turn of a fresh panel is queued under "no session yet", and the turn that was running created one. Sent
       * with the stale key, every message after it carried `session: null` — so the server started **a new
       * session for each one**, they were recorded somewhere the panel was not showing, and the person saw
       * their words vanish while four turns quietly ran. `adoptSession` moves the queue onto the id the first
       * turn created; this reads that id at send time.
       */
      const forKey = key === QUEUE_KEY_NONE && composerKey !== QUEUE_KEY_NONE ? composerKey : key
      try {
        await runTurn(item.text, forKey)
        const at = queue.findIndex((entry) => entry.id === item.id)
        if (at !== -1) queue.splice(at, 1)
      } catch (error) {
        item.status = 'failed'
        /**
         * A refusal gives the message **back to the composer** when nothing new has been typed, which is what
         * DSH does with a failed submission: the draft is restored only while it is untouched, so a person's
         * words are never lost to a refusal they did not cause. A draft that has moved on keeps the row in the
         * dock marked `Not sent`, so both halves of the refusal are still visible and neither overwrites the
         * other.
         */
        if (field.value.trim() === '') {
          field.value = item.text
          const at = queue.findIndex((entry) => entry.id === item.id)
          if (at !== -1) queue.splice(at, 1)
        }
        add('denied', `the message could not be sent: ${(error && error.message) || error}`)
      }
      renderQueue()
    }
  } finally {

  }
}

/**
 * Send one message as a turn, and read the turn's own stream for what only it carries.
 *
 * `key` is the queue the message came from — the session it was submitted for, or the empty string while no
 * session exists. The turn names that session rather than whatever the panel happens to show, because a
 * person may switch conversations while a queued message is going out; the answer is recorded in the session
 * it was asked in either way.
 *
 * **The deltas are not drawn here.** They are already drawn by the `EventSource` below, which is the page's
 * one renderer of recorded events — and drawing them here as well is a real hazard rather than a theoretical
 * one: the two paths would print every answer twice. What this response alone carries, and what is therefore
 * read here, is the turn's own verdict — its denials, its completion, its failure.
 */

 * Statuses that mean the request never reached the harness.
 *
 * A local front door that forwards to the daemon answers one of these while the daemon is restarting, and the
 * measurement behind this is the owner's report of 2026-10-12: `heddle-proxy: the upstream did not answer
 * (connect ECONNREFUSED 127.0.0.1:3082)`, read as a failed message. Nothing was sent, so sending it again is
 * not a repeat — which is the whole test for whether a retry is honest.
 */
const NOT_FORWARDED = new Set([502, 503, 504])

/** How long to wait before the one retry, which is about how long a supervised daemon takes to come back. */
const RETRY_DELAY_MS = 1200

/**
 * POST one turn, retrying **once** when it provably never arrived.
 *
 * The front door this project is served through re-handshakes by itself when the daemon restarts, and it says
 * so in its own notes; the composer should be no more brittle than the door. A connection that never opened
 * throws, and a gateway status means the door could not forward, so neither can have started a turn — while an
 * error from the harness itself is **not** retried, because the message may already be in the log.
 */
async function sendTurn(body) {
  for (let attempt = 0; ; attempt += 1) {
    try {
      const response = await fetch('/api/turn', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      })
      if (response.ok || !NOT_FORWARDED.has(response.status) || attempt > 0) return response
    } catch (error) {
      if (attempt > 0) throw error
    }
    await new Promise((resolve) => setTimeout(resolve, RETRY_DELAY_MS))
  }
}

async function runTurn(text, key) {
  const target = key === QUEUE_KEY_NONE ? null : key
  const response = await sendTurn({
    /**
     * The folder is named when a tree node is selected, and the server continues **that folder's**
     * session. With no selection the request is what it always was — a session in the server's own
     * working directory — so a window opened without touching the tree still works.
     *
     * The endpoint and model named here are the composer's own choice, which is what makes the model seat
     * more than a label: the turn asks the backend a person picked, and the server records it on the session
     * so a reload comes back to it.
     */
    prompt: text,
    session: target,
    folder: activeFolder,
    ...selectionForTurn(),
  })
  if (!response.ok) {
    /**
     * The server's own sentence, not only its status.
     *
     * Measured on 2026-10-12: a refusal here was reported as `the server refused it (400)`, and the sentence
     * that said *why* — the name of an endpoint the run did not have — was read and thrown away. A status is
     * not a diagnosis; the body is.
     */
    const detail = await response.text().catch(() => '')
    throw new Error(detail.trim().replace(/\s+/g, ' ').slice(0, 300) || `the server refused it (${response.status})`)
  }
  const reader = response.body.getReader()
  const decoder = new TextDecoder()
  let buffer = ''
  /**
   * Blocks are separated by a **blank line** — two real newlines. Measured while writing this, and the reason
   * the literal is called out: it was written as `'\\n\\n'`, four characters rather than two, so the split
   * never matched and only the first block of the stream was ever read. The live view survived because the
   * `EventSource` renders the events independently; what silently did not work was everything only this
   * response carries — a denial, and the redraw after a turn.
   */
  for (;;) {
    const { value, done } = await reader.read()
    if (done) break
    buffer += decoder.decode(value, { stream: true })
    for (const block of buffer.split('\n\n')) {
      if (!block.trim().startsWith('event:')) continue
      const name = /event: (.+)/.exec(block)?.[1]
      const data = /data: (.+)/.exec(block)?.[1]
      if (!data) continue
      const payload = JSON.parse(data)
      if (name === 'session') {
        /**
         * A turn with no session starts one, and the panel follows it: the queue that was loose while the
         * turn ran belongs to the session it created.
         */
        if (target === null) {
          current = payload.session
          adoptSession(payload.session)
        }
      } else if (name === 'done') {
        for (const denial of payload.denials ?? []) add('denied', `${denial.tool}: ${denial.message}`)
        /** The turn is over, so nothing in the transcript is still arriving — DSH's rows become settled. */
        settleChat()
        void renderSettledAnswers()
        /**
         * The turn may have created **this folder's** session, so both the tree and the list are
         * re-read.
         *
         * The view-ring handler sat inside this branch until 2026-10-11, and it was a defect rather
         * than a placement: every finished turn registered another identical listener, and the same
         * registration appeared twice more at the end of the file. Measured: three handlers after one
         * turn, one more per turn after that. It is registered once, below.
         */
        await renderTree()
        await refreshSessions()
      } else if (name === 'cancelled') {
        /**
         * A stopped turn is not an error: the rows settle and the action returns to Send, with no red
         * sentence in the transcript for something the reader asked for.
         */
        settleChat()
        void renderSettledAnswers()
        if (typeof payload.session === 'string') runningSessions.delete(payload.session)
        renderComposerState()
      } else if (name === 'error') {
        add('denied', payload.message)
        /** The turn ended without its own `turn/completed`, so the running state it set is cleared here. */
        if (typeof payload.session === 'string') runningSessions.delete(payload.session)
        renderComposerState()
      }
    }
    const lastBreak = buffer.lastIndexOf('\n\n')
    if (lastBreak !== -1) buffer = buffer.slice(lastBreak + 2)
  }
}

/**
 * The keymap: Enter submits, Shift+Enter is a newline, Ctrl/Cmd+Enter is the accelerated gesture.
 *
 * The composition guard is DSH's and is not optional here: a Chinese or Japanese candidate list is confirmed
 * with Enter, so submitting on a composition-closing key would send half a word. `isComposing` covers most
 * engines and `keyCode === 229` is the legacy signal they emit without it — both are what DSH's keymap checks.
 */
/**
 * DSH's editor grows with the draft and stops at 336px, after which it scrolls.
 *
 * The manual resize handle the composer used to carry is the one thing that cannot coexist with this: it
 * remembers a height the growth logic does not know about, so the two fight and the box jumps. DSH's cap is
 * the contract and is measured from its own page.
 */
const COMPOSER_MAX_HEIGHT = 336
function growComposer() {
  field.style.height = 'auto'
  field.style.height = `${Math.min(field.scrollHeight, COMPOSER_MAX_HEIGHT)}px`
}
function updateSendDisabled() {
  /** While a turn runs the button in that place is Stop, so the disabled state only concerns an idle send. */
  sendButton.disabled = !anyRunning() && field.value.trim().length === 0
}
field.addEventListener('input', () => {
  growComposer()
  updateSendDisabled()
})

field.addEventListener('keydown', (keyEvent) => {
  if (keyEvent.key !== 'Enter') return
  if (keyEvent.isComposing || keyEvent.keyCode === 229) return
  if (keyEvent.shiftKey) return
  keyEvent.preventDefault()
  submitDraft(keyEvent.ctrlKey || keyEvent.metaKey ? 'accelerated' : 'enter')
})

/**
 * The arrow button and plain Enter share one gesture, which is DSH's rule: plain Enter and the primary Send
 * button deliver exactly what Enter would. The button is a submit button inside the form, so the browser
 * gives it click, focus and keyboard behaviour for free.
 */
composer.addEventListener('submit', (submitEvent) => {
  submitEvent.preventDefault()
  submitDraft('enter')
})

/**
 * The submit action's own label, which DSH changes with what pressing it will do.
 *
 * While a turn is running the arrow queues rather than sends, and the accessible name says so — a control
 * whose meaning changed without saying so is the failure this avoids.
 */
function renderComposerState() {
  const running = anyRunning()
  const mode = resolveSubmitMode(BUSY_ENTER, running, 'enter')
  const label = running ? (mode === 'steer' ? 'Steer message' : 'Queue message') : 'Send message'
  sendButton.setAttribute('aria-label', label)
  sendButton.title = running ? `${label} — Enter · Ctrl+Enter sends the queue` : `${label} — Enter · Shift+Enter for a new line`
  /**
   * One action at a time: while a turn runs, the button that can **end** it takes Send's place, which is
   * DSH's own pair. The send button stays in the DOM (hidden) so the form still submits on Enter — Enter
   * queues while a turn runs, exactly as before.
   */
  stopButton.hidden = !running
  sendButton.hidden = running
  updateSendDisabled()
  updateStatusBar()
}

/**
 * The status line under the card: what this page can actually know.
 *
 * DSH prints turns, steps, token rate and context use; heddle records turns and tool calls in the transcript
 * and nothing about tokens yet, so the line prints the two it has and the model that answers. A number this
 * page cannot measure is not printed rather than invented.
 */
function updateStatusBar() {
  if (statusBar === null) return
  let turns = 0
  let steps = 0
  for (const node of log.querySelectorAll('.turn')) {
    if (node.dataset.kind === 'user') turns += 1
    else if (node.dataset.kind === 'tool') steps += 1
  }
  const turnsCell = statusBar.querySelector('[data-stat="turns"]')
  const stepsCell = statusBar.querySelector('[data-stat="steps"]')
  if (turnsCell !== null) turnsCell.textContent = `${turns} turn${turns === 1 ? '' : 's'}`
  if (stepsCell !== null) stepsCell.textContent = `${steps} step${steps === 1 ? '' : 's'}`
}

/** Ask the server to end the turn that is running. A no-op when it already ended is not a failure. */
async function stopTurn() {
  if (composerKey === QUEUE_KEY_NONE) return
  try {
    await fetch(`/api/sessions/${encodeURIComponent(composerKey)}/stop`, { method: 'POST' })
  } catch {
    // The turn may have ended between the click and the request; the stream settles the row either way.
  }
}
stopButton.addEventListener('click', () => void stopTurn())

/**
 * The `+` menu: insert a workspace file's path at the cursor.
 *
 * DSH's `+` opens files and commands; heddle's agent already reads files by path, so the useful half here is
 * the path itself — one level at a time, the same shape `/api/tree` serves, so a large workspace is never
 * walked to open a menu.
 */
let attachTrail = []
function closeAttachMenu() {
  attachMenu.hidden = true
  attachButton.setAttribute('aria-expanded', 'false')
}

  const start = field.selectionStart ?? field.value.length
  const end = field.selectionEnd ?? start
  field.value = `${field.value.slice(0, start)}${text}${field.value.slice(end)}`
  field.focus()
  field.selectionStart = start + text.length
  field.selectionEnd = field.selectionStart

}

  attachMenu.replaceChildren()
  if (attachTrail.length > 0) {
    const up = document.createElement('button')
    up.type = 'button'
    up.textContent = '↑ up'
    up.addEventListener('click', () => {
      attachTrail.pop()
      void openAttachLevel(attachTrail[attachTrail.length - 1] ?? null)
    })
    attachMenu.append(up)
  }
  const children = [...(node?.children ?? []), ...(node?.adHoc ?? [])]

    empty.className = 'meta'
    empty.textContent = 'nothing to insert here'
    attachMenu.append(empty)
    return
  }
  for (const child of children) {
    const item = document.createElement('button')
    item.type = 'button'
    item.textContent = child.kind === 'file' ? child.label : `${child.label}/`
    item.title = child.path
    item.addEventListener('click', () => {
      if (child.kind === 'file') {
        insertAtCursor(child.path)
        closeAttachMenu()
