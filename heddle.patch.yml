# The default profile: the tree a bare `heddle --turn ...` runs.
#
# Every row is addressed by id, so a machine's own layer or a `--patch` overlay
# can restate one row without touching the rest. Row order carries no load
# semantics — a consumer whose service is absent stays pending until it exists —
# so the grouping below is for a reader, not for the loader.
#
# Endpoint URLs and credentials are deliberately absent. The model plugin reads
# its endpoints from $HEDDLE_CONFIG, $HEDDLE_HOME/heddle.json or
# ~/.heddle/heddle.json, with HEDDLE_<ENDPOINT>_* environment overrides.

- insert:
    # The terminal exporter, so a plugin's log lines are visible.
    - id: console
      name: ./src/plugins/console-exporter.ts

    # Sessions: the event log a turn is recorded in.
    - id: session
      name: ./src/plugins/session.ts
      config:
        root: ~/.heddle/sessions

    # The model service: a registry of endpoints, fed from the local file.
    - id: model
      name: ./src/plugins/model.ts

    # Context assembly, the token budget and compaction. It reads the session
    # store and calls the model, so both are declared.
    - id: context
      name: ./src/context/service.ts
      inject: [model, session]
      config:
        contextWindow: 1048576

    # Workspaces: the target folder records, and the folder tree sessions are found in.
    # `generated` names the folders a tool writes, so the tree marks them rather than
    # presenting build output as content — the same declaration the conventions linter
    # takes as `--generated dist`.
    - id: workspace
      name: ./src/workspace/service.ts
      inject: [session]
      config:
        generated: [dist]

    # The sandbox: where a file effect may land.
    - id: sandbox
      name: ./src/sandbox/service.ts
      config:
        mode: workspace-write

    # The approval policy: whether an action may be taken at all.
    - id: approvals
      name: ./src/approvals/service.ts
      config:
        mode: allow

    # Tools: registered as services, gated by both of the two above.
    # Goal management: a persisted objective, its round cap, and two lifetimes kept apart — a durable
    # phase and a process-local activation. It reads and appends session events, so it declares the
    # session. `defaultMaxGoalRounds` is DSH's own default.
    - id: goal
      name: ./src/goal/service.ts
      inject: [session]
      config:
        defaultMaxGoalRounds: 256

    # The round driver: when a session goes idle with an armed goal, it continues the goal one round at a
    # time, attributed in the log. It needs a turn's whole machinery, which it declares.
    - id: goal-driver
      name: ./src/plugins/goal-driver.ts
      inject: [goal, session, model, tools, sandbox, context]

    # The model-facing goal tools, as their own row so a profile can keep the state without the verbs.
    - id: goal-tool
      name: ./src/plugins/goal-tool.ts
      inject: [goal, tools]

    - id: tools
      name: ./src/plugins/tools.ts
      inject: [approvals, sandbox]
      config:
        allow: [write_file, read_file, list_dir, bash]
