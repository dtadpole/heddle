# The default profile: the tree a bare `heddle --turn ...` runs.
#
# Every row is addressed by id, so a machine's own layer or a `--patch` overlay
# can restate one row without touching the rest. Row order carries no load
# semantics — a consumer whose service is absent stays pending until it exists —
# so the grouping below is for a reader, not for the loader.
#
# Endpoint URLs and credentials are deliberately absent. The model plugin reads
# its endpoints from $HEDDLE_CONFIG, $HEDDLE_HOME/heddle.json or
# ~/.heddle/heddle.json, with HEDDLE_<ENDPOINT>_* environment overrides.

- insert:
    # The terminal exporter, so a plugin's log lines are visible.
    - id: console
      name: ./src/plugins/console-exporter.ts

    # Sessions: the event log a turn is recorded in.
    - id: session
      name: ./src/plugins/session.ts
      config:
        root: ~/.heddle/sessions

    # The model service: a registry of endpoints, fed from the local file.
    - id: model
      name: ./src/plugins/model.ts

    # Context assembly, the token budget and compaction. It reads the session
    # store and calls the model, so both are declared.
    - id: context
      name: ./src/context/service.ts
      inject: [model, session]
      config:
        contextWindow: 1048576

    # Workspaces: the target folder records, and the folder tree sessions are found in.
    # `generated` names the folders a tool writes, so the tree marks them rather than
    # presenting build output as content — the same declaration the conventions linter
    # takes as `--generated dist`.
    - id: workspace
      name: ./src/workspace/service.ts
      inject: [session]
      config:
        generated: [dist]

    # The sandbox: where a file effect may land.
    - id: sandbox
      name: ./src/sandbox/service.ts
      config:
        mode: workspace-write

    # The approval policy: whether an action may be taken at all.
    - id: approvals
      name: ./src/approvals/service.ts
      config:
        mode: allow

    # Tools: registered as services, gated by both of the two above.
    # Goal management: a persisted objective, its round cap, and two lifetimes kept apart — a durable
    # phase and a process-local activation. It reads and appends session events, so it declares the
    # session. `defaultMaxGoalRounds` is DSH's own default.
    - id: goal
      name: ./src/goal/service.ts
      inject: [session]
      config:
        defaultMaxGoalRounds: 256

    # Slash commands: the host registry the composer's `/` menu lists and runs — compact, goal, feedback,
    # permission and export (DSH's set). A run is two log-only events, command/run and command/done, so it is
    # recorded without ever reaching the model. Goal, context, model and sandbox are read when a command runs.
    - id: commands
      name: ./src/commands/service.ts
      inject: [session]

    # Plan mode: /plan and /plan off, DSH's plan-mode policy on every request of a session in plan mode, and the
    # exit_plan_mode tool, whose review goes through the user-question channel once one is loaded.
    - id: plan
      name: ./src/plan/service.ts
      inject: [session, commands, tools]

    # The round driver: when a session goes idle with an armed goal, it continues the goal one round at a
    # time, attributed in the log. It needs a turn's whole machinery, which it declares.
    - id: goal-driver
      name: ./src/plugins/goal-driver.ts
      inject: [goal, session, model, tools, sandbox, context]

    # Subagent delegation: the model-facing `delegate` tool. A child runs as a normal turn in its own session,
    # with its parent and depth recorded in the metadata. Limits are the runtime's, not the prompt's.
    - id: subagent-tool
      name: ./src/plugins/subagent-tool.ts
      inject: [tools, session, model, sandbox, context]
      config:
        maxDepth: 2
        maxActive: 1

    # The model-facing goal tools, as their own row so a profile can keep the state without the verbs.
    - id: goal-tool
      name: ./src/plugins/goal-tool.ts
      inject: [goal, tools]

    # The todo list: a session's task plan, as whole-list `todo/write` snapshots folded last-write-wins.
    # Kept per session rather than DSH's per-turn list, so it survives rounds and restarts.
    - id: todo
      name: ./src/todo/service.ts
      inject: [session]

    # The model-facing todo verbs, their own row so the durable list can exist without the tools.
    - id: todo-tool
      name: ./src/plugins/todo-tool.ts
      inject: [todo, tools]

    # The live-turn registry: which sessions have a turn in flight, and the way to interrupt one. Optional —
    # the loop checks for it — so a minimal profile can run turns without interruption.
    - id: turns
      name: ./src/plugins/turns.ts

    # Agent Teams: the durable team service and the nine collaboration tools. Opt-in — a profile that omits
    # this row runs no teams, and the tools then never appear in the model's list.
    - id: team
      name: ./src/plugins/team.ts
      inject: [session, model, tools, context, sandbox]
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536

    - id: tools
      name: ./src/plugins/tools.ts
      inject: [approvals, sandbox]
      config:
        allow:
          [write_file, read_file, list_dir, bash, delegate, spawn_teammate, send_message, list_agents, wait_agent, interrupt_agent, team_task_create, team_task_list, team_task_get, team_task_update]
